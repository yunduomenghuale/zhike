<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>正在进入 - 网络学习小伴侣</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #3498db 0%, #2980b9 100%); font-family: "Microsoft YaHei", Arial, sans-serif; }
        .card { background: white; border-radius: 16px; padding: 48px 56px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
        .spinner { width: 44px; height: 44px; margin: 0 auto 18px; border: 4px solid #e3f0fa; border-top-color: #3498db; border-radius: 50%; animation: spin 0.9s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .msg { color: #2c3e50; font-size: 16px; font-weight: 600; }
        .err { color: #e74c3c; }
        .link { display: inline-block; margin-top: 16px; color: #3498db; text-decoration: none; font-size: 14px; }
        .link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner" id="spinner"></div>
        <div class="msg" id="msg">正在从智课平台免密进入…</div>
        <a class="link" href="login.html" id="loginLink" style="display:none;">前往账号密码登录</a>
    </div>
    <script>
    (function() {
        var msg = document.getElementById('msg');
        var spinner = document.getElementById('spinner');
        var loginLink = document.getElementById('loginLink');

        function fail(text) {
            spinner.style.display = 'none';
            msg.className = 'msg err';
            msg.textContent = text;
            loginLink.style.display = 'inline-block';
        }

        var ticket = new URLSearchParams(window.location.search).get('ticket');
        if (!ticket) { fail('缺少免登票据，请从智课平台重新进入'); return; }

        fetch('api/user/sso-login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ ticket: ticket })
        }).then(function(r) { return r.json(); }).then(function(data) {
            if (!data.token || !data.user) { fail(data.error || '免登失败，请从智课平台重新进入'); return; }
            // 与 login.html 登录成功后的本地会话格式保持一致
            localStorage.setItem('authToken', data.token);
            localStorage.setItem('currentUser', JSON.stringify(data.user));
            localStorage.setItem('lastActivity', String(Date.now()));
            window.location.href = 'index.html';
        }).catch(function() {
            fail('网络异常，免登失败');
        });
    })();
    </script>
</body>
</html>
