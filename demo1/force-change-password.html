<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>首次登录修改密码 - 计算机网络辅助教学平台</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: #0b1120;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            padding: 40px;
            width: 100%;
            max-width: 500px;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-icon {
            font-size: 56px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            color: #e2e8f0;
            margin-bottom: 10px;
            font-size: 24px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-warning {
            background: rgba(251, 191, 36, 0.15);
            border: 1px solid rgba(251, 191, 36, 0.4);
            color: #fbbf24;
            display: block;
        }

        .alert-danger {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.4);
            color: #ef4444;
        }

        .alert-success {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid rgba(34, 197, 94, 0.4);
            color: #22c55e;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #cbd5e1;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #334155;
            border-radius: 10px;
            font-size: 16px;
            background: #1e293b;
            color: #e2e8f0;
            transition: all 0.3s;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #3b82f6;
            color: white;
        }

        .btn-primary:hover {
            background: #2563eb;
        }

        .btn-primary:disabled {
            background: #475569;
            cursor: not-allowed;
        }

        .btn-logout {
            background: transparent;
            color: #94a3b8;
            border: 1px solid #475569;
            margin-top: 12px;
            font-size: 14px;
            padding: 10px;
        }

        .btn-logout:hover {
            background: #1e293b;
            color: #ef4444;
            border-color: #ef4444;
        }

        .password-rules {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 20px;
        }

        .password-rules h3 {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 8px;
        }

        .password-rules ul {
            list-style: none;
            font-size: 13px;
            color: #64748b;
        }

        .password-rules li {
            padding: 2px 0;
        }

        .password-rules li.valid {
            color: #22c55e;
        }

        .password-rules li::before {
            content: "\25CB\00a0";
        }

        .password-rules li.valid::before {
            content: "\2713\00a0";
        }

        .user-info {
            text-align: center;
            margin-bottom: 20px;
            font-size: 14px;
            color: #64748b;
        }

        .user-info span {
            color: #3b82f6;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <div class="logo-icon">🔐</div>
        </div>
        <h1>首次登录修改密码</h1>
        <p class="subtitle">为保障账号安全，请修改初始密码后继续使用</p>

        <div class="alert alert-warning">
            ⚠️ 检测到您正在使用初始密码，为保障账号安全，请先修改密码。修改成功后方可进入系统。
        </div>

        <div id="alertMsg" class="alert"></div>

        <div class="user-info" id="userInfo"></div>

        <div class="password-rules">
            <h3>密码复杂度要求：</h3>
            <ul>
                <li id="rule-len">至少 8 个字符</li>
                <li id="rule-upper">包含大写字母 (A-Z)</li>
                <li id="rule-lower">包含小写字母 (a-z)</li>
                <li id="rule-digit">包含数字 (0-9)</li>
                <li id="rule-special">包含特殊字符 (!@#$%^&*等)</li>
            </ul>
        </div>

        <form id="changePasswordForm" onsubmit="return submitChange(event)">
            <div class="form-group">
                <label for="oldPassword">原密码</label>
                <input type="password" id="oldPassword" placeholder="请输入当前密码" required>
            </div>
            <div class="form-group">
                <label for="newPassword">新密码</label>
                <input type="password" id="newPassword" placeholder="请输入新密码" required oninput="checkRules()">
            </div>
            <div class="form-group">
                <label for="confirmPassword">确认新密码</label>
                <input type="password" id="confirmPassword" placeholder="请再次输入新密码" required>
            </div>
            <button type="submit" class="btn btn-primary" id="submitBtn">确认修改</button>
            <button type="button" class="btn btn-logout" onclick="logout()">放弃修改并退出登录</button>
        </form>
    </div>

    <script src="api-client.js"></script>
    <script>
        var currentUser = null;

        (function init() {
            var stored = localStorage.getItem('currentUser');
            var token = localStorage.getItem('authToken');
            if (!stored || !token) {
                window.location.href = 'login.html';
                return;
            }
            currentUser = JSON.parse(stored);
            var info = document.getElementById('userInfo');
            info.innerHTML = '当前用户：<span>' + (currentUser.name || currentUser.username) + '</span>（' + (currentUser.typeName || currentUser.type) + '）';
        })();

        function checkRules() {
            var pwd = document.getElementById('newPassword').value;
            var rules = [
                { id: 'rule-len', test: pwd.length >= 8 },
                { id: 'rule-upper', test: /[A-Z]/.test(pwd) },
                { id: 'rule-lower', test: /[a-z]/.test(pwd) },
                { id: 'rule-digit', test: /[0-9]/.test(pwd) },
                { id: 'rule-special', test: /[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?~`]/.test(pwd) }
            ];
            rules.forEach(function(r) {
                var el = document.getElementById(r.id);
                if (r.test) el.classList.add('valid');
                else el.classList.remove('valid');
            });
            return rules.every(function(r) { return r.test; });
        }

        function showAlert(msg, type) {
            var el = document.getElementById('alertMsg');
            el.textContent = msg;
            el.className = 'alert alert-' + type;
            el.style.display = 'block';
        }

        async function submitChange(event) {
            event.preventDefault();
            var oldPwd = document.getElementById('oldPassword').value;
            var newPwd = document.getElementById('newPassword').value;
            var confirmPwd = document.getElementById('confirmPassword').value;

            if (!oldPwd || !newPwd || !confirmPwd) {
                showAlert('请填写所有字段', 'danger');
                return false;
            }
            if (!checkRules()) {
                showAlert('新密码不满足复杂度要求', 'danger');
                return false;
            }
            if (newPwd !== confirmPwd) {
                showAlert('两次输入的新密码不一致', 'danger');
                return false;
            }
            if (newPwd === oldPwd) {
                showAlert('新密码不能与原密码相同', 'danger');
                return false;
            }

            var btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = '正在修改...';

            try {
                var result = await ApiClient.post('/api/user/change-password', {
                    username: currentUser.username,
                    oldPassword: oldPwd,
                    newPassword: newPwd
                });
                if (result.success) {
                    showAlert('密码修改成功！正在跳转...', 'success');
                    setTimeout(function() {
                        if (currentUser.type === 'admin') window.location.href = 'teacher.html';
                        else if (currentUser.type === 'teacher') window.location.href = 'teacher.html';
                        else window.location.href = 'index.html';
                    }, 1500);
                } else {
                    showAlert(result.error || '修改失败', 'danger');
                    btn.disabled = false;
                    btn.textContent = '确认修改';
                }
            } catch (e) {
                showAlert('网络错误，请重试', 'danger');
                btn.disabled = false;
                btn.textContent = '确认修改';
            }
            return false;
        }

        function logout() {
            localStorage.removeItem('authToken');
            localStorage.removeItem('currentUser');
            localStorage.removeItem('lastActivity');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
