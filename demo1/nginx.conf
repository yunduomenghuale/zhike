
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # HTTP -> HTTPS redirect (except cert download)
    server {
        listen       8090;
        server_name  _;

        root C:/nginx/demo1;

        location = /server.crt {
            add_header Content-Disposition "attachment; filename=server.crt";
            add_header Content-Type "application/x-x509-ca-cert";
        }

        location = /install-cert.html {
            charset utf-8;
        }

        location = /cert-check.html {
            charset utf-8;
        }

        location / {
            rewrite ^ /cert-check.html last;
        }
    }

    # HTTPS server
    server {
        listen       8443 ssl;
        server_name  _;

        ssl_certificate      C:/nginx/ssl/server.crt;
        ssl_certificate_key  C:/nginx/ssl/server.key;
        ssl_protocols        TLSv1.2 TLSv1.3;
        ssl_ciphers          HIGH:!aNULL:!MD5;
        ssl_session_cache    shared:SSL:10m;
        ssl_session_timeout  10m;

        root C:/nginx/demo1;
        index index.html;
        charset utf-8;

        location ^~ /api/ {
            proxy_pass http://127.0.0.1:8081/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            client_max_body_size 200m;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(css|js)$ {
            add_header Cache-Control "no-cache, no-store, must-revalidate";
        }

        location ~* \.(jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1h;
            add_header Cache-Control "public";
        }

        location ~* \.(xlsx|xls)$ {
            add_header Content-Type "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
        }

        error_page 404 /404.html;
        location = /404.html {
            internal;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root html;
        }
    }

