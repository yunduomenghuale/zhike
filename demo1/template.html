<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>导入模板 - 计算机网络辅助教学平台</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 40px 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        .back-btn {
            display: inline-block;
            padding: 8px 18px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            margin-bottom: 15px;
        }
        .back-btn:hover { background: #357abd; }
        h1 {
            color: #4a90e2;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
        }
        .info h2 {
            color: #333;
            margin-bottom: 15px;
            font-size: 18px;
        }
        .info ul {
            margin-left: 20px;
            line-height: 1.8;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }
        th, td {
            padding: 12px;
            text-align: left;
            border: 1px solid #ddd;
        }
        th {
            background: #4a90e2;
            color: white;
            font-weight: bold;
        }
        button {
            display: block;
            width: 100%;
            max-width: 300px;
            margin: 20px auto;
            padding: 15px 30px;
            background: #4a90e2;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }
        button:hover {
            background: #357abd;
            transform: translateY(-2px);
        }
        .note {
            background: #fff3cd;
            border-left: 4px solid #ffc107;
            padding: 15px;
            margin: 20px 0;
            border-radius: 5px;
        }
        .note strong {
            color: #856404;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="teacher.html" class="back-btn">← 返回</a>
        <h1>学生信息导入模板</h1>

        <div class="info">
            <h2>📋 填写说明：</h2>
            <ul>
                <li><strong>学号</strong>：学生学号（必填，作为登录用户名）</li>
                <li><strong>姓名</strong>：学生姓名（必填）</li>
                <li><strong>专业</strong>：学生专业（必填）</li>
                <li><strong>班级</strong>：班级名称（必填，导入时会被替换为选择的班级）</li>
            </ul>
        </div>

        <h2 style="color: #333; margin: 20px 0;">模板示例：</h2>
        
        <table>
            <thead>
                <tr>
                    <th>学号</th>
                    <th>姓名</th>
                    <th>专业</th>
                    <th>班级</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>2021001</td>
                    <td>张三</td>
                    <td>计算机科学与技术</td>
                    <td>计算机2021-1班</td>
                </tr>
                <tr>
                    <td>2021002</td>
                    <td>李四</td>
                    <td>软件工程</td>
                    <td>计算机2021-1班</td>
                </tr>
                <tr>
                    <td>2021003</td>
                    <td>王五</td>
                    <td>网络工程</td>
                    <td>计算机2021-1班</td>
                </tr>
            </tbody>
        </table>

        <div class="note">
            <strong>💡 提示：</strong>
            <ul style="margin-top: 10px; margin-left: 20px;">
                <li>默认密码为学号，学生可以首次登录后修改</li>
                <li>学号必须唯一，不能重复</li>
                <li>导入时请先选择目标班级</li>
            </ul>
        </div>

        <button onclick="downloadTemplate()">📥 点击下载Excel模板</button>
    </div>

    <script>
        function downloadTemplate() {
            var csvContent = '\uFEFF学号,姓名,专业,班级\n';
            csvContent += '2021001,张三,计算机科学与技术,计算机2021-1班\n';
            csvContent += '2021002,李四,软件工程,计算机2021-1班\n';
            csvContent += '2021003,王五,网络工程,计算机2021-1班\n';
            var blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            var link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = '学生信息导入模板.csv';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(link.href);
        }
    </script>

    <script src="chat-knowledge.js"></script>

    <script src="kb-loader.js"></script>
    <script src="chat-agent.js"></script>
</body>
</html>
