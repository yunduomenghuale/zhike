<html lang="zh-CN">
<head>

    <script src="../auth-check.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #0a0e27; color: #e0e0e0; min-height: 100vh; }
        .main-layout { display: grid; grid-template-columns: 280px 1fr 300px; grid-template-rows: auto 1fr; height: calc(100vh - 50px); }
        .top-bar { grid-column: 1/-1; background: linear-gradient(135deg, #1a1f3a 0%, #2d1b4e 100%); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #4a90e2; }
        .top-bar h1 { font-size: 18px; color: #38bdf8; }
        .top-bar .exp-info { font-size: 13px; color: #94a3b8; }
        .step-panel { background: #111633; border-right: 1px solid #1e2a5a; overflow-y: auto; padding: 10px; }
        .step-panel h3 { color: #38bdf8; font-size: 14px; padding: 8px; margin-bottom: 5px; border-bottom: 1px solid #1e2a5a; }
        .float-hint-panel { position: absolute; top: 10px; right: 10px; width: 340px; max-height: 200px; background: rgba(17,22,51,0.6); border: 1px solid rgba(245,158,11,0.4); border-radius: 10px; z-index: 9998; box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
        .float-hint-panel.hidden { display: none; }
        .float-hint-header { padding: 8px 12px; background: rgba(245,158,11,0.1); display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; border-bottom: 1px solid rgba(245,158,11,0.3); }
        .float-hint-header span { color: #fbbf24; font-size: 13px; font-weight: bold; }
        .float-hint-close { background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
        .float-hint-close:hover { color: #ef4444; }
        .float-hint-body { padding: 10px 12px; font-size: 12px; color: #fbbf24; line-height: 1.7; overflow-y: auto; max-height: 150px; white-space: pre-line; }
        .step-item { padding: 8px 12px; margin: 3px 0; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-size: 12px; border-left: 3px solid transparent; line-height: 1.4; }
        .step-item:hover { background: rgba(56,189,248,0.1); }
        .step-item.active { background: rgba(56,189,248,0.15); border-left-color: #38bdf8; color: #fff; }
        .step-item.completed { border-left-color: #22c55e; }
        .step-item.completed .step-icon { color: #22c55e; }
        .step-item.failed { border-left-color: #ef4444; }
        .step-icon { margin-right: 6px; font-size: 13px; }
        .sim-area { background: #0d1230; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .sim-canvas-wrap { height: 320px; min-height: 260px; position: relative; flex-shrink: 0; }
        #simCanvas { width: 100%; height: 100%; display: block; }
        .console-area { flex: 1; background: #0b1025; border-top: 1px solid #1e2a5a; display: flex; flex-direction: column; min-height: 220px; }
        .console-header { padding: 6px 12px; background: #0f1535; font-size: 12px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .console-output { flex: 1; overflow-y: auto; padding: 8px 12px; background: #0a0f22; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.6; color: #a3e635; }
        .console-input-wrap { display: flex; border-top: 1px solid #1e2a5a; background: #0c1128; }
        .console-prompt { padding: 8px; color: #38bdf8; font-family: 'Consolas', monospace; font-size: 13px; white-space: nowrap; }
        .console-input { flex: 1; background: transparent; border: none; color: #a3e635; font-family: 'Consolas', monospace; font-size: 13px; padding: 8px 4px; outline: none; }
        .info-panel { background: #111633; border-left: 1px solid #1e2a5a; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
        .panel-card { background: #0d1230; border: 1px solid #1e2a5a; border-radius: 8px; overflow: hidden; }
        .panel-card-header { padding: 7px 12px; background: #151b3d; font-size: 12px; font-weight: bold; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .panel-card-body { padding: 8px 10px; font-size: 11px; max-height: 200px; overflow-y: auto; }
        .info-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .info-table th { background: #1a2150; color: #94a3b8; padding: 5px 6px; text-align: left; font-weight: normal; border-bottom: 1px solid #1e2a5a; }
        .info-table td { padding: 4px 6px; border-bottom: 1px solid #0d1230; color: #a3e635; font-family: 'Consolas', monospace; font-size: 11px; }
        .info-table tr.new-entry td { animation: macHighlight 1.5s ease; }
        @keyframes macHighlight { 0% { background: rgba(56,189,248,0.3); } 100% { background: transparent; } }
        .eval-result { padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-top: 4px; }
        .eval-pass { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
        .eval-fail { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.3s; }
        .btn-primary { background: #4a90e2; color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-warning { background: #f59e0b; color: #1a1a1a; }
        .btn-warning:hover { background: #d97706; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .score-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .score-bar-track { flex: 1; height: 8px; background: #1a2150; border-radius: 4px; overflow: hidden; }
        .score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; background: linear-gradient(90deg, #4a90e2, #22c55e); }
        .score-text { font-size: 14px; font-weight: bold; color: #38bdf8; min-width: 40px; text-align: right; }
        .sw-tab { padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 10px; border: 1px solid #1e2a5a; background: #0d1230; color: #94a3b8; transition: all 0.3s; }
        .sw-tab.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        .sw-tab:hover { background: #1a2150; }
        .sw-tab.active:hover { background: #357abd; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #151b3d; border: 2px solid #4a90e2; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; text-align: center; }
        .modal-box h2 { color: #38bdf8; margin-bottom: 15px; }
        .modal-box p { color: #94a3b8; margin-bottom: 20px; line-height: 1.8; }
        .modal-box .final-score { font-size: 48px; color: #22c55e; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>实验七：计算机网络综合实系统</h1>
        <div class="exp-info">计算机网络实验教| 虚拟仿真实验 | 配套教材：基于华为eNSP</div>
    </div>

    <div class="main-layout">
    <div class="step-panel">
        <h3>实验步骤</h3>
        <div id="stepList"></div>
        <div style="padding:10px; margin-top:8px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验进度</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="progressFill" style="width:0%"></div></div>
                <span class="score-text" id="progressText">0%</span>
            </div>
        </div>
        <div style="padding:10px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验评分</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="scoreFill" style="width:0%"></div></div>
                <span class="score-text" id="scoreText">0</span>
            </div>
        </div>
        <div style="padding:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="resetExperiment()">重置实验</button>
            <button class="btn btn-warning btn-sm" onclick="showDemo()">演示模式</button>
            <button class="btn btn-success btn-sm" onclick="submitExperiment()">提交报告</button>
        </div>
    </div>

    <div class="sim-area">
        <div class="sim-canvas-wrap">
            <canvas id="simCanvas"></canvas>
        </div>
        <div class="float-hint-panel" id="floatHintPanel">
            <div class="float-hint-header" id="floatHintHeader">
                <span>💡 实验提示</span>
                <button class="float-hint-close" onclick="toggleHintPanel()">×</button>
            </div>
            <div class="float-hint-body" id="hintBox">请按照左侧步骤依次完成实验。点击当前步骤可查看详细提示。</div>
        </div>
        <div class="console-area">
            <div class="console-header">
                <span id="consoleTitle">设备控制台</span>
                <div style="display:flex;gap:3px;align-items:center;flex-wrap:wrap;">
                    <span style="font-size:11px;color:#94a3b8;">切换设备：</span>
                    <button class="sw-tab active" data-device="S1" onclick="switchDevice('S1')">S1</button>
                    <button class="sw-tab" data-device="AR1" onclick="switchDevice('AR1')">AR1</button>
                    <button class="sw-tab" data-device="PC1" onclick="switchDevice('PC1')">PC1</button>
                    <button class="sw-tab" data-device="PC2" onclick="switchDevice('PC2')">PC2</button>
                    <button class="sw-tab" data-device="PC3" onclick="switchDevice('PC3')">PC3</button>
                    <button class="sw-tab" data-device="PC4" onclick="switchDevice('PC4')">PC4</button>
                    <button class="sw-tab" data-device="DNS_Server" onclick="switchDevice('DNS_Server')">DNS</button>
                    <button class="sw-tab" data-device="DHCP_Server" onclick="switchDevice('DHCP_Server')">DHCP</button>
                    <button class="sw-tab" data-device="Web_Server" onclick="switchDevice('Web_Server')">Web</button>
                    <button class="sw-tab" data-device="Server" onclick="switchDevice('Server')">外网</button>
                    <button class="btn btn-sm" style="background:#1a2150;color:#94a3b8;margin-left:4px;" onclick="clearConsole()">清屏</button>
                </div>
            </div>
            <div class="console-output" id="consoleOutput"></div>
            <div class="console-input-wrap">
                <span class="console-prompt" id="consolePrompt">&lt;S1&gt;</span>
                <input type="text" class="console-input" id="consoleInput" placeholder="输入命令后按回车..." onkeydown="handleCommand(event)">
            </div>
        </div>
    </div>

    <div class="info-panel">
        <div class="panel-card">
            <div class="panel-card-header"><span>VLAN信息</span></div>
            <div class="panel-card-body" id="vlanInfoBody">
                <table class="info-table">
                    <thead><tr><th>VLAN ID</th><th>名称</th><th>端口</th></tr></thead>
                    <tbody id="vlanTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">VLAN 1 (default)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>路由表</span></div>
            <div class="panel-card-body" id="routeInfoBody">
                <table class="info-table">
                    <thead><tr><th>目的网络</th><th>下一跳</th><th>接口</th></tr></thead>
                    <tbody id="routeTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">(</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>NAT转换表</span></div>
            <div class="panel-card-body" id="natInfoBody">
                <table class="info-table">
                    <thead><tr><th>类型</th><th>内部地址</th><th>外部地址</th></tr></thead>
                    <tbody id="natTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">(</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>DHCP分配表</span></div>
            <div class="panel-card-body" id="dhcpInfoBody">
                <table class="info-table">
                    <thead><tr><th>客户端MAC</th><th>分配IP</th><th>租期</th></tr></thead>
                    <tbody id="dhcpTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">(</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>DNS记录</span></div>
            <div class="panel-card-body" id="dnsInfoBody">
                <table class="info-table">
                    <thead><tr><th>域名</th><th>类型</th><th>IP地址</th></tr></thead>
                    <tbody id="dnsTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">(</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>步骤评判</span></div>
            <div class="panel-card-body" id="evalBody">
                <div style="color:#94a3b8;font-size:12px;">完成步骤后自动评估</div>
            </div>
        </div>
    </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <h2>实验报告</h2>
            <p id="resultSummary"></p>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size:14px;">总分（满分100分）</p>
            <div id="resultDetails" style="text-align:left;margin:15px 0;font-size:13px;color:#94a3b8;line-height:2;"></div>
            <button class="btn btn-primary" onclick="document.getElementById('resultModal').classList.remove('show')">关闭</button>
            <button class="btn btn-success" onclick="LabReportGenerator.showConclusionDialog()" style="margin-left:10px;">生成实验报告</button>
        </div>
    </div>

    <script>
    var DEVICES = {
        AR1: {
            type: 'router', name: 'AR1',
            interfaces: {

    var STEPS = [
        { id:1, title:'在S1上创建VLAN 10/20/30/100', hint:'第1步：切换到S1，依次输入以下命令：\n1. system-view\n2. vlan 10\n3. quit\n4. vlan 20\n5. quit\n6. vlan 30\n7. quit\n8. vlan 100\n9. quit', score:3, evalFn:'evalStep1' },

    function drawTopology() {
        if (!ctx) return;
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        DEVICES.Server.x = w * 0.82; DEVICES.Server.y = h * 0.12;
        DEVICES.AR1.x = w * 0.5; DEVICES.AR1.y = h * 0.15;
        DEVICES.S1.x = w * 0.5; DEVICES.S1.y = h * 0.45;
        DEVICES.PC1.x = w * 0.1; DEVICES.PC1.y = h * 0.82;
        DEVICES.PC2.x = w * 0.25; DEVICES.PC2.y = h * 0.82;
        DEVICES.PC3.x = w * 0.42; DEVICES.PC3.y = h * 0.82;
        DEVICES.PC4.x = w * 0.57; DEVICES.PC4.y = h * 0.82;
        DEVICES.DNS_Server.x = w * 0.75; DEVICES.DNS_Server.y = h * 0.75;
        DEVICES.DHCP_Server.x = w * 0.88; DEVICES.DHCP_Server.y = h * 0.75;
        DEVICES.Web_Server.x = w * 0.81; DEVICES.Web_Server.y = h * 0.92;

        for (var i = 0; i < LINKS.length; i++) {
            var lk = LINKS[i];
            var fd = DEVICES[lk.from], td = DEVICES[lk.to];
            drawLink(fd.x, fd.y, td.x, td.y, lk.fromPort);
        }

        drawRouter(DEVICES.AR1.x, DEVICES.AR1.y, 'AR1');
        drawSwitch(DEVICES.S1.x, DEVICES.S1.y, 'S1');
        drawPC(DEVICES.PC1.x, DEVICES.PC1.y, 'PC1', DEVICES.PC1);

        drawPC(DEVICES.PC3.x, DEVICES.PC3.y, 'PC3', DEVICES.PC3);
        drawPC(DEVICES.PC4.x, DEVICES.PC4.y, 'PC4', DEVICES.PC4);
        drawServer(DEVICES.DNS_Server.x, DEVICES.DNS_Server.y, 'DNS_Server', '#e879f9');
        drawServer(DEVICES.DHCP_Server.x, DEVICES.DHCP_Server.y, 'DHCP_Server', '#38bdf8');
        drawServer(DEVICES.Web_Server.x, DEVICES.Web_Server.y, 'Web_Server', '#4ade80');
        drawServer(DEVICES.Server.x, DEVICES.Server.y, 'Internet', '#fbbf24');

        drawFramePackets();
    }

    function drawTextWithShadow(text, x, y, color, font) {
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawRouter(x, y, name) {
        var rw = 110, rh = 55;
        ctx.fillStyle = '#3a1a1a';
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        roundRect(ctx, x - rw/2, y - rh/2, rw, rh, 8);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        drawTextWithShadow('边界路由器NAT', x, y + 10, '#fca5a5', '10px Microsoft YaHei');
    }

    function drawSwitch(x, y, name) {
        var sw = 110, sh = 55;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 2;
        roundRect(ctx, x - sw/2, y - sh/2, sw, sh, 8);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        drawTextWithShadow('核心三层交换机', x, y + 10, '#93c5fd', '10px Microsoft YaHei');
    }

    function drawPC(x, y, name, pc) {
        var pw = 65, ph = 45;
        ctx.fillStyle = '#1e3355';
        ctx.strokeStyle = '#5b8dc9';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - pw/2, y - ph/2, pw, ph, 6);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 11px Microsoft YaHei');
        var ipStr = pc.ip || pc.dhcpIp || 'DHCP';
        drawTextWithShadow(ipStr, x, y + 5, '#ffe066', '9px Consolas');
        drawTextWithShadow('VLAN' + pc.vlan, x, y + 17, '#94a3b8', '9px Microsoft YaHei');
    }

    function drawServer(x, y, name, accentColor) {
        var sw2 = 80, sh2 = 50;
        ctx.fillStyle = '#1a2a3a';
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - sw2/2, y - sh2/2, sw2, sh2, 6);
        ctx.fill(); ctx.stroke();
        var displayName = name === 'Internet' ? 'Internet' : name.replace('_Server','');
        drawTextWithShadow(displayName, x, y - 8, '#ffffff', 'bold 11px Microsoft YaHei');
        var dev = DEVICES[name];
        if (dev && dev.ip) {
            drawTextWithShadow(dev.ip, x, y + 8, accentColor, '9px Consolas');
        } else if (name === 'Internet') {
            drawTextWithShadow('8.8.8.8', x, y + 8, accentColor, '9px Consolas');
        }
    }

    function drawLink(x1, y1, x2, y2, port) {
        ctx.beginPath();
        ctx.strokeStyle = '#4a6a9a';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        if (port) drawTextWithShadow(port, mx, my - 8, '#ffe066', 'bold 9px Consolas');
    }

    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    function drawFramePackets() {
        for (var i = 0; i < framePackets.length; i++) {
            var p = framePackets[i];
            ctx.save();
            ctx.globalAlpha = p.alpha || 1;
            ctx.fillStyle = p.color || '#fbbf24';
            ctx.strokeStyle = p.borderColor || '#f59e0b';
            ctx.lineWidth = 2;
            var lbl = p.label || 'PKT';
            ctx.font = 'bold 13px Consolas';
            var tw = ctx.measureText(lbl).width;
            var pw = tw + 20, ph = 28;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, p.x - pw/2, p.y - ph/2, pw, ph, 6);
            ctx.fill(); ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            drawTextWithShadow(lbl, p.x, p.y, '#ffffff', 'bold 13px Consolas');
            ctx.restore();
        }
    }

    var deviceViewState = {};

    function switchDevice(devName) {
        if (currentDevice && currentDevice !== devName) {
            deviceViewState[currentDevice] = { viewMode: viewMode, currentInterface: currentInterface, currentVlan: currentVlan };
        }
        currentDevice = devName;
        if (deviceViewState[devName]) {
            viewMode = deviceViewState[devName].viewMode;
            currentInterface = deviceViewState[devName].currentInterface;
            currentVlan = deviceViewState[devName].currentVlan;
        } else {
            viewMode = 'user';
            currentInterface = '';
            currentVlan = 0;
        }

        var tabs = document.querySelectorAll('.sw-tab');
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('active', tabs[i].getAttribute('data-device') === devName);
        }

        updatePrompt();
        updateInfoPanels();

        if (!consoleHistory[devName]) consoleHistory[devName] = [];
        var output = document.getElementById('consoleOutput');
        output.innerHTML = '';
        for (var j = 0; j < consoleHistory[devName].length; j++) {
            var line = document.createElement('div');
            line.textContent = consoleHistory[devName][j];
            output.appendChild(line);
        }
        output.scrollTop = output.scrollHeight;
    }

    function updatePrompt() {
        var prompt = document.getElementById('consolePrompt');
        var dev = DEVICES[currentDevice];
        if (!dev) { prompt.textContent = '>'; return; }

        if (dev.type === 'pc' || dev.type === 'dns' || dev.type === 'dhcp' || dev.type === 'web' || dev.type === 'server') {
            prompt.textContent = currentDevice + '>';
        } else if (dev.type === 'router') {
            if (viewMode === 'user') prompt.textContent = '<' + currentDevice + '>';
            else if (viewMode === 'system') {
                if (currentInterface) prompt.textContent = '[' + currentDevice + '-' + currentInterface + ']';
                else prompt.textContent = '[' + currentDevice + ']';
            }
        } else if (dev.type === 'switch') {
            if (viewMode === 'user') prompt.textContent = '<' + currentDevice + '>';
            else if (viewMode === 'system') {
                if (currentInterface) prompt.textContent = '[' + currentDevice + '-' + currentInterface + ']';
                else if (currentVlan) prompt.textContent = '[' + currentDevice + '-vlan' + currentVlan + ']';
                else prompt.textContent = '[' + currentDevice + ']';
            }
        }
    }

    function consolePrint(text) {
        var output = document.getElementById('consoleOutput');
        var line = document.createElement('div');
        line.textContent = text;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
        if (!consoleHistory[currentDevice]) consoleHistory[currentDevice] = [];
        consoleHistory[currentDevice].push(text);
    }

    function clearConsole() {
        document.getElementById('consoleOutput').innerHTML = '';
        consoleHistory[currentDevice] = [];
    }

    function handleCommand(event) {
        if (event.key !== 'Enter') return;
        var input = document.getElementById('consoleInput');
        var cmd = input.value.trim();
        input.value = '';
        if (!cmd) return;

        var promptText = document.getElementById('consolePrompt').textContent;
        consolePrint(promptText + cmd);

        var dev = DEVICES[currentDevice];
        if (dev.type === 'switch') handleSwitchCommand(cmd);
        else if (dev.type === 'router') handleRouterCommand(cmd);
        else if (dev.type === 'pc') handlePCCommand(cmd);
        else if (dev.type === 'dns') handleDnsCommand(cmd);
        else if (dev.type === 'dhcp') handleDhcpCommand(cmd);
        else if (dev.type === 'web') handleWebCommand(cmd);
        else if (dev.type === 'server') handleServerCommand(cmd);

        autoEvaluate();
    }

    function handleSwitchCommand(cmd) {
        var parts = cmd.split(/\s+/);
        var base = parts[0].toLowerCase();

        if (viewMode === 'user') {
            if (base === 'display' || base === 'show') {
                handleSwitchDisplay(parts);
            } else if (base === 'system-view') {
                viewMode = 'system';
                currentInterface = '';
                currentVlan = 0;
                consolePrint('Enter system view, return user view with Ctrl+Z.');
                updatePrompt();
            } else if (base === '?' || base === 'help') {
                consolePrint('可用命令: display vlan, display ip interface brief, display ip routing-table, system-view');
            } else {
                consolePrint('错误: 无法识别的命"' + cmd + '"');
            }
        } else if (viewMode === 'system') {
            if (currentInterface && currentInterface.indexOf('Vlanif') === 0) {
                handleVlanIfCommand(parts, base);
            } else if (currentInterface) {
                handleSwInterfaceCommand(parts, base);
            } else if (currentVlan) {
                handleVlanViewCommand(parts, base);
            } else {
                handleSwSystemCommand(parts, base, cmd);
            }
        }
    }

    function handleSwSystemCommand(parts, base, cmd) {
        if (base === 'vlan') {
            var vid = parseInt(parts[1]);
            if (isNaN(vid) || vid < 1 || vid > 4094) { consolePrint('错误: 无效的VLAN ID'); return; }
            if (!DEVICES.S1.vlans[vid]) DEVICES.S1.vlans[vid] = { name: 'VLAN ' + vid, ports: [] };
            currentVlan = vid;
            consolePrint('Enter VLAN ' + vid + ' view');
            updatePrompt();
            checkVlanCreated();
        } else if (base === 'interface') {
            if (parts.length < 2) { consolePrint('用法: interface <接口'); return; }
            var iface = parts[1];
            var vnum = 0;
            if (iface.toLowerCase() === 'vlanif' && parts[2]) {
                vnum = parseInt(parts[2]);
            } else if (iface.match(/^Vlanif\d+$/i)) {
                vnum = parseInt(iface.replace(/^Vlanif/i, ''));
            }
            if (vnum > 0) {
                if (!DEVICES.S1.vlans[vnum]) { consolePrint('错误: VLAN ' + vnum + ' 不存在'); return; }


                currentInterface = 'Vlanif' + vnum;
                if (!DEVICES.S1.vlanIf[vnum]) DEVICES.S1.vlanIf[vnum] = { ip: '', mask: '' };
                consolePrint('Enter interface Vlanif' + vnum + ' view');
                updatePrompt();
            } else if (iface.match(/^G0\/0\/\d+$/) || iface.match(/^GigabitEthernet0\/0\/\d+$/)) {
                iface = iface.replace(/^GigabitEthernet/, 'G');
                if (!DEVICES.S1.portMode[iface]) { consolePrint('错误: 接口 ' + iface + ' 不存在'); return; }


                currentInterface = iface;
                consolePrint('Enter interface ' + iface + ' view');
                updatePrompt();
            } else {
                consolePrint('错误: 无效的接口名');
            }
        } else if (base === 'ip' && parts[1] === 'route-static') {
            var dest = parts[2], mask2 = parts[3], gw = parts[4];
            if (!dest || !mask2 || !gw) { consolePrint('用法: ip route-static <目的网络> <掩码> <下一'); return; }
            DEVICES.S1.routes.push({ dest: dest, mask: mask2, gw: gw, iface: '' });
            consolePrint('静态路由已添加: ' + dest + ' ' + mask2 + ' via ' + gw);
            checkRoutes();
        } else if (base === 'display' || base === 'show') {
            handleSwitchDisplay(parts);
        } else if (base === 'quit' || base === 'return') {
            viewMode = 'user';
            currentInterface = '';
            currentVlan = 0;
            consolePrint('Return to user view.');
            updatePrompt();
        } else if (base === '?' || base === 'help') {
            consolePrint('可用命令: vlan <ID>, interface G0/0/X|VlanifX, ip route-static, display, quit');
        } else {
            consolePrint('错误: 无法识别的命"' + cmd + '"');
        }
    }

    function handleVlanViewCommand(parts, base) {
        if (base === 'name') {
            var vname = parts.slice(1).join(' ');
            if (currentVlan && DEVICES.S1.vlans[currentVlan]) {
                DEVICES.S1.vlans[currentVlan].name = vname;
                consolePrint('VLAN ' + currentVlan + ' 名称已设置为 ' + vname);
            }
        } else if (base === 'quit') {
            currentVlan = 0;
            consolePrint('Return to system view.');
            updatePrompt();
        } else {
            consolePrint('用法: name <VLAN名称> | quit');
        }
    }

    function handleSwInterfaceCommand(parts, base) {
        var pt = currentInterface;
        if (base === 'port') {
            if (parts[1] === 'link-type') {
                var mode = parts[2] ? parts[2].toLowerCase() : '';
                if (mode === 'access' || mode === 'trunk') {
                    DEVICES.S1.portMode[pt] = mode;
                    consolePrint('接口 ' + pt + ' 链路类型已设置为 ' + mode);
                } else {
                    consolePrint('用法: port link-type access|trunk');
                }
            } else if (parts[1] === 'default' && parts[2] === 'vlan') {
                var vid = parseInt(parts[3]);
                if (isNaN(vid) || !DEVICES.S1.vlans[vid]) { consolePrint('错误: VLAN ' + parts[3] + ' 不存在'); return; }


                DEVICES.S1.portVlan[pt] = vid;
                DEVICES.S1.portMode[pt] = 'access';
                if (DEVICES.S1.vlans[vid].ports.indexOf(pt) < 0) DEVICES.S1.vlans[vid].ports.push(pt);
                consolePrint('接口 ' + pt + ' 已划入VLAN ' + vid);
                checkPortVlan();
            } else if (parts[1] === 'trunk' && parts[2] === 'allow-pass' && parts[3] === 'vlan') {
                var allowed = [];
                for (var i = 4; i < parts.length; i++) { var v = parseInt(parts[i]); if (!isNaN(v)) allowed.push(v); }
                DEVICES.S1.portVlan[pt] = allowed;
                DEVICES.S1.portMode[pt] = 'trunk';
                consolePrint('接口 ' + pt + ' Trunk允许VLAN: ' + allowed.join(' '));
            } else {
                consolePrint('用法: port link-type access|trunk | port default vlan <ID>');
            }
        } else if (base === 'quit') {
            currentInterface = '';
            consolePrint('Return to system view.');
            updatePrompt();
        } else {
            consolePrint('错误: 无法识别的命');
        }
    }

    function handleVlanIfCommand(parts, base) {
        var vnum = parseInt(currentInterface.replace('Vlanif',''));
        if (base === 'ip' && parts[1] === 'address') {
            var ip = parts[2], msk = parts[3];
            if (!ip || !msk) { consolePrint('用法: ip address <IP> <掩码|前缀长度>'); return; }
            if (msk.match(/^\d+$/) && parseInt(msk) <= 32) {
                msk = prefixToMask(parseInt(msk));
            }
            DEVICES.S1.vlanIf[vnum] = { ip: ip, mask: msk };
            consolePrint('Vlanif' + vnum + ' IP地址已设置为 ' + ip + ' ' + msk);
            checkVlanIfConfig();
        } else if (base === 'quit') {
            currentInterface = '';
            consolePrint('Return to system view.');
            updatePrompt();
        } else if (base === '?' || base === 'help') {
            consolePrint('可用命令: ip address <IP> <掩码>, quit');
        } else {
            consolePrint('错误: 无法识别的命');
        }
    }

    function handleSwitchDisplay(parts) {
        var sub = parts.length > 1 ? parts[1].toLowerCase() : '';
        var sub2 = parts.length > 2 ? parts[2].toLowerCase() : '';
        if (sub === 'vlan') {
            consolePrint('VLAN ID  Name        Ports');
            consolePrint('-----------------------------------------------');
            for (var vid in DEVICES.S1.vlans) {

    function findPingPath(pcName, targetIp) {

        if (pc.x !== undefined) waypoints.push({ x: pc.x, y: pc.y });
        if (DEVICES.S1.x !== undefined) waypoints.push({ x: DEVICES.S1.x, y: DEVICES.S1.y });

        if (targetIp === '8.8.8.8') {
            if (DEVICES.AR1.x !== undefined) waypoints.push({ x: DEVICES.AR1.x, y: DEVICES.AR1.y });
            if (DEVICES.Server.x !== undefined) waypoints.push({ x: DEVICES.Server.x, y: DEVICES.Server.y });
        } else if (targetIp === '10.0.0.1' || targetIp === DEVICES.AR1.interfaces['G0/0/0'].ip) {
            if (DEVICES.AR1.x !== undefined) waypoints.push({ x: DEVICES.AR1.x, y: DEVICES.AR1.y });
        } else if (targetIp === '10.0.3.10') {
            if (DEVICES.DNS_Server.x !== undefined) waypoints.push({ x: DEVICES.DNS_Server.x, y: DEVICES.DNS_Server.y });
        } else if (targetIp === '10.0.3.20') {
            if (DEVICES.DHCP_Server.x !== undefined) waypoints.push({ x: DEVICES.DHCP_Server.x, y: DEVICES.DHCP_Server.y });
        } else if (targetIp === '10.0.3.30') {
            if (DEVICES.Web_Server.x !== undefined) waypoints.push({ x: DEVICES.Web_Server.x, y: DEVICES.Web_Server.y });
        } else {
            var pcNames = ['PC1','PC2','PC3','PC4'];
            for (var i = 0; i < pcNames.length; i++) {
                var tp = DEVICES[pcNames[i]];
                if (tp.ip === targetIp || tp.dhcpIp === targetIp) {
                    if (tp.x !== undefined) waypoints.push({ x: tp.x, y: tp.y });
                    break;
                }
            }
        }

        return waypoints;
    }

    function animatePing(waypoints, srcPc, targetIp, callback) {
        if (animating || waypoints.length < 2) { if (callback) callback(); return; }
        animating = true;

        var packet = { x: waypoints[0].x, y: waypoints[0].y, color: '#fbbf24', borderColor: '#f59e0b', label: 'ICMP', alpha: 1 };
        framePackets = [packet];

        var totalSegments = waypoints.length - 1;
        var currentSegment = 0;
        var step = 0;
        var stepsPerSegment = 25;

        function animate() {
            step++;
            var t = easeInOut(step / stepsPerSegment);
            var from = waypoints[currentSegment];
            var to = waypoints[currentSegment + 1];
            packet.x = from.x + (to.x - from.x) * t;
            packet.y = from.y + (to.y - from.y) * t;
            drawTopology();

            if (step >= stepsPerSegment) {
                currentSegment++;
                step = 0;
                if (currentSegment >= totalSegments) {
                    setTimeout(function() {
                        packet.color = '#4ade80';
                        packet.borderColor = '#22c55e';
                        packet.label = 'REPLY';
                        var replySegment = totalSegments - 1;
                        var replyStep = 0;
                        function animateReply() {
                            replyStep++;
                            var rt = easeInOut(replyStep / stepsPerSegment);
                            var rFrom = waypoints[replySegment + 1];
                            var rTo = waypoints[replySegment];
                            packet.x = rFrom.x + (rTo.x - rFrom.x) * rt;
                            packet.y = rFrom.y + (rTo.y - rFrom.y) * rt;
                            drawTopology();
                            if (replyStep >= stepsPerSegment) {
                                replySegment--;
                                replyStep = 0;
                                if (replySegment < 0) {
                                    setTimeout(function() {
                                        framePackets = [];
                                        drawTopology();
                                        animating = false;
                                        if (callback) callback();
                                    }, 200);
                                    return;
                                }
                                setTimeout(function() { animFrame = requestAnimationFrame(animateReply); }, 1000);
                            } else {
                                animFrame = requestAnimationFrame(animateReply);
                            }
                        }
                        animFrame = requestAnimationFrame(animateReply);
                    }, 200);
                    return;
                }
                setTimeout(function() { animFrame = requestAnimationFrame(animate); }, 1000);
            }
            animFrame = requestAnimationFrame(animate);
        }
        animFrame = requestAnimationFrame(animate);
    }

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function handleArpA(pcName) {
        var pc = DEVICES[pcName];
        var keys = Object.keys(pc.arpTable);

    function handleDhcpCommand(cmd) {
        var parts = cmd.split(/\s+/);
        var base = parts[0].toLowerCase();

        if (base === 'dhcp' && parts[1] === 'pool') {
            var poolName = parts[2];
            if (!poolName) { consolePrint('用法: dhcp pool <名称>'); return; }
            if (!DEVICES.DHCP_Server.pools[poolName]) DEVICES.DHCP_Server.pools[poolName] = {};
            currentDhcpPool = poolName;
            consolePrint('进入DHCP地址' + poolName + ' 配置');
        } else if (base === 'network') {
            if (!currentDhcpPool) { consolePrint('请先进入DHCP地址池配置'); return; }

            var net = parts[1], msk = parts[2];
            if (msk && msk.match(/^\d+$/) && parseInt(msk) <= 32) msk = prefixToMask(parseInt(msk));
            DEVICES.DHCP_Server.pools[currentDhcpPool].network = net;
            DEVICES.DHCP_Server.pools[currentDhcpPool].mask = msk || '255.255.255.0';
            consolePrint('网络: ' + net + ' ' + (msk || '255.255.255.0'));
        } else if (base === 'gateway') {
            if (!currentDhcpPool) { consolePrint('请先进入DHCP地址池配置'); return; }

            DEVICES.DHCP_Server.pools[currentDhcpPool].gateway = parts[1];
            consolePrint('网关: ' + parts[1]);

            if (!currentDhcpPool) { consolePrint('请先进入DHCP地址池配置'); return; }

    function prefixToMask(prefix) {
        var masks = ['0.0.0.0','128.0.0.0','192.0.0.0','224.0.0.0','240.0.0.0','248.0.0.0','252.0.0.0','254.0.0.0','255.0.0.0','255.128.0.0','255.192.0.0','255.224.0.0','255.240.0.0','255.248.0.0','255.252.0.0','255.254.0.0','255.255.0.0','255.255.128.0','255.255.192.0','255.255.224.0','255.255.240.0','255.255.248.0','255.255.252.0','255.255.254.0','255.255.255.0','255.255.255.128','255.255.255.192','255.255.255.224','255.255.255.240','255.255.255.248','255.255.255.252','255.255.255.254','255.255.255.255'];
        return masks[prefix] || '255.255.255.0';
    }

    function getNetwork(ip, mask) {
        var ipParts = ip.split('.').map(Number);
        var maskParts = mask.split('.').map(Number);
        var net = [];
        for (var i = 0; i < 4; i++) net.push(ipParts[i] & maskParts[i]);
        return net.join('.');
    }

    function padR(str, len) {
        str = String(str);
        while (str.length < len) str += ' ';
        return str;
    }

    function renderStepList() {
        var html = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            var cls = '';
            if (s.id === currentStep) cls = 'active';
            if (stepResults[s.id] === 'pass') cls += ' completed';
            if (stepResults[s.id] === 'fail') cls += ' failed';
            var icon = stepResults[s.id] === 'pass' ? '✅' : stepResults[s.id] === 'fail' ? '❌' : (s.id === currentStep ? '▶️' : '⏳');
            html += '<div class="step-item ' + cls + '" onclick="selectStep(' + s.id + ')">';
            html += '<span class="step-icon">' + icon + '</span>';
            html += '步骤' + s.id + '. ' + s.title;
            html += '</div>';
        }
        document.getElementById('stepList').innerHTML = html;
    }

    function selectStep(id) {
        currentStep = id;

        renderStepList();

    function autoEvaluate() {
        var changed = false;
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id]) continue;
            var result = window[s.evalFn]();
            if (result === 'pass' || result === 'fail') {
                stepResults[s.id] = result;
                showEvalResult(s.id, result);
                changed = true;
            }
        }
        if (changed) {
            var nextStep = 0;
            for (var j = 0; j < STEPS.length; j++) {
                if (!stepResults[STEPS[j].id]) { nextStep = STEPS[j].id; break; }
            }
            if (nextStep) { currentStep = nextStep; document.getElementById('hintBox').textContent = STEPS[nextStep - 1].hint; }
        }
        updateProgress();
        renderStepList();
    }

    async function submitExperiment() {
        if (labScheduleState === 'not_started') { alert('实验未开放，不能提交报告'); return; }
        if (labScheduleState === 'ended') { alert('实验已结束，不能再提交报告'); return; }
        if (demoMode || demoUsed) {
            consolePrint('[提示] 演示模式下无法提交实验报告，请手动完成实验后提交换');
            return;
        }
        autoEvaluate();
        var passed = 0;
        totalScore = 0;
        var details = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id] === 'pass') {
                passed++;
                totalScore += s.score;
                details += '步骤' + s.id + '. ' + s.title + ' ' + s.score + '<br>';
            } else {
                details += '步骤' + s.id + '. ' + s.title + ' 0<br>';
            }
        }

        var scoreResult = LabScoringEnhance.getFinalScore(totalScore, 100);
        details += '<br>--- 综合评价 ---<br>';
        details += LabScoringEnhance.formatDetails(scoreResult);

        document.getElementById('resultSummary').textContent = '共完成' + passed + '/' + STEPS.length + ' 个实验步骤';
        document.getElementById('finalScore').textContent = scoreResult.totalScore;
        document.getElementById('finalScore').style.color = scoreResult.totalScore >= 60 ? '#22c55e' : '#ef4444';
        document.getElementById('resultDetails').innerHTML = details;

        var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (currentUser.username && currentUser.type === 'student') {
            try {
                var labTitle = document.querySelector('.top-bar h1').textContent.trim();
                var reportEntry = {
                    labTitle: labTitle,
                    score: scoreResult.totalScore,
                    maxScore: 100,
                    submitTime: new Date().toISOString(),
                    mode: 'manual',
                    details: details,
                    baseScore: scoreResult.baseScore,
                    accuracyScore: scoreResult.accuracyScore,
                    efficiencyScore: scoreResult.efficiencyScore,
                    errorCount: scoreResult.errorCount,
                    elapsedMinutes: scoreResult.elapsedMinutes
                };
                var token = localStorage.getItem('authToken') || '';
                var res = await fetch(API_BASE + '/api/lab-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ studentId: currentUser.username, report: reportEntry })
                });
                var result = await res.json();
                if (result.error) console.error('提交报告失败:', result.error);
            } catch (e) { console.error('提交报告失败:', e); }
        }
        document.getElementById('resultModal').classList.add('show');

        stepResults[25] = passed >= STEPS.length - 1 ? 'pass' : 'fail';
        showEvalResult(25, stepResults[25]);
        updateProgress();
        renderStepList();
    }

    window.addEventListener('load', init);
    </script>

    function toggleHintPanel() {
        var panel = document.getElementById('floatHintPanel');
        if (panel.classList.contains('hidden')) {
            panel.classList.remove('hidden');
        } else {
            panel.classList.add('hidden');
        }
    }

    (function() {
        var header = document.getElementById('floatHintHeader');
        var panel = document.getElementById('floatHintPanel');
        if (!header || !panel) return;
        var dragging = false, offsetX = 0, offsetY = 0;
        header.addEventListener('mousedown', function(e) {
            dragging = true;
            var rect = panel.getBoundingClientRect();
            var parentRect = panel.parentElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            panel.style.left = (rect.left - parentRect.left) + 'px';
            panel.style.top = (rect.top - parentRect.top) + 'px';
            panel.style.right = 'auto';
            panel.style.bottom = 'auto';
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            var parentRect = panel.parentElement.getBoundingClientRect();
            panel.style.left = (e.clientX - parentRect.left - offsetX) + 'px';
            panel.style.top = (e.clientY - parentRect.top - offsetY) + 'px';
        });
        document.addEventListener('mouseup', function() { dragging = false; });
    })();
    })();
    </script>

    function resizeCanvas() {

    function drawTopology() {
        if (!ctx) return;
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        DEVICES.Server.x = w * 0.82; DEVICES.Server.y = h * 0.12;
        DEVICES.AR1.x = w * 0.5; DEVICES.AR1.y = h * 0.15;
        DEVICES.S1.x = w * 0.5; DEVICES.S1.y = h * 0.45;
        DEVICES.PC1.x = w * 0.1; DEVICES.PC1.y = h * 0.82;
        DEVICES.PC2.x = w * 0.25; DEVICES.PC2.y = h * 0.82;
        DEVICES.PC3.x = w * 0.42; DEVICES.PC3.y = h * 0.82;
        DEVICES.PC4.x = w * 0.57; DEVICES.PC4.y = h * 0.82;
        DEVICES.DNS_Server.x = w * 0.75; DEVICES.DNS_Server.y = h * 0.75;
        DEVICES.DHCP_Server.x = w * 0.88; DEVICES.DHCP_Server.y = h * 0.75;
        DEVICES.Web_Server.x = w * 0.81; DEVICES.Web_Server.y = h * 0.92;

        for (var i = 0; i < LINKS.length; i++) {
            var lk = LINKS[i];
            var fd = DEVICES[lk.from], td = DEVICES[lk.to];
            drawLink(fd.x, fd.y, td.x, td.y, lk.fromPort);
        }

        drawRouter(DEVICES.AR1.x, DEVICES.AR1.y, 'AR1');
        drawSwitch(DEVICES.S1.x, DEVICES.S1.y, 'S1');
        drawPC(DEVICES.PC1.x, DEVICES.PC1.y, 'PC1', DEVICES.PC1);
        drawPC(DEVICES.PC2.x, DEVICES.PC2.y, 'PC2', DEVICES.PC2);
        drawPC(DEVICES.PC3.x, DEVICES.PC3.y, 'PC3', DEVICES.PC3);
        drawPC(DEVICES.PC4.x, DEVICES.PC4.y, 'PC4', DEVICES.PC4);
        drawServer(DEVICES.DNS_Server.x, DEVICES.DNS_Server.y, 'DNS_Server', '#e879f9');
        drawServer(DEVICES.DHCP_Server.x, DEVICES.DHCP_Server.y, 'DHCP_Server', '#38bdf8');
        drawServer(DEVICES.Web_Server.x, DEVICES.Web_Server.y, 'Web_Server', '#4ade80');
        drawServer(DEVICES.Server.x, DEVICES.Server.y, 'Internet', '#fbbf24');

        drawFramePackets();
    }

    function drawTextWithShadow(text, x, y, color, font) {
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawRouter(x, y, name) {
        var rw = 110, rh = 55;
        ctx.fillStyle = '#3a1a1a';
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 2;
        roundRect(ctx, x - rw/2, y - rh/2, rw, rh, 8);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        drawTextWithShadow('边界路由器NAT', x, y + 10, '#fca5a5', '10px Microsoft YaHei');
    }

    function drawSwitch(x, y, name) {
        var sw = 110, sh = 55;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 2;
        roundRect(ctx, x - sw/2, y - sh/2, sw, sh, 8);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        drawTextWithShadow('核心三层交换机', x, y + 10, '#93c5fd', '10px Microsoft YaHei');
    }

    function drawPC(x, y, name, pc) {
        var pw = 65, ph = 45;
        ctx.fillStyle = '#1e3355';
        ctx.strokeStyle = '#5b8dc9';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - pw/2, y - ph/2, pw, ph, 6);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 11px Microsoft YaHei');
        var ipStr = pc.ip || pc.dhcpIp || 'DHCP';
        drawTextWithShadow(ipStr, x, y + 5, '#ffe066', '9px Consolas');
        drawTextWithShadow('VLAN' + pc.vlan, x, y + 17, '#94a3b8', '9px Microsoft YaHei');
    }

    function drawServer(x, y, name, accentColor) {
        var sw2 = 80, sh2 = 50;
        ctx.fillStyle = '#1a2a3a';
        ctx.strokeStyle = accentColor;
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - sw2/2, y - sh2/2, sw2, sh2, 6);
        ctx.fill(); ctx.stroke();
        var displayName = name === 'Internet' ? 'Internet' : name.replace('_Server','');
        drawTextWithShadow(displayName, x, y - 8, '#ffffff', 'bold 11px Microsoft YaHei');
        var dev = DEVICES[name];
        if (dev && dev.ip) {
            drawTextWithShadow(dev.ip, x, y + 8, accentColor, '9px Consolas');
        } else if (name === 'Internet') {
            drawTextWithShadow('8.8.8.8', x, y + 8, accentColor, '9px Consolas');
        }
    }

    function drawLink(x1, y1, x2, y2, port) {
        ctx.beginPath();
        ctx.strokeStyle = '#4a6a9a';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        if (port) drawTextWithShadow(port, mx, my - 8, '#ffe066', 'bold 9px Consolas');
    }

    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    function drawFramePackets() {
        for (var i = 0; i < framePackets.length; i++) {
            var p = framePackets[i];
            ctx.save();
            ctx.globalAlpha = p.alpha || 1;
            ctx.fillStyle = p.color || '#fbbf24';
            ctx.strokeStyle = p.borderColor || '#f59e0b';
            ctx.lineWidth = 2;
            var lbl = p.label || 'PKT';
            ctx.font = 'bold 13px Consolas';
            var tw = ctx.measureText(lbl).width;
            var pw = tw + 20, ph = 28;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, p.x - pw/2, p.y - ph/2, pw, ph, 6);
            ctx.fill(); ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            drawTextWithShadow(lbl, p.x, p.y, '#ffffff', 'bold 13px Consolas');
            ctx.restore();
        }
    }

    var deviceViewState = {};

    function switchDevice(devName) {
        if (currentDevice && currentDevice !== devName) {
            deviceViewState[currentDevice] = { viewMode: viewMode, currentInterface: currentInterface, currentVlan: currentVlan };
        }
        currentDevice = devName;
        if (deviceViewState[devName]) {
            viewMode = deviceViewState[devName].viewMode;
            currentInterface = deviceViewState[devName].currentInterface;
            currentVlan = deviceViewState[devName].currentVlan;
        } else {
            viewMode = 'user';
            currentInterface = '';
            currentVlan = 0;
        }

        var tabs = document.querySelectorAll('.sw-tab');
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('active', tabs[i].getAttribute('data-device') === devName);
        }

        updatePrompt();
        updateInfoPanels();

        if (!consoleHistory[devName]) consoleHistory[devName] = [];
        var output = document.getElementById('consoleOutput');
        output.innerHTML = '';
        for (var j = 0; j < consoleHistory[devName].length; j++) {
            var line = document.createElement('div');
            line.textContent = consoleHistory[devName][j];
            output.appendChild(line);
        }
        output.scrollTop = output.scrollHeight;
    }

    function updatePrompt() {
        var prompt = document.getElementById('consolePrompt');
        var dev = DEVICES[currentDevice];
        if (!dev) { prompt.textContent = '>'; return; }

        if (dev.type === 'pc' || dev.type === 'dns' || dev.type === 'dhcp' || dev.type === 'web' || dev.type === 'server') {
            prompt.textContent = currentDevice + '>';
        } else if (dev.type === 'router') {
            if (viewMode === 'user') prompt.textContent = '<' + currentDevice + '>';
            else if (viewMode === 'system') {
                if (currentInterface) prompt.textContent = '[' + currentDevice + '-' + currentInterface + ']';
                else prompt.textContent = '[' + currentDevice + ']';
            }
        } else if (dev.type === 'switch') {
            if (viewMode === 'user') prompt.textContent = '<' + currentDevice + '>';
            else if (viewMode === 'system') {
                if (currentInterface) prompt.textContent = '[' + currentDevice + '-' + currentInterface + ']';
                else if (currentVlan) prompt.textContent = '[' + currentDevice + '-vlan' + currentVlan + ']';
                else prompt.textContent = '[' + currentDevice + ']';
            }
        }
    }

    function consolePrint(text) {
        var output = document.getElementById('consoleOutput');
        var line = document.createElement('div');
        line.textContent = text;
        output.appendChild(line);
        output.scrollTop = output.scrollHeight;
        if (!consoleHistory[currentDevice]) consoleHistory[currentDevice] = [];
        consoleHistory[currentDevice].push(text);
    }

    function clearConsole() {
        document.getElementById('consoleOutput').innerHTML = '';
        consoleHistory[currentDevice] = [];
    }

    function handleCommand(event) {
        if (event.key !== 'Enter') return;
        var input = document.getElementById('consoleInput');
        var cmd = input.value.trim();
        input.value = '';
        if (!cmd) return;

        var promptText = document.getElementById('consolePrompt').textContent;
        consolePrint(promptText + cmd);

        var dev = DEVICES[currentDevice];
        if (dev.type === 'switch') handleSwitchCommand(cmd);
        else if (dev.type === 'router') handleRouterCommand(cmd);
        else if (dev.type === 'pc') handlePCCommand(cmd);
        else if (dev.type === 'dns') handleDnsCommand(cmd);
        else if (dev.type === 'dhcp') handleDhcpCommand(cmd);
        else if (dev.type === 'web') handleWebCommand(cmd);
        else if (dev.type === 'server') handleServerCommand(cmd);

        autoEvaluate();
    }

    function handleSwitchCommand(cmd) {
        var parts = cmd.split(/\s+/);
        var base = parts[0].toLowerCase();

        if (viewMode === 'user') {
            if (base === 'display' || base === 'show') {
                handleSwitchDisplay(parts);
            } else if (base === 'system-view') {
                viewMode = 'system';
                currentInterface = '';
                currentVlan = 0;
                consolePrint('Enter system view, return user view with Ctrl+Z.');
                updatePrompt();
            } else if (base === '?' || base === 'help') {
                consolePrint('可用命令: display vlan, display ip interface brief, display ip routing-table, system-view');
            } else {
                consolePrint('错误: 无法识别的命"' + cmd + '"');
            }
        } else if (viewMode === 'system') {
            if (currentInterface && currentInterface.indexOf('Vlanif') === 0) {
                handleVlanIfCommand(parts, base);
            } else if (currentInterface) {
                handleSwInterfaceCommand(parts, base);
            } else if (currentVlan) {
                handleVlanViewCommand(parts, base);
            } else {
                handleSwSystemCommand(parts, base, cmd);
            }
        }
    }

    function handleSwSystemCommand(parts, base, cmd) {
        if (base === 'vlan') {
            var vid = parseInt(parts[1]);
            if (isNaN(vid) || vid < 1 || vid > 4094) { consolePrint('错误: 无效的VLAN ID'); return; }
            if (!DEVICES.S1.vlans[vid]) DEVICES.S1.vlans[vid] = { name: 'VLAN ' + vid, ports: [] };
            currentVlan = vid;
            consolePrint('Enter VLAN ' + vid + ' view');
            updatePrompt();
            checkVlanCreated();
        } else if (base === 'interface') {
            if (parts.length < 2) { consolePrint('用法: interface <接口'); return; }
            var iface = parts[1];
            var vnum = 0;
            if (iface.toLowerCase() === 'vlanif' && parts[2]) {
                vnum = parseInt(parts[2]);
            } else if (iface.match(/^Vlanif\d+$/i)) {
                vnum = parseInt(iface.replace(/^Vlanif/i, ''));
            }
            if (vnum > 0) {
                if (!DEVICES.S1.vlans[vnum]) { consolePrint('错误: VLAN ' + vnum + ' 不存在'); return; }


                currentInterface = 'Vlanif' + vnum;
                if (!DEVICES.S1.vlanIf[vnum]) DEVICES.S1.vlanIf[vnum] = { ip: '', mask: '' };
                consolePrint('Enter interface Vlanif' + vnum + ' view');
                updatePrompt();
            } else if (iface.match(/^G0\/0\/\d+$/) || iface.match(/^GigabitEthernet0\/0\/\d+$/)) {
                iface = iface.replace(/^GigabitEthernet/, 'G');
                if (!DEVICES.S1.portMode[iface]) { consolePrint('错误: 接口 ' + iface + ' 不存在'); return; }


                currentInterface = iface;
                consolePrint('Enter interface ' + iface + ' view');
                updatePrompt();
            } else {
                consolePrint('错误: 无效的接口名');
            }
        } else if (base === 'ip' && parts[1] === 'route-static') {
            var dest = parts[2], mask2 = parts[3], gw = parts[4];
            if (!dest || !mask2 || !gw) { consolePrint('用法: ip route-static <目的网络> <掩码> <下一'); return; }
            DEVICES.S1.routes.push({ dest: dest, mask: mask2, gw: gw, iface: '' });
            consolePrint('静态路由已添加: ' + dest + ' ' + mask2 + ' via ' + gw);
            checkRoutes();
        } else if (base === 'display' || base === 'show') {
            handleSwitchDisplay(parts);
        } else if (base === 'quit' || base === 'return') {
            viewMode = 'user';
            currentInterface = '';
            currentVlan = 0;
            consolePrint('Return to user view.');
            updatePrompt();
        } else if (base === '?' || base === 'help') {
            consolePrint('可用命令: vlan <ID>, interface G0/0/X|VlanifX, ip route-static, display, quit');
        } else {
            consolePrint('错误: 无法识别的命"' + cmd + '"');
        }
    }

    function handleVlanViewCommand(parts, base) {
        if (base === 'name') {
            var vname = parts.slice(1).join(' ');
            if (currentVlan && DEVICES.S1.vlans[currentVlan]) {
                DEVICES.S1.vlans[currentVlan].name = vname;
                consolePrint('VLAN ' + currentVlan + ' 名称已设置为 ' + vname);
            }
        } else if (base === 'quit') {
            currentVlan = 0;
            consolePrint('Return to system view.');
            updatePrompt();
        } else {
            consolePrint('用法: name <VLAN名称> | quit');
        }
    }

    function handleSwInterfaceCommand(parts, base) {
        var pt = currentInterface;
        if (base === 'port') {
            if (parts[1] === 'link-type') {

    function handleDhcpDiscover(pcName) {
        var pc = DEVICES[pcName];
        if (!isDhcpReady()) {
            consolePrint('DHCP请求失败: DHCP服务器未配置或网络不');
            return;
        }

        var vlanId = pc.vlan;
        var poolKey = 'vlan' + vlanId;
        var pool = DEVICES.DHCP_Server.pools[poolKey];
        if (!pool) {
            consolePrint('DHCP请求失败: 未找到VLAN ' + vlanId + '的地址');
            return;
        }
        if (!pool.network) {
            consolePrint('DHCP请求失败: 地址池未配置网络');
            return;
        }

        consolePrint('DHCP Discover: 广播寻找DHCP服务器?..');
        consolePrint('DHCP Offer: 服务器?' + DEVICES.DHCP_Server.ip + ' 提供IP地址');
        consolePrint('DHCP Request: 请求分配IP地址');
        consolePrint('DHCP ACK: 确认分配');

        var baseNet = pool.network.split('.');
        var hostNum = Object.keys(DEVICES.DHCP_Server.bindings).length + 10;
        var assignedIp = baseNet[0] + '.' + baseNet[1] + '.' + baseNet[2] + '.' + hostNum;

        pc.dhcpIp = assignedIp;
        pc.ip = assignedIp;
        pc.mask = pool.mask || '255.255.255.0';
        pc.gateway = pool.gateway;

        DEVICES.DHCP_Server.bindings[pc.mac] = { ip: assignedIp, pool: poolKey, lease: '1d' };

        consolePrint('已获取IP地址: ' + assignedIp + '（原静态IP已替换为DHCP分配的IP地址）');
        consolePrint('子网掩码: ' + pc.mask);
        consolePrint('默认网关: ' + pc.gateway);
        if (pool.dnsServer) consolePrint('DNS服务器? ' + pool.dnsServer);

        if (pcName === 'PC1') stepFlags[13] = true;
        updateInfoPanels();
        drawTopology();
    }

    function checkReachability(pcName, targetIp) {
        var pc = DEVICES[pcName];
        var pcIp = pc.ip || pc.dhcpIp;
        if (!pcIp) return false;

        if (targetIp === '8.8.8.8') {
            return DEVICES.AR1.natOutbound && DEVICES.AR1.interfaces['G0/0/0'].ip && DEVICES.AR1.interfaces['G0/0/1'].ip;
        }

        if (targetIp === '10.0.0.1' || targetIp === DEVICES.AR1.interfaces['G0/0/0'].ip) {
            return DEVICES.AR1.interfaces['G0/0/0'].ip !== '' && DEVICES.S1.vlanIf[100] && DEVICES.S1.vlanIf[100].ip;
        }

        var allIps = getAllDeviceIps();
        return allIps.indexOf(targetIp) >= 0;
    }

    function getAllDeviceIps() {
        var ips = [];
        var pcNames = ['PC1','PC2','PC3','PC4'];
        for (var i = 0; i < pcNames.length; i++) {
            var p = DEVICES[pcNames[i]];
            if (p.ip) ips.push(p.ip);
            if (p.dhcpIp) ips.push(p.dhcpIp);
        }
        ips.push('10.0.3.10','10.0.3.20','10.0.3.30');
        if (DEVICES.AR1.interfaces['G0/0/0'].ip) ips.push(DEVICES.AR1.interfaces['G0/0/0'].ip);
        if (DEVICES.AR1.interfaces['G0/0/1'].ip) ips.push(DEVICES.AR1.interfaces['G0/0/1'].ip);
        for (var vn in DEVICES.S1.vlanIf) {
            if (DEVICES.S1.vlanIf[vn].ip) ips.push(DEVICES.S1.vlanIf[vn].ip);
        }
        return ips;
    }

    function findPingPath(pcName, targetIp) {
        var pc = DEVICES[pcName];
        var waypoints = [];

        if (pc.x !== undefined) waypoints.push({ x: pc.x, y: pc.y });
        if (DEVICES.S1.x !== undefined) waypoints.push({ x: DEVICES.S1.x, y: DEVICES.S1.y });

        if (targetIp === '8.8.8.8') {
            if (DEVICES.AR1.x !== undefined) waypoints.push({ x: DEVICES.AR1.x, y: DEVICES.AR1.y });
            if (DEVICES.Server.x !== undefined) waypoints.push({ x: DEVICES.Server.x, y: DEVICES.Server.y });
        } else if (targetIp === '10.0.0.1' || targetIp === DEVICES.AR1.interfaces['G0/0/0'].ip) {
            if (DEVICES.AR1.x !== undefined) waypoints.push({ x: DEVICES.AR1.x, y: DEVICES.AR1.y });
        } else if (targetIp === '10.0.3.10') {
            if (DEVICES.DNS_Server.x !== undefined) waypoints.push({ x: DEVICES.DNS_Server.x, y: DEVICES.DNS_Server.y });
        } else if (targetIp === '10.0.3.20') {
            if (DEVICES.DHCP_Server.x !== undefined) waypoints.push({ x: DEVICES.DHCP_Server.x, y: DEVICES.DHCP_Server.y });
        } else if (targetIp === '10.0.3.30') {
            if (DEVICES.Web_Server.x !== undefined) waypoints.push({ x: DEVICES.Web_Server.x, y: DEVICES.Web_Server.y });
        } else {

            for (var i = 0; i < pcNames.length; i++) {

                if (tp.ip === targetIp || tp.dhcpIp === targetIp) {
                    if (tp.x !== undefined) waypoints.push({ x: tp.x, y: tp.y });
                    break;
                }
            }
        }

        return waypoints;
    }

    function animatePing(waypoints, srcPc, targetIp, callback) {
        if (animating || waypoints.length < 2) { if (callback) callback(); return; }
        animating = true;

        var packet = { x: waypoints[0].x, y: waypoints[0].y, color: '#fbbf24', borderColor: '#f59e0b', label: 'ICMP', alpha: 1 };
        framePackets = [packet];

        var totalSegments = waypoints.length - 1;
        var currentSegment = 0;
        var step = 0;
        var stepsPerSegment = 25;

        function animate() {
            step++;
            var t = easeInOut(step / stepsPerSegment);
            var from = waypoints[currentSegment];
            var to = waypoints[currentSegment + 1];
            packet.x = from.x + (to.x - from.x) * t;
            packet.y = from.y + (to.y - from.y) * t;
            drawTopology();

            if (step >= stepsPerSegment) {
                currentSegment++;
                step = 0;
                if (currentSegment >= totalSegments) {
                    setTimeout(function() {
                        packet.color = '#4ade80';
                        packet.borderColor = '#22c55e';
                        packet.label = 'REPLY';
                        var replySegment = totalSegments - 1;
                        var replyStep = 0;
                        function animateReply() {
                            replyStep++;
                            var rt = easeInOut(replyStep / stepsPerSegment);
                            var rFrom = waypoints[replySegment + 1];
                            var rTo = waypoints[replySegment];
                            packet.x = rFrom.x + (rTo.x - rFrom.x) * rt;
                            packet.y = rFrom.y + (rTo.y - rFrom.y) * rt;
                            drawTopology();
                            if (replyStep >= stepsPerSegment) {
                                replySegment--;
                                replyStep = 0;
                                if (replySegment < 0) {
                                    setTimeout(function() {
                                        framePackets = [];
                                        drawTopology();
                                        animating = false;
                                        if (callback) callback();
                                    }, 200);
                                    return;
                                }
                                setTimeout(function() { animFrame = requestAnimationFrame(animateReply); }, 1000);
                            } else {
                                animFrame = requestAnimationFrame(animateReply);
                            }
                        }
                        animFrame = requestAnimationFrame(animateReply);
                    }, 200);
                    return;
                }
                setTimeout(function() { animFrame = requestAnimationFrame(animate); }, 1000);
            }
            animFrame = requestAnimationFrame(animate);
        }
        animFrame = requestAnimationFrame(animate);
    }

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function prefixToMask(prefix) {
        var masks = ['0.0.0.0','128.0.0.0','192.0.0.0','224.0.0.0','240.0.0.0','248.0.0.0','252.0.0.0','254.0.0.0','255.0.0.0','255.128.0.0','255.192.0.0','255.224.0.0','255.240.0.0','255.248.0.0','255.252.0.0','255.254.0.0','255.255.0.0','255.255.128.0','255.255.192.0','255.255.224.0','255.255.240.0','255.255.248.0','255.255.252.0','255.255.254.0','255.255.255.0','255.255.255.128','255.255.255.192','255.255.255.224','255.255.255.240','255.255.255.248','255.255.255.252','255.255.255.254','255.255.255.255'];
        return masks[prefix] || '255.255.255.0';
    }

    function getNetwork(ip, mask) {
        var ipParts = ip.split('.').map(Number);
        var maskParts = mask.split('.').map(Number);
        var net = [];
        for (var i = 0; i < 4; i++) net.push(ipParts[i] & maskParts[i]);
        return net.join('.');
    }

    function renderStepList() {
        var html = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            var cls = '';
            if (s.id === currentStep) cls = 'active';
            if (stepResults[s.id] === 'pass') cls += ' completed';
            if (stepResults[s.id] === 'fail') cls += ' failed';
            var icon = stepResults[s.id] === 'pass' ? '✅' : stepResults[s.id] === 'fail' ? '❌' : (s.id === currentStep ? '▶️' : '⏳');
            html += '<div class="step-item ' + cls + '" onclick="selectStep(' + s.id + ')">';
            html += '<span class="step-icon">' + icon + '</span>';
            html += '步骤' + s.id + '. ' + s.title;
            html += '</div>';
        }
        document.getElementById('stepList').innerHTML = html;
    }

    function selectStep(id) {
        currentStep = id;
        var step = STEPS[id - 1];
        document.getElementById('hintBox').textContent = step.hint;
        renderStepList();
    }

    function autoEvaluate() {
        var changed = false;
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id]) continue;
            var result = window[s.evalFn]();
            if (result === 'pass' || result === 'fail') {
                stepResults[s.id] = result;
                showEvalResult(s.id, result);
                changed = true;
            }
        }
        if (changed) {
            var nextStep = 0;
            for (var j = 0; j < STEPS.length; j++) {
                if (!stepResults[STEPS[j].id]) { nextStep = STEPS[j].id; break; }
            }
            if (nextStep) { currentStep = nextStep; document.getElementById('hintBox').textContent = STEPS[nextStep - 1].hint; }
        }
        updateProgress();
        renderStepList();
    }

    function updateProgress() {

            }
        }
        var pct = Math.round(completed / STEPS.length * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = pct + '%';
        document.getElementById('scoreFill').style.width = Math.round(totalScore * 0.8) + '%';
        document.getElementById('scoreText').textContent = Math.round(totalScore * 0.8) + '/80';

        var nextStep = null;
        for (var i = 0; i < STEPS.length; i++) {
            if (!stepResults[STEPS[i].id]) { nextStep = STEPS[i].id; break; }
        }
        if (nextStep) {

    async function submitExperiment() {
        if (labScheduleState === 'not_started') { alert('实验未开放，不能提交报告'); return; }
        if (labScheduleState === 'ended') { alert('实验已结束，不能再提交报告'); return; }
        if (demoMode || demoUsed) {
            consolePrint('[提示] 演示模式下无法提交实验报告，请手动完成实验后提交换');
            return;
        }
        autoEvaluate();
        var passed = 0;
        totalScore = 0;
        var details = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id] === 'pass') {
                passed++;
                totalScore += s.score;
                details += '步骤' + s.id + '. ' + s.title + ' ' + s.score + '<br>';
            } else {
                details += '步骤' + s.id + '. ' + s.title + ' 0<br>';
            }
        }

        var scoreResult = LabScoringEnhance.getFinalScore(totalScore, 100);
        details += '<br>--- 综合评价 ---<br>';
        details += LabScoringEnhance.formatDetails(scoreResult);

        document.getElementById('resultSummary').textContent = '共完成' + passed + '/' + STEPS.length + ' 个实验步骤';
        document.getElementById('finalScore').textContent = scoreResult.totalScore;
        document.getElementById('finalScore').style.color = scoreResult.totalScore >= 60 ? '#22c55e' : '#ef4444';
        document.getElementById('resultDetails').innerHTML = details;

        var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (currentUser.username && currentUser.type === 'student') {
            try {
                var labTitle = document.querySelector('.top-bar h1').textContent.trim();
                var reportEntry = {
                    labTitle: labTitle,
                    score: scoreResult.totalScore,
                    maxScore: 100,
                    submitTime: new Date().toISOString(),
                    mode: 'manual',
                    details: details,
                    baseScore: scoreResult.baseScore,
                    accuracyScore: scoreResult.accuracyScore,
                    efficiencyScore: scoreResult.efficiencyScore,
                    errorCount: scoreResult.errorCount,
                    elapsedMinutes: scoreResult.elapsedMinutes
                };
                var token = localStorage.getItem('authToken') || '';
                var res = await fetch(API_BASE + '/api/lab-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ studentId: currentUser.username, report: reportEntry })
                });
                var result = await res.json();
                if (result.error) console.error('提交报告失败:', result.error);
            } catch (e) { console.error('提交报告失败:', e); }
        }
        document.getElementById('resultModal').classList.add('show');

        stepResults[25] = passed >= STEPS.length - 1 ? 'pass' : 'fail';
        showEvalResult(25, stepResults[25]);
        updateProgress();
        renderStepList();
    }

    </script>

    function toggleHintPanel() {
        var panel = document.getElementById('floatHintPanel');

    (function() {
        var header = document.getElementById('floatHintHeader');
        var panel = document.getElementById('floatHintPanel');
        if (!header || !panel) return;
        var dragging = false, offsetX = 0, offsetY = 0;
        header.addEventListener('mousedown', function(e) {
            dragging = true;
            var rect = panel.getBoundingClientRect();
            var parentRect = panel.parentElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            panel.style.left = (rect.left - parentRect.left) + 'px';
            panel.style.top = (rect.top - parentRect.top) + 'px';
            panel.style.right = 'auto';
            panel.style.bottom = 'auto';
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            var parentRect = panel.parentElement.getBoundingClientRect();
            panel.style.left = (e.clientX - parentRect.left - offsetX) + 'px';
            panel.style.top = (e.clientY - parentRect.top - offsetY) + 'px';
        });
        document.addEventListener('mouseup', function() { dragging = false; });
    })();
    </script>
