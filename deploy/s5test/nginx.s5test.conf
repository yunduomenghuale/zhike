# 智课系统 V2 · 124 测试环境 nginx（zhike_s5test_frontend）
# 以生产 deploy/nginx.conf 为蓝本；差异：upstream 服务名 backend 不变（compose 网络内），
# /m/ 移动端目录保留（挂空目录），其余与生产一致——实验门控 / 签名资源 404 旁路策略不变。

gzip on;
gzip_types text/css application/javascript application/json image/svg+xml font/woff font/woff2;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;

server {
    listen 80;
    server_name _;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    client_max_body_size 600m;

    # AI 流式问答（SSE）逐块下发
    location = /api/qa-records/ask-stream/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 危险扩展强制按二进制下载（防 media 同域存储型 XSS）
    location ~* ^/media/(?<media_path>.+\.(?:html?|svg|js))$ {
        alias /app/media/$media_path;
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff;
    }

    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
    }

    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # 移动端 H5：本次未随包部署，挂空目录（不 404 整站）
    location /m/ {
        alias /usr/share/nginx/m/;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # 实验静态页 / 课程资源：一律经签名门控由 Django 读出，nginx 显式 404 堵旁路
    location /labs/ {
        return 404;
    }

    location /resources/ {
        return 404;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
