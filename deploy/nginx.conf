# 智课系统 V2 前端 nginx：静态站点 + /api 反代后端 + 媒体/静态资源直出

# gzip 压缩：JS/CSS 体积约为原始的 1/3，显著加快首屏
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml font/woff font/woff2;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;

server {
    listen 80;
    server_name _;

    # Docker 容器重建后 IP 可能变化，使用内置 DNS 动态解析 backend，
    # 避免 Nginx 长期缓存旧地址而导致 /api 全部返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 作业 PDF / PPT 等大文件上传
    client_max_body_size 200m;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # AI 生成、TTS 配音等同步接口耗时较长
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # 用户上传的媒体文件（课件、作业附件等）
    location /media/ {
        alias /app/media/;
        expires 7d;
    }

    # Django admin / DRF 页面静态资源
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # Vite 产物带内容 hash，可长期强缓存；刷新页面不再重复下载
    location /assets/ {
        root /usr/share/nginx/html;
        # 部分移动网络/内嵌浏览器网关无法稳定转发 gzip 的分块响应，
        # 静态资源改用带 Content-Length 的定长响应，避免页面资源 502 白屏。
        gzip off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 前端 SPA（history 路由回退到 index.html；入口文件不缓存，保证发版即生效）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
