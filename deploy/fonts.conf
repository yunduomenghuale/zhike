<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  PPT 课件常用 Windows 中文字体 → 容器内开源字体 的替换映射。
  LibreOffice 渲染 PPT 时通过 fontconfig 解析缺失字体，
  显式替换可避免默认回退导致的字形宽度变化、文字溢出与错位。
  挂载路径：/etc/fonts/local.conf（见 docker-compose.yml）
-->
<fontconfig>

  <!-- 微软雅黑 → 文泉驿微米黑（字形宽度接近，显示效果最接近） -->
  <match target="pattern">
    <test name="family"><string>Microsoft YaHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Micro Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>微软雅黑</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Micro Hei</string></edit>
  </match>

  <!-- 黑体 → 文泉驿正黑 -->
  <match target="pattern">
    <test name="family"><string>SimHei</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>黑体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>WenQuanYi Zen Hei</string></edit>
  </match>

  <!-- 宋体 / 新宋体 → Noto Serif CJK SC（思源宋体） -->
  <match target="pattern">
    <test name="family"><string>SimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>NSimSun</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>宋体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- 楷体 → AR PL UKai CN -->
  <match target="pattern">
    <test name="family"><string>KaiTi</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai CN</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>楷体</string></test>
    <edit name="family" mode="assign" binding="strong"><string>AR PL UKai CN</string></edit>
  </match>

  <!-- 仿宋 → Noto Serif CJK SC（无开源仿宋，用宋体类兜底） -->
  <match target="pattern">
    <test name="family"><string>FangSong</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>仿宋</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Noto Serif CJK SC</string></edit>
  </match>

  <!-- Arial → Liberation Sans 由 fontconfig 默认 30-metric-aliases 处理，无需显式配置 -->
</fontconfig>
