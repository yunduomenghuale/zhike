    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #0a0e27; color: #e0e0e0; min-height: 100vh; }
        .main-layout { display: grid; grid-template-columns: 280px 1fr 300px; grid-template-rows: auto 1fr; height: calc(100vh - 50px); }
        .top-bar { grid-column: 1/-1; background: linear-gradient(135deg, #1a1f3a 0%, #2d1b4e 100%); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #4a90e2; }
        .top-bar h1 { font-size: 18px; color: #38bdf8; }
        .top-bar .exp-info { font-size: 13px; color: #94a3b8; }
        .step-panel { background: #111633; border-right: 1px solid #1e2a5a; overflow-y: auto; padding: 10px; }
        .step-panel h3 { color: #38bdf8; font-size: 14px; padding: 8px; margin-bottom: 5px; border-bottom: 1px solid #1e2a5a; }
        .float-hint-panel { position: absolute; top: 10px; right: 10px; width: 340px; max-height: 200px; background: rgba(17,22,51,0.6); border: 1px solid rgba(245,158,11,0.4); border-radius: 10px; z-index: 9998; box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
        .float-hint-panel.hidden { display: none; }
        .float-hint-header { padding: 8px 12px; background: rgba(245,158,11,0.1); display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; border-bottom: 1px solid rgba(245,158,11,0.3); }
        .float-hint-header span { color: #fbbf24; font-size: 13px; font-weight: bold; }
        .float-hint-close { background: none; border: none; color: #94a3b8; font-size: 16px; cursor: pointer; padding: 0 4px; line-height: 1; }
        .float-hint-close:hover { color: #ef4444; }
        .float-hint-body { padding: 10px 12px; font-size: 12px; color: #fbbf24; line-height: 1.7; overflow-y: auto; max-height: 150px; white-space: pre-line; }
        .step-item { padding: 10px 12px; margin: 4px 0; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-size: 13px; border-left: 3px solid transparent; line-height: 1.5; }
        .step-item:hover { background: rgba(56,189,248,0.1); }
        .step-item.active { background: rgba(56,189,248,0.15); border-left-color: #38bdf8; color: #fff; }
        .step-item.completed { border-left-color: #22c55e; }

        .step-item.failed { border-left-color: #ef4444; }
        .step-icon { margin-right: 6px; font-size: 14px; }
        .sim-area { background: #0d1230; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .sim-canvas-wrap { height: 320px; min-height: 260px; position: relative; flex-shrink: 0; }
        #simCanvas { width: 100%; height: 100%; display: block; }
        .console-area { flex: 1; background: #0b1025; border-top: 1px solid #1e2a5a; display: flex; flex-direction: column; min-height: 220px; }
        .console-header { padding: 6px 12px; background: #0f1535; font-size: 12px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .console-output { flex: 1; overflow-y: auto; padding: 8px 12px; background: #0a0f22; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.6; color: #a3e635; }
        .console-input-wrap { display: flex; border-top: 1px solid #1e2a5a; background: #0c1128; }
        .console-prompt { padding: 8px; color: #38bdf8; font-family: 'Consolas', monospace; font-size: 13px; white-space: nowrap; }
        .console-input { flex: 1; background: transparent; border: none; color: #a3e635; font-family: 'Consolas', monospace; font-size: 13px; padding: 8px 4px; outline: none; }
        .info-panel { background: #111633; border-left: 1px solid #1e2a5a; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .panel-card { background: #0d1230; border: 1px solid #1e2a5a; border-radius: 8px; overflow: hidden; }
        .panel-card-header { padding: 8px 12px; background: #151b3d; font-size: 13px; font-weight: bold; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .panel-card-body { padding: 10px 12px; font-size: 12px; max-height: 200px; overflow-y: auto; }
        .arp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .arp-table th { background: #1a2150; color: #94a3b8; padding: 6px 8px; text-align: left; font-weight: normal; border-bottom: 1px solid #1e2a5a; }
        .arp-table td { padding: 6px 8px; border-bottom: 1px solid #0d1230; color: #a3e635; }
        .arp-table tr.new-entry td { animation: arpHighlight 1.5s ease; }
        @keyframes arpHighlight { 0% { background: rgba(56,189,248,0.3); } 100% { background: transparent; } }
        .frame-info { font-size: 12px; line-height: 1.8; }
        .frame-info .label { color: #94a3b8; }
        .frame-info .value { color: #fbbf24; font-family: 'Consolas', monospace; }
        .eval-result { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-top: 6px; }
        .eval-pass { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
        .eval-fail { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.3s; }
        .btn-primary { background: #4a90e2; color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-warning { background: #f59e0b; color: #1a1a1a; }
        .btn-warning:hover { background: #d97706; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .score-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .score-bar-track { flex: 1; height: 8px; background: #1a2150; border-radius: 4px; overflow: hidden; }
        .score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; background: linear-gradient(90deg, #4a90e2, #22c55e); }
        .score-text { font-size: 14px; font-weight: bold; color: #38bdf8; min-width: 40px; text-align: right; }
        .subnet-info { font-size: 12px; line-height: 1.8; }
        .subnet-info .label { color: #94a3b8; }
        .subnet-info .value { color: #a3e635; font-family: 'Consolas', monospace; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #151b3d; border: 2px solid #4a90e2; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; text-align: center; }
        .modal-box h2 { color: #38bdf8; margin-bottom: 15px; }
        .modal-box p { color: #94a3b8; margin-bottom: 20px; line-height: 1.8; }
        .modal-box .final-score { font-size: 48px; color: #22c55e; font-weight: bold; margin: 15px 0; }
        .sw-tab { padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid #1e2a5a; background: #0d1230; color: #94a3b8; transition: all 0.3s; }
        .sw-tab.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        .sw-tab:hover { background: #1a2150; }
        .sw-tab.active:hover { background: #357abd; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>实验二：ARP与IP子网综合实验</h1>
        <div class="exp-info">计算机网络实验教| 虚拟仿真实验 | 配套教材：基于华为eNSP</div>

    <div class="main-layout">
    <div class="step-panel">
        <h3>实验步骤</h3>

        <div style="padding:10px; margin-top:10px;">

    <div class="sim-area">
        <div class="sim-canvas-wrap">
            <canvas id="simCanvas"></canvas>
        </div>
        <div class="float-hint-panel" id="floatHintPanel">
            <div class="float-hint-header" id="floatHintHeader">
                <span>💡 实验提示</span>

        <div class="console-area">

                <span id="consoleTitle">设备控制台</span>

                    <span style="font-size:11px;color:#94a3b8;">切换设备：</span>
                    <button class="sw-tab active" data-device="PC1" onclick="switchDevice('PC1')">PC1</button>
                    <button class="sw-tab" data-device="PC2" onclick="switchDevice('PC2')">PC2</button>
                    <button class="sw-tab" data-device="PC3" onclick="switchDevice('PC3')">PC3</button>
                    <button class="sw-tab" data-device="PC4" onclick="switchDevice('PC4')">PC4</button>
                    <button class="sw-tab" data-device="AR1" onclick="switchDevice('AR1')">AR1</button>

                </div>

            </div>

    <div class="info-panel">
        <div class="panel-card">
            <div class="panel-card-header">
                <span>ARP缓存表</span>
                <span id="arpTableDevice" style="font-size:11px;color:#94a3b8;">PC1</span>
            </div>
            <div class="panel-card-body" id="arpTableBody">
                <table class="arp-table">
                    <thead><tr><th>IP地址</th><th>MAC地址</th><th>类型</th></tr></thead>
                    <tbody id="arpTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">(空表)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>子网信息</span></div>
            <div class="panel-card-body" id="subnetInfoBody">
                <div class="subnet-info" id="subnetInfo">
                    <span class="label">尚未进行子网划分</span>
                </div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>当前帧信息</span></div>
            <div class="panel-card-body" id="frameInfoBody">

                </div>

        <div class="panel-card">

                <div style="color:#94a3b8;font-size:12px;">完成步骤后自动评估</div>
            </div>
        </div>

    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <h2>实验报告</h2>
            <p id="resultSummary"></p>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size:14px;">总分（满00分）</p>
            <div id="resultDetails" style="text-align:left;margin:15px 0;font-size:13px;color:#94a3b8;line-height:2;"></div>
            <button class="btn btn-primary" onclick="document.getElementById('resultModal').classList.remove('show')">关闭</button>
            <button class="btn btn-success" onclick="LabReportGenerator.showConclusionDialog()" style="margin-left:10px;">生成实验报告</button>
        </div>
    </div>

    <script>
    // 随机化网络参数
    var RAND_S1 = Math.floor(Math.random() * 9) + 1;
    var RAND_S2 = Math.floor(Math.random() * 9) + 1;
    while (RAND_S2 === RAND_S1) RAND_S2 = Math.floor(Math.random() * 9) + 1;
    var PC1_IP = '192.168.' + RAND_S1 + '.1';
    var PC2_IP = '192.168.' + RAND_S1 + '.2';
    var PC3_IP = '192.168.' + RAND_S2 + '.1';
    var PC4_IP = '192.168.' + RAND_S2 + '.2';
    var AR1_G0_IP = '192.168.' + RAND_S1 + '.254';
    var AR1_G1_IP = '192.168.' + RAND_S2 + '.254';
    var STATIC_ARP_IP = '192.168.' + RAND_S1 + '.100';
    var SUBNET1 = '192.168.' + RAND_S1 + '.0';
    var SUBNET2 = '192.168.' + RAND_S2 + '.0';

    var DEVICES = {
        AR1: {
            type: 'router', name: 'AR1',
            interfaces: {
                'G0/0/0': { ip: '', mask: '', status: 'up' },
                'G0/0/1': { ip: '', mask: '', status: 'up' }
            },
            arpTable: {},
            x: 0, y: 0
        },
        S1: { type: 'switch', name: 'S1', x: 0, y: 0 },
        S2: { type: 'switch', name: 'S2', x: 0, y: 0 },
        PC1: { type:'pc', name:'PC1', ip:PC1_IP, mask:'255.255.255.0', mac:'5489-9800-0001', gateway:AR1_G0_IP, switch:'S1', arpTable:{}, x:0, y:0 },
        PC2: { type:'pc', name:'PC2', ip:PC2_IP, mask:'255.255.255.0', mac:'5489-9800-0002', gateway:AR1_G0_IP, switch:'S1', arpTable:{}, x:0, y:0 },
        PC3: { type:'pc', name:'PC3', ip:PC3_IP, mask:'255.255.255.0', mac:'5489-9800-0003', gateway:AR1_G1_IP, switch:'S2', arpTable:{}, x:0, y:0 },
        PC4: { type:'pc', name:'PC4', ip:PC4_IP, mask:'255.255.255.0', mac:'5489-9800-0004', gateway:AR1_G1_IP, switch:'S2', arpTable:{}, x:0, y:0 }
    };

    var LINKS = [
        { from:'AR1', fromPort:'G0/0/0', to:'S1', toPort:'' },
        { from:'AR1', fromPort:'G0/0/1', to:'S2', toPort:'' },
        { from:'S1', fromPort:'', to:'PC1', toPort:'' },
        { from:'S1', fromPort:'', to:'PC2', toPort:'' },
        { from:'S2', fromPort:'', to:'PC3', toPort:'' },
        { from:'S2', fromPort:'', to:'PC4', toPort:'' }
    ];

    var STEPS = [
        { id:1, title:'查看PC1初始ARP表', hint:'第1步：切换到PC1，输入arp -a', score:3, evalFn:'evalStep1' },
        { id:2, title:'配置AR1的G0/0/0接口IP', hint:'第2步：切换到AR1，依次输入以下命令：\n1. system-view\n2. interface G0/0/0\n3. ip address ' + AR1_G0_IP + ' 255.255.255.0\n4. quit', score:6, evalFn:'evalStep2' },
        { id:3, title:'配置AR1的G0/0/1接口IP', hint:'第3步：在AR1上，依次输入以下命令：\n1. interface G0/0/1\n2. ip address ' + AR1_G1_IP + ' 255.255.255.0\n3. quit\n4. quit', score:5, evalFn:'evalStep3' },
        { id:4, title:'PC1 ping PC2观察同网段ARP', hint:'第4步：切换到PC1，输入ping ' + PC2_IP, score:7, evalFn:'evalStep4' },
        { id:5, title:'查看PC1的ARP表确认PC2的MAC', hint:'第5步：在PC1上，输入 arp -a', score:3, evalFn:'evalStep5' },
        { id:6, title:'理解ARP请求广播与响应单播', hint:'第6步：在PC1上输入 arp -broadcast 查看ARP请求广播和响应单播的详细过程', score:5, evalFn:'evalStep6' },
        { id:7, title:'PC2 ping PC1观察ARP缓存命中', hint:'第7步：切换到PC2，输入ping ' + PC1_IP, score:3, evalFn:'evalStep7' },
        { id:8, title:'理解直接交付与间接交付', hint:'第8步：在PC1上输入 deliver-mode 查看直接交付与间接交付的区别', score:5, evalFn:'evalStep8' },
        { id:9, title:'PC1 ping PC3观察跨网段ARP', hint:'第9步：切换到PC1，输入ping ' + PC3_IP, score:10, evalFn:'evalStep9' },
        { id:10, title:'查看PC1的ARP表确认网关MAC', hint:'第10步：在PC1上，输入 arp -a', score:3, evalFn:'evalStep10' },
        { id:11, title:'查看AR1直连路由表', hint:'第11步：切换到AR1，输入 display ip routing-table 查看直连路由', score:5, evalFn:'evalStep11' },
        { id:12, title:'查看AR1的ARP表', hint:'第12步：在AR1上，输入 display arp', score:3, evalFn:'evalStep12' },
        { id:13, title:'PC3 ping PC4观察另一网段ARP', hint:'第13步：切换到PC3，输入ping ' + PC4_IP, score:3, evalFn:'evalStep13' },
        { id:14, title:'在PC1上添加静态ARP', hint:'第14步：切换到PC1，输入arp -s ' + STATIC_ARP_IP + ' 5489-9800-0099', score:4, evalFn:'evalStep14' },
        { id:15, title:'查看PC1的ARP表验证静态条目', hint:'第15步：在PC1上，输入 arp -a', score:3, evalFn:'evalStep15' },
        { id:16, title:'删除静态ARP', hint:'第16步：在PC1上，输入 arp -d ' + STATIC_ARP_IP, score:3, evalFn:'evalStep16' },
        { id:17, title:'子网划分：将' + SUBNET1 + '/24划为2个子网', hint:'第17步：输入 subnet ' + SUBNET1 + ' 255.255.255.128', score:5, evalFn:'evalStep17' },
        { id:18, title:'子网划分：将' + SUBNET2 + '/24划为4个子网', hint:'第18步：输入 subnet ' + SUBNET2 + ' 255.255.255.192', score:4, evalFn:'evalStep18' },
        { id:19, title:'路由聚合与最长前缀匹配', hint:'第19步：在AR1上输入 route-summary 查看路由聚合与最长前缀匹配原理', score:8, evalFn:'evalStep19' },
        { id:20, title:'验证子网掩码对通信的影响', hint:'第20步：在PC1上，输入 ipconfig', score:4, evalFn:'evalStep20' },
        { id:21, title:'ARP思考题', hint:'第21步：切换到PC1，输入 think-arp 查看思考题，再用 think-arp-answer <题号> <答案> 作答（需答对3题以上）', score:5, evalFn:'evalStep21' },
        { id:22, title:'完成实验总结', hint:'第22步：总结ARP工作原理、静态与动态ARP区别、子网划分方法，点击提交报告', score:3, evalFn:'evalStep22' }
    ];

    var currentStep = 1;
    var stepResults = {};
    var totalScore = 0;
    var animating = false;
    var animFrame = null;
    var framePackets = [];
    var demoMode = false;
    var demoUsed = false;
    var demoTimer = null;

    var currentDevice = 'PC1';
    var viewMode = 'user';
    var currentInterface = '';
    var consoleHistory = {};

    var step1Done = false;
    var step2Done = false;
    var step3Done = false;
    var step4Done = false;
    var step5Done = false;
    var step6Done = false;
    var step7Done = false;
    var step8Done = false;
    var step9Done = false;
    var step10Done = false;
    var step11Done = false;
    var step12Done = false;
    var step13Done = false;
    var step14Done = false;
    var step15Done = false;
    var step16Done = false;
    var step17Done = false;
    var step18Done = false;
    var step19Done = false;
    var step20Done = false;
    var step21Done = false;
    var thinkArpAnswers = {};

    var subnetResults = [];
    var viewedArpDevices = {};

    var canvas, ctx;

    function init() {
        LabScoringEnhance.init(30);
        canvas = document.getElementById('simCanvas');
        ctx = canvas.getContext('2d');
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);
        renderStepList();
        drawTopology();
        switchDevice('PC1');
        updateInfoPanels();
    }

    function resizeCanvas() {
        var wrap = canvas.parentElement;
        canvas.width = wrap.clientWidth;
        canvas.height = wrap.clientHeight;
        drawTopology();
    }

    function drawTopology() {
        if (!ctx) return;
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        DEVICES.AR1.x = w * 0.5;  DEVICES.AR1.y = h * 0.15;
        DEVICES.S1.x = w * 0.25;  DEVICES.S1.y = h * 0.45;
        DEVICES.S2.x = w * 0.75;  DEVICES.S2.y = h * 0.45;
        DEVICES.PC1.x = w * 0.1;  DEVICES.PC1.y = h * 0.82;
        DEVICES.PC2.x = w * 0.35; DEVICES.PC2.y = h * 0.82;
        DEVICES.PC3.x = w * 0.65; DEVICES.PC3.y = h * 0.82;
        DEVICES.PC4.x = w * 0.9;  DEVICES.PC4.y = h * 0.82;

        for (var i = 0; i < LINKS.length; i++) {
            var lk = LINKS[i];
            var fd = DEVICES[lk.from], td = DEVICES[lk.to];
            drawLink(fd.x, fd.y, td.x, td.y, lk.fromPort);
        }

        drawRouter(DEVICES.AR1.x, DEVICES.AR1.y, 'AR1');
        drawSwitch(DEVICES.S1.x, DEVICES.S1.y, 'S1');
        drawSwitch(DEVICES.S2.x, DEVICES.S2.y, 'S2');
        drawPC(DEVICES.PC1.x, DEVICES.PC1.y, 'PC1', DEVICES.PC1);
        drawPC(DEVICES.PC2.x, DEVICES.PC2.y, 'PC2', DEVICES.PC2);
        drawPC(DEVICES.PC3.x, DEVICES.PC3.y, 'PC3', DEVICES.PC3);
        drawPC(DEVICES.PC4.x, DEVICES.PC4.y, 'PC4', DEVICES.PC4);

        drawFramePackets();
    }

    function drawTextWithShadow(text, x, y, color, font) {
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawRouter(x, y, name) {
        var rw = 120, rh = 55;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#f59e0b';
        ctx.lineWidth = 2;
        roundRect(ctx, x - rw/2, y - rh/2, rw, rh, 8);
        ctx.fill(); ctx.stroke();

        drawTextWithShadow(name, x, y - 12, '#ffffff', 'bold 14px Microsoft YaHei');
        var g000 = DEVICES.AR1.interfaces['G0/0/0'];
        var g001 = DEVICES.AR1.interfaces['G0/0/1'];
        var g000Ip = g000.ip ? g000.ip : '未配置';
        var g001Ip = g001.ip ? g001.ip : '未配置';
        drawTextWithShadow('G0/0/0:' + g000Ip, x, y + 4, '#ffe066', '9px Consolas');
        drawTextWithShadow('G0/0/1:' + g001Ip, x, y + 16, '#ffe066', '9px Consolas');
    }

    function drawSwitch(x, y, name) {
        var sw = 90, sh = 45;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 2;
        roundRect(ctx, x - sw/2, y - sh/2, sw, sh, 8);
        ctx.fill(); ctx.stroke();

        drawTextWithShadow(name, x, y - 6, '#ffffff', 'bold 13px Microsoft YaHei');
        drawTextWithShadow('交换机', x, y + 10, '#ffe066', '11px Microsoft YaHei');
    }

    function drawPC(x, y, name, pc) {
        var pw = 65, ph = 50;
        ctx.fillStyle = '#1e3355';
        ctx.strokeStyle = '#5b8dc9';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - pw/2, y - ph/2, pw, ph, 6);
        ctx.fill(); ctx.stroke();

        drawTextWithShadow(name, x, y - 16, '#ffffff', 'bold 12px Microsoft YaHei');
        drawTextWithShadow(pc.ip, x, y, '#ffe066', '9px Consolas');
        drawTextWithShadow(pc.mac, x, y + 12, '#ffe066', '9px Consolas');
    }

    function drawLink(x1, y1, x2, y2, port) {
        ctx.beginPath();
        ctx.strokeStyle = '#4a6a9a';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        if (port) {
            var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
            drawTextWithShadow(port, mx, my - 8, '#ffe066', 'bold 9px Consolas');
        }
    }

    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    function drawFramePackets() {
        for (var i = 0; i < framePackets.length; i++) {
            var p = framePackets[i];
            ctx.save();
            ctx.globalAlpha = p.alpha || 1;
            ctx.fillStyle = p.color || '#fbbf24';
            ctx.strokeStyle = p.borderColor || '#f59e0b';
            ctx.lineWidth = 2;
            var lbl = p.label || 'FRAME';
            ctx.font = 'bold 13px Consolas';
            var tw = ctx.measureText(lbl).width;
            var pw = tw + 20, ph = 28;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, p.x - pw/2, p.y - ph/2, pw, ph, 6);
            ctx.fill(); ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            drawTextWithShadow(lbl, p.x, p.y, '#ffffff', 'bold 13px Consolas');
            ctx.restore();
        }
    }

    function handlePing(pcName, targetIp) {
        var pc = DEVICES[pcName];
        var targetPc = null;
        var pcNames = ['PC1','PC2','PC3','PC4'];
        for (var i = 0; i < pcNames.length; i++) {
            if (DEVICES[pcNames[i]].ip === targetIp) {
                targetPc = DEVICES[pcNames[i]];
                break;
            }
        }
        if (!targetPc) {
            consolePrint('Ping ' + targetIp + ': 目标主机不可达');
            return;
        }

        var sameSubnet = isSameSubnet(pc.ip, pc.mask, targetIp);

        if (sameSubnet) {
            handleSameSubnetPing(pcName, pc, targetPc, targetIp);
        } else {
            handleCrossSubnetPing(pcName, pc, targetPc, targetIp);
        }
    }

    function isSameSubnet(ip1, mask, ip2) {
        var a1 = ip1.split('.').map(Number);
        var a2 = ip2.split('.').map(Number);
        var m = mask.split('.').map(Number);
        for (var i = 0; i < 4; i++) {
            if ((a1[i] & m[i]) !== (a2[i] & m[i])) return false;
        }
        return true;
    }

    function handleSameSubnetPing(pcName, pc, targetPc, targetIp) {

    function handleCrossSubnetPing(pcName, pc, targetPc, targetIp) {

            gatewayMac = '5489-9800-A001';

        var hadGwArp = !!pc.arpTable[gatewayIp];

            consolePrint('ARP Reply: 网关 ' + gatewayIp + ' 回复MAC=' + gatewayMac);
        }

        pc.arpTable[gatewayIp] = { mac: gatewayMac, type: '动态' };

        if (!DEVICES.AR1.arpTable[targetPc.ip]) {
            DEVICES.AR1.arpTable[targetPc.ip] = { mac: targetPc.mac, type: '动态', interface: targetGateway === '192.168.1.254' ? 'G0/0/0' : 'G0/0/1' };
        }

        if (!targetPc.arpTable[targetGateway]) {
            targetPc.arpTable[targetGateway] = { mac: targetGatewayMac, type: '动态' };
        }
        targetPc.arpTable[pc.ip] = { mac: targetGatewayMac, type: '动态' };

        var path = findCrossSubnetPath(pcName, targetPc.name);
        updateFrameInfo(pc.mac, gatewayMac, pc.ip, targetIp, hadGwArp ? 'ARP缓存命中-经网关转发' : 'ARP请求网关→经路由器转发');

        animatePing(path, pc, targetPc, function() {

            consolePrint('Ping ' + targetIp + ': 应答时间=2ms TTL=127');
            consolePrint('Ping ' + targetIp + ': 应答时间=2ms TTL=127');
            consolePrint('--- ' + targetIp + ' Ping统计 ---');
            consolePrint('  数据率 已发送3, 已接收3, 丢失=0');

            if (pcName === 'PC1' && targetPc.name === 'PC3') step9Done = true;

            updateInfoPanels();
            autoEvaluate();

    function findSameSubnetPath(srcPc, dstPc) {
        return [
            { type:'pc', name:srcPc },

        ];
    }

    function findCrossSubnetPath(srcPc, dstPc) {
        return [
            { type:'pc', name:srcPc },
            { type:'switch', name:DEVICES[srcPc].switch },
            { type:'router', name:'AR1' },
            { type:'switch', name:DEVICES[dstPc].switch },

    function handleSubnet(networkAddr, subnetMask) {
        var netParts = networkAddr.split('.').map(Number);
        var maskParts = subnetMask.split('.').map(Number);

        if (netParts.length !== 4 || maskParts.length !== 4) {
            consolePrint('错误: 无效的IP地址或子网掩码格');
            return;
        }

        var maskBits = 0;
        for (var i = 0; i < 4; i++) {
            maskBits += countBits(maskParts[i]);
        }

        var netAddr = [];
        for (var j = 0; j < 4; j++) {
            netAddr.push(netParts[j] & maskParts[j]);
        }
        var calculatedNet = netAddr.join('.');

        var origBits = 0;
        for (var k = 0; k < 4; k++) {
            origBits += countBits(netParts[k] | (~maskParts[k] & 255));
        }

        var borrowBits = maskBits - (32 - (32 - maskBits));
        var hostBits = 32 - maskBits;
        var numSubnets = Math.pow(2, maskBits - getOriginalPrefix(networkAddr));
        var hostsPerSubnet = Math.pow(2, hostBits) - 2;

        var origPrefix = getOriginalPrefix(networkAddr);
        var borrowedBits = maskBits - origPrefix;

        if (borrowedBits < 0) {
            consolePrint('错误: 子网掩码长度不能小于原始网络前缀');
            return;
        }

        numSubnets = Math.pow(2, borrowedBits);
        hostsPerSubnet = Math.pow(2, 32 - maskBits) - 2;

        consolePrint('========================================');
        consolePrint('子网划分结果');
        consolePrint('========================================');
        consolePrint('原始网络: ' + networkAddr + '/' + origPrefix);
        consolePrint('子网掩码: ' + subnetMask + ' (/' + maskBits + ')');
        consolePrint('借用位数: ' + borrowedBits);
        consolePrint('子网数量: ' + numSubnets);
        consolePrint('每个子网可用主机 ' + hostsPerSubnet);
        consolePrint('----------------------------------------');

        var subnetInfo = [];
        for (var s = 0; s < numSubnets; s++) {
            var subNetAddr = [];
            var increment = Math.pow(2, 32 - maskBits) * s;
            var addrVal = (netAddr[0] << 24 | netAddr[1] << 16 | netAddr[2] << 8 | netAddr[3]) + increment;
            subNetAddr.push((addrVal >>> 24) & 255);
            subNetAddr.push((addrVal >>> 16) & 255);
            subNetAddr.push((addrVal >>> 8) & 255);
            subNetAddr.push(addrVal & 255);

            var broadcast = [];
            var bcVal = addrVal + Math.pow(2, 32 - maskBits) - 1;
            broadcast.push((bcVal >>> 24) & 255);
            broadcast.push((bcVal >>> 16) & 255);
            broadcast.push((bcVal >>> 8) & 255);
            broadcast.push(bcVal & 255);

            var firstHost = subNetAddr.slice();
            firstHost[3] += 1;
            var lastHost = broadcast.slice();
            lastHost[3] -= 1;

            consolePrint('子网 ' + (s+1) + ':');
            consolePrint('  网络地址: ' + subNetAddr.join('.'));
            consolePrint('  广播地址: ' + broadcast.join('.'));
            consolePrint('  可用范围: ' + firstHost.join('.') + ' - ' + lastHost.join('.'));

            subnetInfo.push({
                network: subNetAddr.join('.'),
                broadcast: broadcast.join('.'),
                firstHost: firstHost.join('.'),
                lastHost: lastHost.join('.'),
                hosts: hostsPerSubnet
            });
        }
        consolePrint('========================================');

        subnetResults = subnetInfo;
        updateSubnetPanel(subnetInfo);

        if (networkAddr === '192.168.1.0' && subnetMask === '255.255.255.128') step17Done = true;
        if (networkAddr === '192.168.2.0' && subnetMask === '255.255.255.192') step18Done = true;
    }

    function getOriginalPrefix(networkAddr) {
        var parts = networkAddr.split('.').map(Number);
        var first = parts[0];
        if (first >= 1 && first <= 126) return 8;
        if (first >= 128 && first <= 191) return 16;
        if (first >= 192 && first <= 223) return 24;
        return 24;
    }

    function countBits(n) {
        var count = 0;
        while (n) { count += n & 1; n >>= 1; }
        return count;
    }

    function countMaskBits(mask) {
        var parts = mask.split('.').map(Number);
        var bits = 0;
        for (var i = 0; i < 4; i++) bits += countBits(parts[i]);
        return bits;
    }

    function isValidIp(ip) {
        var parts = ip.split('.');
        if (parts.length !== 4) return false;
        for (var i = 0; i < 4; i++) {
            var n = parseInt(parts[i]);
            if (isNaN(n) || n < 0 || n > 255) return false;
        }
        return true;
    }

    function calcNetworkAddr(ip, mask) {
        var ipParts = ip.split('.').map(Number);
        var maskParts = mask.split('.').map(Number);
        var result = [];
        for (var i = 0; i < 4; i++) {
            result.push(ipParts[i] & maskParts[i]);
        }
        return result.join('.');
    }

    function padRight(str, len) {
        while (str.length < len) str += ' ';
        return str;
    }

    function animatePing(path, srcPc, dstPc, callback) {
        if (animating) return;
        animating = true;

        if (demoMode) {
            animating = false;
            if (callback) callback();
            return;
        }

        var waypoints = [];
        for (var i = 0; i < path.length; i++) {
            var node = path[i];
            var dev = DEVICES[node.name];
            if (dev) waypoints.push({ x: dev.x, y: dev.y });
        }

        var packet = { x: waypoints[0].x, y: waypoints[0].y, color: '#fbbf24', borderColor: '#f59e0b', label: 'ICMP', alpha: 1 };
        framePackets = [packet];

        var totalSegments = waypoints.length - 1;
        var currentSegment = 0;
        var step = 0;
        var stepsPerSegment = 30;

        function animate() {
            step++;
            var t = easeInOut(step / stepsPerSegment);
            var from = waypoints[currentSegment];
            var to = waypoints[currentSegment + 1];
            packet.x = from.x + (to.x - from.x) * t;
            packet.y = from.y + (to.y - from.y) * t;
            drawTopology();

            if (step >= stepsPerSegment) {
                currentSegment++;
                step = 0;
                if (currentSegment >= totalSegments) {
                    setTimeout(function() {
                        packet.color = '#4ade80';
                        packet.borderColor = '#22c55e';
                        packet.label = 'REPLY';
                        updateFrameInfo(dstPc.mac, srcPc.mac, dstPc.ip, srcPc.ip, 'ICMP Echo Reply');

                        var replySegment = totalSegments - 1;
                        var replyStep = 0;
                        function animateReply() {
                            replyStep++;
                            var rt = easeInOut(replyStep / stepsPerSegment);
                            var rFrom = waypoints[replySegment + 1];
                            var rTo = waypoints[replySegment];
                            packet.x = rFrom.x + (rTo.x - rFrom.x) * rt;
                            packet.y = rFrom.y + (rTo.y - rFrom.y) * rt;
                            drawTopology();
                            if (replyStep >= stepsPerSegment) {
                                replySegment--;
                                replyStep = 0;
                                if (replySegment < 0) {
                                    setTimeout(function() {
                                        framePackets = [];
                                        drawTopology();
                                        animating = false;
                                        if (callback) callback();
                                    }, 300);
                                    return;
                                }
                                setTimeout(function() { animFrame = requestAnimationFrame(animateReply); }, 1000);
                            } else {
                                animFrame = requestAnimationFrame(animateReply);
                            }
                        }
                        animFrame = requestAnimationFrame(animateReply);
                    }, 300);
                    return;
                }
                setTimeout(function() { animFrame = requestAnimationFrame(animate); }, 1000);
            }
            animFrame = requestAnimationFrame(animate);
        }
        animFrame = requestAnimationFrame(animate);
    }

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function autoEvaluate() {
        var changed = false;
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id]) continue;
            var result = window[s.evalFn]();
            if (result === 'pass' || result === 'fail') {
                stepResults[s.id] = result;
                showEvalResult(s.id, result);
                changed = true;
            }
        }
        if (changed) {
            var nextStep = 0;
            for (var j = 0; j < STEPS.length; j++) {
                if (!stepResults[STEPS[j].id]) { nextStep = STEPS[j].id; break; }
            }
            if (nextStep) { currentStep = nextStep; document.getElementById('hintBox').textContent = STEPS[nextStep - 1].hint; }
        }
        updateProgress();
        renderStepList();
    }

    function showEvalResult(stepId, result) {
        var body = document.getElementById('evalBody');

        for (var id in stepResults) {

    function updateProgress() {
        var completed = 0;
        totalScore = 0;
        for (var id in stepResults) {
            if (stepResults[id] === 'pass') {
                completed++;
                totalScore += STEPS[id - 1].score;
            }
        }
        var pct = Math.round(completed / STEPS.length * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = pct + '%';
        var displayScore = Math.round(totalScore * 0.8);
        document.getElementById('scoreFill').style.width = displayScore + '%';
        document.getElementById('scoreText').textContent = displayScore + '/80';

        var nextStep = null;
        for (var i = 0; i < STEPS.length; i++) {
            if (!stepResults[STEPS[i].id]) { nextStep = STEPS[i].id; break; }
        }
        if (nextStep) {
            currentStep = nextStep;
            document.getElementById('hintBox').textContent = STEPS[nextStep - 1].hint;
        }
    }

        }

    async function submitExperiment() {
        if (labScheduleState === 'not_started') { alert('实验未开放，不能提交报告'); return; }
        if (labScheduleState === 'ended') { alert('实验已结束，不能再提交报告'); return; }
        if (demoMode || demoUsed) {
            consolePrint('[提示] 演示模式下无法提交实验报告，请手动完成实验后提交换');
            return;
        }
        autoEvaluate();
        var passed = 0;
        var stepScore = 0;
        var details = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id] === 'pass') {
                passed++;
                stepScore += s.score;
                details += '步骤' + s.id + '. ' + s.title + ' ' + s.score + '<br>';
            } else {
                details += '步骤' + s.id + '. ' + s.title + ' 0<br>';
            }
        }

        var scoreResult = LabScoringEnhance.getFinalScore(stepScore, 100);
        details += '<br>--- 综合评价 ---<br>';
        details += LabScoringEnhance.formatDetails(scoreResult);

        document.getElementById('resultSummary').textContent = '共完成' + passed + '/' + STEPS.length + ' 个实验步骤';
        document.getElementById('finalScore').textContent = scoreResult.totalScore;
        document.getElementById('finalScore').style.color = scoreResult.totalScore >= 60 ? '#22c55e' : '#ef4444';
        document.getElementById('resultDetails').innerHTML = details;

        var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (currentUser.username && currentUser.type === 'student') {
            try {
                var labTitle = document.querySelector('.top-bar h1').textContent.trim();
                var reportEntry = {
                    labTitle: labTitle,
                    score: scoreResult.totalScore,
                    maxScore: 100,
                    submitTime: new Date().toISOString(),
                    mode: 'manual',
                    details: details,
                    baseScore: scoreResult.baseScore,
                    accuracyScore: scoreResult.accuracyScore,
                    efficiencyScore: scoreResult.efficiencyScore,
                    errorCount: scoreResult.errorCount,
                    elapsedMinutes: scoreResult.elapsedMinutes
                };
                var token = localStorage.getItem('authToken') || '';
                var res = await fetch(API_BASE + '/api/lab-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ studentId: currentUser.username, report: reportEntry })
                });
                var result = await res.json();
                if (result.error) console.error('提交报告失败:', result.error);
            } catch (e) { console.error('提交报告失败:', e); }
        }

        document.getElementById('resultModal').classList.add('show');

        stepResults[22] = passed >= STEPS.length - 1 ? 'pass' : 'fail';
        showEvalResult(22, stepResults[22]);
        updateProgress();
        renderStepList();
    }

    window.addEventListener('load', init);
    </script>


    <script>

        schedules = data.schedules || {};
    } catch(e) {}
    var s = schedules[THIS_LAB_ID] || {};
    var now = new Date().getTime();
    window.labScheduleState = 'not_started';

    else if (s.startTime && now < new Date(s.startTime).getTime()) window.labScheduleState = 'not_started';
    else if (s.endTime && now > new Date(s.endTime).getTime()) window.labScheduleState = 'ended';
    else if (s.startTime || s.endTime) window.labScheduleState = 'open';

    if (user.type === 'student' && labScheduleState === 'not_started') {

        banner.innerHTML = '⚠️ 实验已结束，您可以查看实验内容，但不能再提交实验报告';

    function toggleHintPanel() {
        var panel = document.getElementById('floatHintPanel');
        if (panel.classList.contains('hidden')) {
            panel.classList.remove('hidden');
        } else {
            panel.classList.add('hidden');
        }
    }

    (function() {
        var header = document.getElementById('floatHintHeader');
        var panel = document.getElementById('floatHintPanel');
        if (!header || !panel) return;
        var dragging = false, offsetX = 0, offsetY = 0;
        header.addEventListener('mousedown', function(e) {
            dragging = true;
            var rect = panel.getBoundingClientRect();
            var parentRect = panel.parentElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            panel.style.left = (rect.left - parentRect.left) + 'px';
            panel.style.top = (rect.top - parentRect.top) + 'px';
            panel.style.right = 'auto';
            panel.style.bottom = 'auto';
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            var parentRect = panel.parentElement.getBoundingClientRect();
            panel.style.left = (e.clientX - parentRect.left - offsetX) + 'px';
            panel.style.top = (e.clientY - parentRect.top - offsetY) + 'px';
        });
        document.addEventListener('mouseup', function() { dragging = false; });
    })();
    })();
    </script>
