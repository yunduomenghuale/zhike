    <style>

        .eval-fail { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }

        .btn-primary { background: #4a90e2; color: white; }

        .btn-success { background: #22c55e; color: white; }

        .sw-tab.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        .sw-tab:hover { background: #1a2150; }
        .sw-tab.active:hover { background: #357abd; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #151b3d; border: 2px solid #4a90e2; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; text-align: center; }
        .modal-box h2 { color: #38bdf8; margin-bottom: 15px; }
        .modal-box p { color: #94a3b8; margin-bottom: 20px; line-height: 1.8; }
        .modal-box .final-score { font-size: 48px; color: #22c55e; font-weight: bold; margin: 15px 0; }

<body>
    <div class="top-bar">
        <h1>实验四：VLAN互连与NAT综合实验</h1>
        <div class="exp-info">计算机网络实验教| 虚拟仿真实验 | 配套教材：基于华为eNSP</div>
    </div>

    <div class="main-layout">
    <div class="step-panel">
        <h3>实验步骤</h3>
        <div id="stepList"></div>
        <div style="padding:10px; margin-top:10px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验进度</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="progressFill" style="width:0%"></div></div>
                <span class="score-text" id="progressText">0%</span>
            </div>
        </div>
        <div style="padding:10px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验评分</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="scoreFill" style="width:0%"></div></div>
                <span class="score-text" id="scoreText">0</span>
            </div>
        </div>
        <div style="padding:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="resetExperiment()">重置实验</button>
            <button class="btn btn-warning btn-sm" onclick="showDemo()">演示模式</button>
            <button class="btn btn-success btn-sm" onclick="submitExperiment()">提交报告</button>
        </div>
    </div>

    <div class="sim-area">
        <div class="sim-canvas-wrap">
            <canvas id="simCanvas"></canvas>
        </div>
        <div class="float-hint-panel" id="floatHintPanel">
            <div class="float-hint-header" id="floatHintHeader">
                <span>💡 实验提示</span>
                <button class="float-hint-close" onclick="toggleHintPanel()">×</button>
            </div>
            <div class="float-hint-body" id="hintBox">请按照左侧步骤依次完成实验。点击当前步骤可查看详细提示。</div>
        </div>
        <div class="console-area">
            <div class="console-header">
                <span id="consoleTitle">设备控制台</span>
                <div style="display:flex;gap:4px;align-items:center;flex-wrap:wrap;">
                    <span style="font-size:11px;color:#94a3b8;">切换设备：</span>
                    <button class="sw-tab active" data-device="S1" onclick="switchDevice('S1')">S1</button>
                    <button class="sw-tab" data-device="AR1" onclick="switchDevice('AR1')">AR1</button>
                    <button class="sw-tab" data-device="PC1" onclick="switchDevice('PC1')">PC1</button>
                    <button class="sw-tab" data-device="PC2" onclick="switchDevice('PC2')">PC2</button>
                    <button class="sw-tab" data-device="PC3" onclick="switchDevice('PC3')">PC3</button>
                    <button class="sw-tab" data-device="PC4" onclick="switchDevice('PC4')">PC4</button>
                    <button class="sw-tab" data-device="Server" onclick="switchDevice('Server')">Server</button>
                    <button class="btn btn-sm" style="background:#1a2150;color:#94a3b8;margin-left:6px;" onclick="clearConsole()">清屏</button>
                </div>
            </div>
            <div class="console-output" id="consoleOutput"></div>
            <div class="console-input-wrap">
                <span class="console-prompt" id="consolePrompt">&lt;S1&gt;</span>
                <input type="text" class="console-input" id="consoleInput" placeholder="输入命令后按回车..." onkeydown="handleCommand(event)">
            </div>
        </div>
    </div>

    <div class="info-panel">
        <div class="panel-card">
            <div class="panel-card-header"><span>VLAN信息</span></div>
            <div class="panel-card-body" id="vlanInfoBody">

                    <thead><tr><th>VLAN ID</th><th>名称</th><th>端口</th></tr></thead>
                    <tbody id="vlanTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">VLAN 1 (default)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>NAT转换表</span></div>
            <div class="panel-card-body" id="natTableBody">
                <table class="mac-table">
                    <thead><tr><th>类型</th><th>内部地址</th><th>外部地址</th></tr></thead>
                    <tbody id="natTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">(无NAT条目)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>路由表</span></div>
            <div class="panel-card-body" id="routeTableBody">
                <table class="mac-table">
                    <thead><tr><th>目的网络</th><th>下一跳</th><th>接口</th></tr></thead>
                    <tbody id="routeTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">(直连路由)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>当前帧信息</span></div>
            <div class="panel-card-body" id="frameInfoBody">
                <div class="frame-info" id="frameInfo">
                    <span class="label">等待帧传输..</span>
                </div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>步骤评判</span></div>
            <div class="panel-card-body" id="evalBody">
                <div style="color:#94a3b8;font-size:12px;">完成步骤后自动评估</div>
            </div>
        </div>
    </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <h2>实验报告</h2>
            <p id="resultSummary"></p>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size:14px;">总分（满00分）</p>
            <div id="resultDetails" style="text-align:left;margin:15px 0;font-size:13px;color:#94a3b8;line-height:2;"></div>
            <button class="btn btn-primary" onclick="document.getElementById('resultModal').classList.remove('show')">关闭</button>
            <button class="btn btn-success" onclick="LabReportGenerator.showConclusionDialog()" style="margin-left:10px;">生成实验报告</button>
        </div>
    </div>

    <script>
    var RAND_V10 = Math.floor(Math.random() * 9) + 1;
    var RAND_V20 = Math.floor(Math.random() * 9) + 1;
    while (RAND_V20 === RAND_V10) RAND_V20 = Math.floor(Math.random() * 9) + 1;
    var RAND_LINK = Math.floor(Math.random() * 9) + 1;
    while (RAND_LINK === RAND_V10 || RAND_LINK === RAND_V20) RAND_LINK = Math.floor(Math.random() * 9) + 1;
    var RAND_EXT = Math.floor(Math.random() * 9) + 1;
    var VLAN10_NET = '192.168.' + RAND_V10 + '.0';
    var VLAN20_NET = '192.168.' + RAND_V20 + '.0';
    var LINK_NET = '192.168.' + RAND_LINK + '.0';
    var EXT_NET = '202.' + RAND_EXT + '.1.0';
    var PC1_IP = '192.168.' + RAND_V10 + '.1';
    var PC2_IP = '192.168.' + RAND_V10 + '.2';
    var PC3_IP = '192.168.' + RAND_V20 + '.1';
    var PC4_IP = '192.168.' + RAND_V20 + '.2';
    var PC1_GW = '192.168.' + RAND_V10 + '.254';
    var PC2_GW = PC1_GW;
    var PC3_GW = '192.168.' + RAND_V20 + '.254';
    var PC4_GW = PC3_GW;
    var VLANIF10_IP = PC1_GW;
    var VLANIF20_IP = PC3_GW;
    var VLANIF100_IP = '192.168.' + RAND_LINK + '.2';
    var AR1_G0_IP = '192.168.' + RAND_LINK + '.1';
    var AR1_G1_IP = '202.' + RAND_EXT + '.1.1';
    var NAT_GLOBAL_IP = '202.' + RAND_EXT + '.1.10';
    var NAT_POOL_START = '202.' + RAND_EXT + '.1.20';
    var NAT_POOL_END = '202.' + RAND_EXT + '.1.30';
    var SERVER_IP = '8.8.8.8';
    var SERVER_GW = AR1_G1_IP;

    var DEVICES = {
        AR1: {
            type: 'router', name: 'AR1',
            interfaces: {
                'G0/0/0': { ip: '', mask: '', status: 'up' },
                'G0/0/1': { ip: '', mask: '', status: 'up' }
            },
            routes: [],
            natStatic: [],
            natAcl: {},
            natAddressGroup: {},
            natOutbound: [],
            x: 0, y: 0
        },
        S1: {
            type: 'l3switch', name: 'S1',
            vlans: { '1': { name: 'default', ports: ['G0/0/1','G0/0/2','G0/0/3','G0/0/4','G0/0/24'] } },
            portMode: { 'G0/0/1':'access','G0/0/2':'access','G0/0/3':'access','G0/0/4':'access','G0/0/24':'access' },
            portVlan: { 'G0/0/1':1,'G0/0/2':1,'G0/0/3':1,'G0/0/4':1,'G0/0/24':1 },
            vlanif: {},
            routes: [],
            x: 0, y: 0
        },
        PC1: { type:'pc', name:'PC1', ip:PC1_IP, mask:'255.255.255.0', mac:'5489-9800-0001', gateway:PC1_GW, switch:'S1', port:'G0/0/1', arpTable:{}, x:0, y:0 },
        PC2: { type:'pc', name:'PC2', ip:PC2_IP, mask:'255.255.255.0', mac:'5489-9800-0002', gateway:PC2_GW, switch:'S1', port:'G0/0/2', arpTable:{}, x:0, y:0 },
        PC3: { type:'pc', name:'PC3', ip:PC3_IP, mask:'255.255.255.0', mac:'5489-9800-0003', gateway:PC3_GW, switch:'S1', port:'G0/0/3', arpTable:{}, x:0, y:0 },
        PC4: { type:'pc', name:'PC4', ip:PC4_IP, mask:'255.255.255.0', mac:'5489-9800-0004', gateway:PC4_GW, switch:'S1', port:'G0/0/4', arpTable:{}, x:0, y:0 },
        Server: { type:'server', name:'Server', ip:SERVER_IP, mask:'255.255.255.0', mac:'5489-9800-0088', gateway:SERVER_GW, arpTable:{}, x:0, y:0 }
    };

    var LINKS = [
        { from:'AR1', fromPort:'G0/0/0', to:'S1', toPort:'G0/0/24' },
        { from:'AR1', fromPort:'G0/0/1', to:'Server', toPort:'' },
        { from:'S1', fromPort:'G0/0/1', to:'PC1', toPort:'' },
        { from:'S1', fromPort:'G0/0/2', to:'PC2', toPort:'' },
        { from:'S1', fromPort:'G0/0/3', to:'PC3', toPort:'' },
        { from:'S1', fromPort:'G0/0/4', to:'PC4', toPort:'' }
    ];

    var STEPS = [
        { id:1, title:'在S1上创建VLAN 10和VLAN 20', hint:'第1步：切换到S1，依次输入以下命令：\n1. system-view\n2. vlan 10\n3. quit\n4. vlan 20\n5. quit', score:4, evalFn:'evalStep1' },
        { id:2, title:'将S1的G0/0/1和G0/0/2划入VLAN 10', hint:'第2步：在S1上，依次输入以下命令：\n1. interface G0/0/1\n2. port link-type access\n3. port default vlan 10\n4. quit\n5. interface G0/0/2\n6. port link-type access\n7. port default vlan 10\n8. quit', score:4, evalFn:'evalStep2' },
        { id:3, title:'将S1的G0/0/3和G0/0/4划入VLAN 20', hint:'第3步：在S1上，依次输入以下命令：\n1. interface G0/0/3\n2. port link-type access\n3. port default vlan 20\n4. quit\n5. interface G0/0/4\n6. port link-type access\n7. port default vlan 20\n8. quit', score:4, evalFn:'evalStep3' },
        { id:4, title:'验证VLAN隔离（PC1 ping PC3失败）', hint:'第4步：切换到PC1，输入ping ' + PC3_IP, score:4, evalFn:'evalStep4' },
        { id:5, title:'配置S1的VLANIF10接口IP', hint:'第5步：切换到S1，依次输入以下命令：\n1. system-view\n2. interface vlanif 10\n3. ip address ' + VLANIF10_IP + ' 255.255.255.0\n4. quit', score:5, evalFn:'evalStep5' },
        { id:6, title:'配置S1的VLANIF20接口IP', hint:'第6步：在S1上，依次输入以下命令：\n1. interface vlanif 20\n2. ip address ' + VLANIF20_IP + ' 255.255.255.0\n3. quit', score:4, evalFn:'evalStep6' },
        { id:7, title:'验证VLAN间路由（PC1 ping PC3成功）', hint:'第7步：切换到PC1，输入ping ' + PC3_IP, score:6, evalFn:'evalStep7' },
        { id:8, title:'单臂路由器互连VLAN', hint:'第8步：在AR1上输入 single-arm-router 查看单臂路由器互连VLAN的原理与配置', score:5, evalFn:'evalStep8' },
        { id:9, title:'三种VLAN互连方式对比', hint:'第9步：在AR1上输入 vlan-interconnect 查看三种VLAN互连方式的对比', score:5, evalFn:'evalStep9' },
        { id:10, title:'配置S1的VLANIF100连接AR1', hint:'第10步：切换到S1，依次输入以下命令：\n1. system-view\n2. vlan 100\n3. quit\n4. interface vlanif 100\n5. ip address ' + VLANIF100_IP + ' 255.255.255.0\n6. quit', score:4, evalFn:'evalStep10' },
        { id:11, title:'配置AR1的G0/0/0接口IP', hint:'第11步：切换到AR1，依次输入以下命令：\n1. system-view\n2. interface G0/0/0\n3. ip address ' + AR1_G0_IP + ' 255.255.255.0\n4. quit', score:4, evalFn:'evalStep11' },
        { id:12, title:'配置AR1的G0/0/1接口IP', hint:'第12步：在AR1上，依次输入以下命令：\n1. interface G0/0/1\n2. ip address ' + AR1_G1_IP + ' 255.255.255.0\n3. quit', score:4, evalFn:'evalStep12' },

    function drawTopology() {

        var w = canvas.width, h = canvas.height;

        DEVICES.AR1.x = w * 0.5;  DEVICES.AR1.y = h * 0.2;

        for (var i = 0; i < LINKS.length; i++) {

    function drawTextWithShadow(text, x, y, color, font) {
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawRouter(x, y, name) {
        var rw = 110, rh = 55;
        ctx.fillStyle = '#1a3a2a';
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 2;
        roundRect(ctx, x - rw/2, y - rh/2, rw, rh, 8);
        ctx.fill(); ctx.stroke();

        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        drawTextWithShadow('边界路由器', x, y + 10, '#22c55e', '11px Microsoft YaHei');

        var ar1 = DEVICES.AR1;
        var ports = Object.keys(ar1.interfaces);
        for (var i = 0; i < ports.length; i++) {
            var px = x - 20 + i * 40;
            var py = y + rh/2 + 2;
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawL3Switch(x, y, name) {
        var sw = 110, sh = 55;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 2;
        roundRect(ctx, x - sw/2, y - sh/2, sw, sh, 8);
        ctx.fill(); ctx.stroke();

        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        drawTextWithShadow('三层交换机', x, y + 10, '#ffe066', '11px Microsoft YaHei');

        var s1 = DEVICES.S1;
        var ports = Object.keys(s1.portMode);
        var portStartX = x - (ports.length - 1) * 10;
        for (var i = 0; i < ports.length; i++) {
            var px = portStartX + i * 20;
            var py = y + sh/2 + 2;
            ctx.fillStyle = '#22c55e';
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawPC(x, y, name, pc) {
        var pw = 65, ph = 45;
        ctx.fillStyle = '#1e3355';
        ctx.strokeStyle = '#5b8dc9';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - pw/2, y - ph/2, pw, ph, 6);

    function drawLink(x1, y1, x2, y2, fromPort, toPort) {
        ctx.beginPath();
        ctx.strokeStyle = '#4a6a9a';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();

        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        if (fromPort) drawTextWithShadow(fromPort, mx, my - 8, '#ffe066', 'bold 9px Consolas');
    }

    function drawVlanLabels(w, h) {
        if (DEVICES.S1.vlans[10] && DEVICES.S1.portVlan['G0/0/1'] === 10) {
            drawTextWithShadow('VLAN10', w * 0.25, h * 0.7, '#38bdf8', 'bold 11px Microsoft YaHei');
        }
        if (DEVICES.S1.vlans[20] && DEVICES.S1.portVlan['G0/0/3'] === 20) {
            drawTextWithShadow('VLAN20', w * 0.75, h * 0.7, '#f59e0b', 'bold 11px Microsoft YaHei');
        }
    }

    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    function drawFramePackets() {
        for (var i = 0; i < framePackets.length; i++) {
            var p = framePackets[i];
            ctx.save();
            ctx.globalAlpha = p.alpha || 1;
            ctx.fillStyle = p.color || '#fbbf24';
            ctx.strokeStyle = p.borderColor || '#f59e0b';
            ctx.lineWidth = 2;
            var lbl = p.label || 'FRAME';
            ctx.font = 'bold 13px Consolas';
            var tw = ctx.measureText(lbl).width;
            var pw = tw + 20, ph = 28;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, p.x - pw/2, p.y - ph/2, pw, ph, 6);
            ctx.fill(); ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            drawTextWithShadow(lbl, p.x, p.y, '#ffffff', 'bold 13px Consolas');
            ctx.restore();
        }
    }

                    prompt.textContent = '[' + currentDevice + '-' + currentVlanif + ']';

                    prompt.textContent = '[' + currentDevice + '-vlan' + currentVlan + ']';

                    prompt.textContent = '[' + currentDevice + '-acl' + currentAcl + ']';

    function handleCommand(event) {
        if (event.key !== 'Enter') return;

        var dev = DEVICES[currentDevice];

        consolePrint(promptText + cmd);

        if (dev.type === 'pc' || dev.type === 'server') {
            handlePCCommand(cmd);
        } else if (dev.type === 'router') {
            handleRouterCommand(cmd);
        } else if (dev.type === 'l3switch') {
            handleL3SwitchCommand(cmd);
        }
        autoEvaluate();
    }

    function handlePCCommand(cmd) {
        var pc = DEVICES[currentDevice];
        var parts = cmd.split(/\s+/);
        var base = parts[0].toLowerCase();

        if (base === 'ping') {
            if (parts.length < 2) { consolePrint('用法: ping <IP地址>'); return; }
            var targetIp = parts[1];
            handlePing(currentDevice, targetIp);
        } else if (base === 'arp' && parts[1] === '-a') {
            handleArpA(currentDevice);
        } else if (base === 'ipconfig') {
            consolePrint('以太网适配器信号');
            consolePrint('  IP 地址 . . . . . . . . . : ' + pc.ip);

            handleThinkVlanNat();

            if (parts.length < 3) { consolePrint('用法: think-vlan-nat-answer <题号> <答案>'); return; }

    function handlePing(pcName, targetIp) {
        var pc = DEVICES[pcName];
        var targetDev = findDeviceByIp(targetIp);

        if (!targetDev) {
            consolePrint('Ping ' + targetIp + ': 目标主机不可达达');
            return;
        }

        var result = checkConnectivity(pcName, targetDev.name, targetIp);
        if (!result.reachable) {
            consolePrint('Ping ' + targetIp + ': ' + result.reason);
            updateFrameInfo(pc.mac, targetDev.mac || '', pc.ip, targetIp, result.reason);
            if (pcName === 'PC1' && targetDev.name === 'PC3' && !checkVlanifReady()) {
                step4Done = true;
                autoEvaluate();
            }
            return;
        }

        var path = result.path;
        animatePing(path, pc, targetDev, function() {
            consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=126');
            consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=126');
            consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=126');
            consolePrint('--- ' + targetIp + ' Ping统计 ---');
            consolePrint('  数据率 已发送3, 已接收3, 丢失=0');

            pc.arpTable[pc.gateway] = '5489-9800-GW01';
            if (targetDev.arpTable) targetDev.arpTable[pc.ip] = pc.mac;

            if (pcName === 'PC1' && targetDev.name === 'PC3') {
                if (!checkVlanifReady()) {
                    step4Done = true;
                } else {
                    step7Done = true;
                }
            }
            if (pcName === 'PC1' && targetIp === AR1_G0_IP) step15Done = true;
            if (pcName === 'PC1' && targetIp === SERVER_IP && checkStaticNat()) step17Done = true;
            if (pcName === 'PC3' && targetIp === SERVER_IP && checkNapt()) step20Done = true;

            updateInfoPanels();
            autoEvaluate();
        });
    }

    function findDeviceByIp(ip) {
        var names = ['PC1','PC2','PC3','PC4','Server','AR1','S1'];
        for (var i = 0; i < names.length; i++) {
            var d = DEVICES[names[i]];
            if (d.ip === ip) return d;
            if (d.type === 'router') {
                for (var iface in d.interfaces) {
                    if (d.interfaces[iface].ip === ip) return d;
                }
            }
            if (d.type === 'l3switch') {
                for (var vif in d.vlanif) {
                    if (d.vlanif[vif].ip === ip) return d;
                }
            }
        }
        return null;
    }

    function checkVlanifReady() {
        var s1 = DEVICES.S1;
        return s1.vlanif[10] && s1.vlanif[10].ip && s1.vlanif[20] && s1.vlanif[20].ip;
    }

    function checkStaticNat() {
        var ar1 = DEVICES.AR1;
        for (var i = 0; i < ar1.natStatic.length; i++) {
            if (ar1.natStatic[i].inside === PC1_IP) return true;
        }
        return false;
    }

    function checkNapt() {
        var ar1 = DEVICES.AR1;
        return ar1.natOutbound.length > 0;
    }

    function checkConnectivity(srcName, dstName, dstIp) {
        var src = DEVICES[srcName];
        var dst = DEVICES[dstName];

        if (src.type === 'pc' && dst.type === 'pc' && src.switch === dst.switch) {
            var s1 = DEVICES.S1;
            var srcVlan = s1.portVlan[src.port];
            var dstVlan = s1.portVlan[dst.port];

            if (srcVlan !== dstVlan) {
                if (!checkVlanifReady()) {
                    return { reachable: false, reason: '来自不同VLAN，通信失败（VLAN隔离）' };
                }
                var path = [
                    { type:'pc', name:srcName },
                    { type:'l3switch', name:'S1' },
                    { type:'pc', name:dstName }
                ];
                return { reachable: true, path: path };
            }
            return { reachable: true, path: [
                { type:'pc', name:srcName },
                { type:'l3switch', name:'S1' },
                { type:'pc', name:dstName }
            ]};
        }

        if (src.type === 'pc' && dstIp === SERVER_IP) {
            if (!checkVlanifReady()) return { reachable: false, reason: '目标主机不可达达（VLANIF未配置）' };
            if (!DEVICES.S1.vlanif[100] || !DEVICES.S1.vlanif[100].ip) return { reachable: false, reason: '目标主机不可达达（VLANIF100未配置）' };
            if (!DEVICES.AR1.interfaces['G0/0/0'].ip) return { reachable: false, reason: '目标主机不可达达（AR1 G0/0/0未配置）' };
            if (!DEVICES.AR1.interfaces['G0/0/1'].ip) return { reachable: false, reason: '目标主机不可达达（AR1 G0/0/1未配置）' };
            if (!hasRoute('S1', '0.0.0.0')) return { reachable: false, reason: '目标主机不可达达（S1默认路由未配置）' };
            if (!hasRoute('AR1', VLAN10_NET) && !hasRoute('AR1', VLAN20_NET)) return { reachable: false, reason: '目标主机不可达达（AR1回程路由未配置）' };

            var srcIp = src.ip;
            var natOk = false;
            if (srcIp.startsWith('192.168.' + RAND_V10 + '.') && checkStaticNat()) natOk = true;
            if (srcIp.startsWith('192.168.' + RAND_V20 + '.') && checkNapt()) natOk = true;
            if (!natOk) return { reachable: false, reason: '目标主机不可达达（NAT未配置）' };

            return { reachable: true, path: [
                { type:'pc', name:srcName },
                { type:'l3switch', name:'S1' },
                { type:'router', name:'AR1' },
                { type:'server', name:'Server' }
            ]};
        }

        if (src.type === 'pc' && (dstIp === AR1_G0_IP || dstName === 'AR1')) {
            if (!checkVlanifReady()) return { reachable: false, reason: '目标主机不可达达（VLANIF未配置）' };
            if (!DEVICES.S1.vlanif[100] || !DEVICES.S1.vlanif[100].ip) return { reachable: false, reason: '目标主机不可达达（VLANIF100未配置）' };
            if (!DEVICES.AR1.interfaces['G0/0/0'].ip) return { reachable: false, reason: '目标主机不可达达（AR1 G0/0/0未配置）' };
            if (!hasRoute('S1', '0.0.0.0') && !hasRoute('S1', LINK_NET)) return { reachable: false, reason: '目标主机不可达达（S1路由未配置）' };

            return { reachable: true, path: [
                { type:'pc', name:srcName },
                { type:'l3switch', name:'S1' },
                { type:'router', name:'AR1' }
            ]};
        }

        if (src.type === 'server' && dstIp.startsWith('192.168.')) {
            if (!DEVICES.AR1.interfaces['G0/0/1'].ip) return { reachable: false, reason: '目标主机不可达达' };
            if (!DEVICES.AR1.interfaces['G0/0/0'].ip) return { reachable: false, reason: '目标主机不可达达' };
            return { reachable: true, path: [
                { type:'server', name:srcName },
                { type:'router', name:'AR1' },
                { type:'l3switch', name:'S1' },
                { type:'pc', name:dstName }
            ]};
        }

        return { reachable: false, reason: '目标主机不可达达' };
    }

    function computeNetwork(ip, mask) {

        return net.join('.');

    function animatePing(path, srcPc, dstPc, callback) {
        if (animating) return;
        animating = true;

        if (demoMode) {
            animating = false;
            if (callback) callback();
            return;
        }

        var waypoints = [];
        for (var i = 0; i < path.length; i++) {
            var node = path[i];
            var dev = DEVICES[node.name];
            if (dev) waypoints.push({ x: dev.x, y: dev.y });
        }

        updateFrameInfo(srcPc.mac, dstPc.mac || '', srcPc.ip, dstPc.ip || '', 'ICMP Echo Request');

        var packet = { x: waypoints[0].x, y: waypoints[0].y, color: '#fbbf24', borderColor: '#f59e0b', label: 'ICMP', alpha: 1 };
        framePackets = [packet];

        var totalSegments = waypoints.length - 1;
        var currentSegment = 0;
        var step = 0;
        var stepsPerSegment = 30;

        function animate() {
            step++;
            var t = easeInOut(step / stepsPerSegment);
            var from = waypoints[currentSegment];
            var to = waypoints[currentSegment + 1];
            packet.x = from.x + (to.x - from.x) * t;
            packet.y = from.y + (to.y - from.y) * t;
            drawTopology();

            if (step >= stepsPerSegment) {
                currentSegment++;
                step = 0;
                if (currentSegment >= totalSegments) {
                    setTimeout(function() {
                        packet.color = '#4ade80';
                        packet.borderColor = '#22c55e';
                        packet.label = 'REPLY';
                        updateFrameInfo(dstPc.mac || '', srcPc.mac, dstPc.ip || '', srcPc.ip, 'ICMP Echo Reply');

                        var replySegment = totalSegments - 1;
                        var replyStep = 0;
                        function animateReply() {
                            replyStep++;
                            var rt = easeInOut(replyStep / stepsPerSegment);
                            var rFrom = waypoints[replySegment + 1];
                            var rTo = waypoints[replySegment];
                            packet.x = rFrom.x + (rTo.x - rFrom.x) * rt;
                            packet.y = rFrom.y + (rTo.y - rFrom.y) * rt;
                            drawTopology();
                            if (replyStep >= stepsPerSegment) {
                                replySegment--;
                                replyStep = 0;
                                if (replySegment < 0) {
                                    setTimeout(function() {
                                        framePackets = [];
                                        drawTopology();
                                        animating = false;
                                        if (callback) callback();
                                    }, 300);
                                    return;
                                }
                                setTimeout(function() { animFrame = requestAnimationFrame(animateReply); }, 1000);
                            } else {
                                animFrame = requestAnimationFrame(animateReply);
                            }
                        }
                        animFrame = requestAnimationFrame(animateReply);
                    }, 300);
                    return;
                }
                setTimeout(function() { animFrame = requestAnimationFrame(animate); }, 1000);
            }
            animFrame = requestAnimationFrame(animate);
        }
        animFrame = requestAnimationFrame(animate);
    }

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function renderStepList() {
        var html = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            var cls = '';
            if (s.id === currentStep) cls = 'active';
            if (stepResults[s.id] === 'pass') cls += ' completed';
            if (stepResults[s.id] === 'fail') cls += ' failed';
            var icon = stepResults[s.id] === 'pass' ? '✅' : stepResults[s.id] === 'fail' ? '❌' : (s.id === currentStep ? '▶️' : '⏳');
            html += '<div class="step-item ' + cls + '" onclick="selectStep(' + s.id + ')">';
            html += '<span class="step-icon">' + icon + '</span>';
            html += '步骤' + s.id + '. ' + s.title;
            html += '</div>';
        }
        document.getElementById('stepList').innerHTML = html;

    function autoEvaluate() {
        var changed = false;
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id]) continue;
            var result = window[s.evalFn]();
            if (result === 'pass' || result === 'fail') {
                stepResults[s.id] = result;
                showEvalResult(s.id, result);
                changed = true;
            }
        }
        if (changed) {
            var nextStep = 0;
            for (var j = 0; j < STEPS.length; j++) {
                if (!stepResults[STEPS[j].id]) { nextStep = STEPS[j].id; break; }
            }
            if (nextStep) { currentStep = nextStep; document.getElementById('hintBox').textContent = STEPS[nextStep - 1].hint; }
        }
        updateProgress();
        renderStepList();
    }

    function updateProgress() {

        var pct = Math.round(completed / STEPS.length * 100);
        document.getElementById('progressFill').style.width = pct + '%';
        document.getElementById('progressText').textContent = pct + '%';
        document.getElementById('scoreFill').style.width = Math.round(totalScore * 0.8) + '%';
        document.getElementById('scoreText').textContent = Math.round(totalScore * 0.8) + '/80';

        var nextStep = null;
        for (var i = 0; i < STEPS.length; i++) {
            if (!stepResults[STEPS[i].id]) { nextStep = STEPS[i].id; break; }

    async function submitExperiment() {
        if (labScheduleState === 'not_started') { alert('实验未开放，不能提交报告'); return; }
        if (labScheduleState === 'ended') { alert('实验已结束，不能再提交报告'); return; }
        if (demoMode || demoUsed) {
            consolePrint('[提示] 演示模式下无法提交实验报告，请手动完成实验后提交换');
            return;
        }
        autoEvaluate();
        var passed = 0;
        var stepScore = 0;
        var details = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id] === 'pass') {
                passed++;
                stepScore += s.score;
                details += '步骤' + s.id + '. ' + s.title + ' ' + s.score + '<br>';
            } else {
                details += '步骤' + s.id + '. ' + s.title + ' 0<br>';
            }
        }

        var scoreResult = LabScoringEnhance.getFinalScore(stepScore, 100);
        details += '<br>--- 综合评价 ---<br>';
        details += LabScoringEnhance.formatDetails(scoreResult);

        document.getElementById('resultSummary').textContent = '共完成' + passed + '/' + STEPS.length + ' 个实验步骤';
        document.getElementById('finalScore').textContent = scoreResult.totalScore;
        document.getElementById('finalScore').style.color = scoreResult.totalScore >= 60 ? '#22c55e' : '#ef4444';
        document.getElementById('resultDetails').innerHTML = details;

        var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (currentUser.username && currentUser.type === 'student') {
            try {
                var labTitle = document.querySelector('.top-bar h1').textContent.trim();
                var reportEntry = {
                    labTitle: labTitle,
                    score: scoreResult.totalScore,
                    maxScore: 100,
                    submitTime: new Date().toISOString(),
                    mode: 'manual',
                    details: details,
                    baseScore: scoreResult.baseScore,
                    accuracyScore: scoreResult.accuracyScore,
                    efficiencyScore: scoreResult.efficiencyScore,
                    errorCount: scoreResult.errorCount,
                    elapsedMinutes: scoreResult.elapsedMinutes
                };
                var token = localStorage.getItem('authToken') || '';
                var res = await fetch(API_BASE + '/api/lab-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ studentId: currentUser.username, report: reportEntry })
                });
                var result = await res.json();
                if (result.error) console.error('提交报告失败:', result.error);
            } catch (e) { console.error('提交报告失败:', e); }
        }
        document.getElementById('resultModal').classList.add('show');

        stepResults[23] = passed >= STEPS.length - 1 ? 'pass' : 'fail';
        showEvalResult(23, stepResults[23]);
        updateProgress();
        renderStepList();
    }

    </script>

    function toggleHintPanel() {
        var panel = document.getElementById('floatHintPanel');
        if (panel.classList.contains('hidden')) {
            panel.classList.remove('hidden');
        } else {
            panel.classList.add('hidden');
        }
    }

    (function() {
        var header = document.getElementById('floatHintHeader');
        var panel = document.getElementById('floatHintPanel');
        if (!header || !panel) return;
        var dragging = false, offsetX = 0, offsetY = 0;
        header.addEventListener('mousedown', function(e) {
            dragging = true;
            var rect = panel.getBoundingClientRect();
            var parentRect = panel.parentElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            panel.style.left = (rect.left - parentRect.left) + 'px';
            panel.style.top = (rect.top - parentRect.top) + 'px';
            panel.style.right = 'auto';
            panel.style.bottom = 'auto';
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            var parentRect = panel.parentElement.getBoundingClientRect();
            panel.style.left = (e.clientX - parentRect.left - offsetX) + 'px';
            panel.style.top = (e.clientY - parentRect.top - offsetY) + 'px';
        });
        document.addEventListener('mouseup', function() { dragging = false; });
    })();
    })();
    </script>
