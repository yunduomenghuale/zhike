    <style>

        .score-text { font-size: 14px; font-weight: bold; color: #38bdf8; min-width: 40px; text-align: right; }
        .principle-box { background: rgba(56,189,248,0.08); border: 1px solid rgba(56,189,248,0.2); border-radius: 6px; padding: 8px 10px; font-size: 12px; color: #7dd3fc; line-height: 1.6; }
        .device-label { font-size: 12px; color: #e0e0e0; }
        .port-label { font-size: 11px; color: #94a3b8; font-family: 'Consolas', monospace; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #151b3d; border: 2px solid #4a90e2; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; text-align: center; }
        .modal-box h2 { color: #38bdf8; margin-bottom: 15px; }
        .modal-box p { color: #94a3b8; margin-bottom: 20px; line-height: 1.8; }
        .modal-box .final-score { font-size: 48px; color: #22c55e; font-weight: bold; margin: 15px 0; }
        .sw-tab { padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid #1e2a5a; background: #0d1230; color: #94a3b8; transition: all 0.3s; }
        .sw-tab.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        .sw-tab:hover { background: #1a2150; }
        .sw-tab.active:hover { background: #357abd; }
        .stp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .stp-table th { background: #1a2150; color: #94a3b8; padding: 6px 8px; text-align: left; font-weight: normal; border-bottom: 1px solid #1e2a5a; }
        .stp-table td { padding: 6px 8px; border-bottom: 1px solid #0d1230; color: #a3e635; }
        .port-role-root { color: #22c55e; font-weight: bold; }
        .port-role-designated { color: #38bdf8; font-weight: bold; }
        .port-role-alternate { color: #ef4444; font-weight: bold; }
    </style>
</head>

    <div class="top-bar">
        <h1>实验一：交换机与VLAN综合实验</h1>
        <div class="exp-info">计算机网络实验教| 虚拟仿真实验 | 配套教材：基于华为eNSP</div>
    </div>

    <div class="main-layout">
    <div class="step-panel">
        <h3>实验步骤</h3>
        <div id="stepList"></div>
        <div style="padding:10px; margin-top:10px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验进度</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="progressFill" style="width:0%"></div></div>
                <span class="score-text" id="progressText">0%</span>
            </div>
        </div>
        <div style="padding:10px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验评分</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="scoreFill" style="width:0%"></div></div>
                <span class="score-text" id="scoreText">0</span>
            </div>
        </div>
        <div style="padding:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="resetExperiment()">重置实验</button>
            <button class="btn btn-warning btn-sm" onclick="showDemo()">演示模式</button>
            <button class="btn btn-success btn-sm" onclick="submitExperiment()">提交报告</button>
        </div>
    </div>

    <div class="sim-area">
        <div class="sim-canvas-wrap">
            <canvas id="simCanvas"></canvas>
        </div>
        <div class="float-hint-panel" id="floatHintPanel">
            <div class="float-hint-header" id="floatHintHeader">
                <span>💡 实验提示</span>
                <button class="float-hint-close" onclick="toggleHintPanel()">×</button>
            </div>
            <div class="float-hint-body" id="hintBox">请按照左侧步骤依次完成实验。点击当前步骤可查看详细提示。</div>
        </div>
        <div class="console-area">
            <div class="console-header">
                <span id="consoleTitle">设备控制台</span>
                <div style="display:flex;gap:4px;align-items:center;">
                    <span style="font-size:11px;color:#94a3b8;">切换设备：</span>
                    <button class="sw-tab active" data-device="S1" onclick="switchDevice('S1')">S1</button>
                    <button class="sw-tab" data-device="S2" onclick="switchDevice('S2')">S2</button>
                    <button class="sw-tab" data-device="S3" onclick="switchDevice('S3')">S3</button>
                    <button class="sw-tab" data-device="PC1" onclick="switchDevice('PC1')">PC1</button>
                    <button class="sw-tab" data-device="PC2" onclick="switchDevice('PC2')">PC2</button>
                    <button class="sw-tab" data-device="PC3" onclick="switchDevice('PC3')">PC3</button>
                    <button class="sw-tab" data-device="PC4" onclick="switchDevice('PC4')">PC4</button>
                    <button class="btn btn-sm" style="background:#1a2150;color:#94a3b8;margin-left:6px;" onclick="clearConsole()">清屏</button>
                </div>
            </div>
            <div class="console-output" id="consoleOutput"></div>
            <div class="console-input-wrap">
                <span class="console-prompt" id="consolePrompt">&lt;S1&gt;</span>
                <input type="text" class="console-input" id="consoleInput" placeholder="输入命令后按回车..." onkeydown="handleCommand(event)">
            </div>
        </div>
    </div>

    <div class="info-panel">
        <div class="panel-card">
            <div class="panel-card-header">
                <span>MAC地址表</span>
                <span id="macTableDevice" style="font-size:11px;color:#94a3b8;">S1</span>
            </div>
            <div class="panel-card-body" id="macTableBody">
                <table class="mac-table">
                    <thead><tr><th>MAC地址</th><th>VLAN</th><th>端口</th><th>类型</th></tr></thead>
                    <tbody id="macTableTbody"><tr><td colspan="4" style="color:#94a3b8;text-align:center;">(空表)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header">
                <span>VLAN信息</span>
                <span id="vlanTableDevice" style="font-size:11px;color:#94a3b8;">S1</span>
            </div>
            <div class="panel-card-body" id="vlanInfoBody">
                <table class="mac-table">
                    <thead><tr><th>VLAN ID</th><th>名称</th><th>端口</th></tr></thead>
                    <tbody id="vlanTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">VLAN 1 (default)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header">
                <span>STP状态</span>
                <span id="stpTableDevice" style="font-size:11px;color:#94a3b8;">S1</span>
            </div>
            <div class="panel-card-body" id="stpInfoBody">
                <table class="stp-table">
                    <thead><tr><th>端口</th><th>角色</th><th>状态</th></tr></thead>
                    <tbody id="stpTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">STP未启用</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>当前帧信息</span></div>
            <div class="panel-card-body" id="frameInfoBody">
                <div class="frame-info" id="frameInfo">
                    <span class="label">等待帧传输..</span>
                </div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>步骤评判</span></div>
            <div class="panel-card-body" id="evalBody">
                <div style="color:#94a3b8;font-size:12px;">完成步骤后自动评估</div>
            </div>
        </div>
    </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <h2>实验报告</h2>
            <p id="resultSummary"></p>
            <div class="final-score" id="finalScore">0</div>
            <p style="font-size:14px;">总分（满00分）</p>
            <div id="resultDetails" style="text-align:left;margin:15px 0;font-size:13px;color:#94a3b8;line-height:2;"></div>
            <button class="btn btn-primary" onclick="document.getElementById('resultModal').classList.remove('show')">关闭</button>
            <button class="btn btn-success" onclick="LabReportGenerator.showConclusionDialog()" style="margin-left:10px;">生成实验报告</button>
        </div>
    </div>

    <script>
    var RAND_SUBNET = Math.floor(Math.random() * 9) + 1;
    var PC1_IP = '192.168.' + RAND_SUBNET + '.1';
    var PC2_IP = '192.168.' + RAND_SUBNET + '.2';
    var PC3_IP = '192.168.' + RAND_SUBNET + '.3';
    var PC4_IP = '192.168.' + RAND_SUBNET + '.4';
    var PC_GW = '192.168.' + RAND_SUBNET + '.254';

    var DEVICES = {
        S1: {
            type: 'switch', name: 'S1',
            macTable: {},
            vlans: { '1': { name: 'default', ports: ['G0/0/1','G0/0/2','G0/0/23','G0/0/24'] } },
            portMode: { 'G0/0/1':'access','G0/0/2':'access','G0/0/23':'trunk','G0/0/24':'trunk' },
            portVlan: { 'G0/0/1':1,'G0/0/2':1,'G0/0/23':'trunk','G0/0/24':'trunk' },
            stpPriority: 32768, stpRole: {}, stpState: {},
            x: 0, y: 0
        },
        S2: {
            type: 'switch', name: 'S2',
            macTable: {},
            vlans: { '1': { name: 'default', ports: ['G0/0/1','G0/0/2','G0/0/23','G0/0/24'] } },
            portMode: { 'G0/0/1':'access','G0/0/2':'access','G0/0/23':'trunk','G0/0/24':'trunk' },
            portVlan: { 'G0/0/1':1,'G0/0/2':1,'G0/0/23':'trunk','G0/0/24':'trunk' },
            stpPriority: 32768, stpRole: {}, stpState: {},
            x: 0, y: 0
        },
        S3: {
            type: 'switch', name: 'S3',
            macTable: {},
            vlans: { '1': { name: 'default', ports: ['G0/0/23','G0/0/24'] } },
            portMode: { 'G0/0/23':'trunk','G0/0/24':'trunk' },
            portVlan: { 'G0/0/23':'trunk','G0/0/24':'trunk' },
            stpPriority: 32768, stpRole: {}, stpState: {},
            x: 0, y: 0
        },
        PC1: { type:'pc', name:'PC1', ip:PC1_IP, mask:'255.255.255.0', mac:'5489-9800-0001', gateway:PC_GW, switch:'S1', port:'G0/0/1', arpTable:{}, x:0, y:0 },
        PC2: { type:'pc', name:'PC2', ip:PC2_IP, mask:'255.255.255.0', mac:'5489-9800-0002', gateway:PC_GW, switch:'S1', port:'G0/0/2', arpTable:{}, x:0, y:0 },
        PC3: { type:'pc', name:'PC3', ip:PC3_IP, mask:'255.255.255.0', mac:'5489-9800-0003', gateway:PC_GW, switch:'S2', port:'G0/0/1', arpTable:{}, x:0, y:0 },
        PC4: { type:'pc', name:'PC4', ip:PC4_IP, mask:'255.255.255.0', mac:'5489-9800-0004', gateway:PC_GW, switch:'S2', port:'G0/0/2', arpTable:{}, x:0, y:0 }
    };

    var LINKS = [
        { from:'S1', fromPort:'G0/0/1', to:'PC1', toPort:'' },
        { from:'S1', fromPort:'G0/0/2', to:'PC2', toPort:'' },
        { from:'S2', fromPort:'G0/0/1', to:'PC3', toPort:'' },
        { from:'S2', fromPort:'G0/0/2', to:'PC4', toPort:'' },
        { from:'S1', fromPort:'G0/0/23', to:'S2', toPort:'G0/0/23' },
        { from:'S1', fromPort:'G0/0/24', to:'S3', toPort:'G0/0/23' },
        { from:'S2', fromPort:'G0/0/24', to:'S3', toPort:'G0/0/24' }
    ];

    var STEPS = [
        { id:1, title:'查看交换机S1初始MAC地址表', hint:'第1步：切换到S1，输入display mac-address', score:5, evalFn:'evalStep1' },
        { id:2, title:'PC1 ping PC2观察MAC学习', hint:'第2步：切换到PC1，输入ping ' + PC2_IP, score:5, evalFn:'evalStep2' },
        { id:3, title:'查看S1的MAC地址表', hint:'第3步：切换到S1，输入display mac-address', score:5, evalFn:'evalStep3' },
        { id:4, title:'PC1 ping PC3观察泛洪', hint:'第4步：切换到PC1，输入ping ' + PC3_IP, score:5, evalFn:'evalStep4' },
        { id:5, title:'在S1上创建VLAN 10和VLAN 20', hint:'第5步：切换到S1，依次输入以下命令：\n1. system-view\n2. vlan 10\n3. name Sales\n4. quit\n5. vlan 20\n6. name Tech\n7. quit', score:5, evalFn:'evalStep5' },
        { id:6, title:'将S1的G0/0/1划入VLAN 10', hint:'第6步：在S1上，依次输入以下命令：\n1. system-view\n2. interface G0/0/1\n3. port link-type access\n4. port default vlan 10\n5. quit', score:5, evalFn:'evalStep6' },
        { id:7, title:'将S1的G0/0/2划入VLAN 20', hint:'第7步：在S1上，依次输入以下命令：\n1. system-view\n2. interface G0/0/2\n3. port link-type access\n4. port default vlan 20\n5. quit', score:5, evalFn:'evalStep7' },
        { id:8, title:'验证VLAN隔离（PC1 ping PC2失败）', hint:'第8步：切换到PC1，输入ping ' + PC2_IP, score:5, evalFn:'evalStep8' },
        { id:9, title:'在S2上创建VLAN 10和VLAN 20', hint:'第9步：切换到S2，依次输入以下命令：\n1. system-view\n2. vlan 10\n3. name Sales\n4. quit\n5. vlan 20\n6. name Tech\n7. quit', score:5, evalFn:'evalStep9' },
        { id:10, title:'将S2的G0/0/1划入VLAN 10，G0/0/2划入VLAN 20', hint:'第10步：在S2上，依次输入以下命令：\n1. system-view\n2. interface G0/0/1\n3. port link-type access\n4. port default vlan 10\n5. quit\n6. interface G0/0/2\n7. port link-type access\n8. port default vlan 20\n9. quit', score:5, evalFn:'evalStep10' },
        { id:11, title:'配置S1和S2的Trunk链路', hint:'第11步：先切换到S1，依次输入以下命令：\n1. system-view\n2. interface G0/0/23\n3. port link-type trunk\n4. port trunk allow-pass vlan 10 20\n5. quit\n再切换到S2，依次输入以下命令：\n1. system-view\n2. interface G0/0/23\n3. port link-type trunk\n4. port trunk allow-pass vlan 10 20\n5. quit', score:5, evalFn:'evalStep11' },
        { id:12, title:'验证跨交换机VLAN通信（PC1 ping PC3成功）', hint:'第12步：切换到PC1，输入ping ' + PC3_IP, score:5, evalFn:'evalStep12' },

    function drawTopology() {
        if (!ctx) return;
        var w = canvas.width, h = canvas.height;
        ctx.clearRect(0, 0, w, h);

        DEVICES.S1.x = w * 0.25; DEVICES.S1.y = h * 0.25;

        drawFramePackets();
    }

    function drawTextWithShadow(text, x, y, color, font) {
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawSwitch(x, y, name) {
        var sw = 110, sh = 55;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 2;
        roundRect(ctx, x - sw/2, y - sh/2, sw, sh, 8);
        ctx.fill(); ctx.stroke();

        var isRoot = (rootBridge === name);
        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        var subLabel = isRoot ? '根桥' : '交换机';
        drawTextWithShadow(subLabel, x, y + 10, isRoot ? '#22c55e' : '#ffe066', '11px Microsoft YaHei');

        var dev = DEVICES[name];
        var ports = Object.keys(dev.portMode);
        var portStartX = x - (ports.length - 1) * 12;
        for (var i = 0; i < ports.length; i++) {
            var px = portStartX + i * 24;
            var py = y + sh/2 + 2;
            var isBlocked = isStpBlocked(name, ports[i]);
            var isDown = portShutdown[name] && portShutdown[name][ports[i]];
            ctx.fillStyle = isDown ? '#666' : (isBlocked ? '#ef4444' : '#22c55e');
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawPC(x, y, name, pc) {
        var pw = 65, ph = 45;
        ctx.fillStyle = '#1e3355';
        ctx.strokeStyle = '#5b8dc9';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - pw/2, y - ph/2, pw, ph, 6);
        ctx.fill(); ctx.stroke();

        drawTextWithShadow(name, x, y - 12, '#ffffff', 'bold 12px Microsoft YaHei');
        drawTextWithShadow(pc.ip, x, y + 2, '#ffe066', '9px Consolas');
        drawTextWithShadow(pc.mac, x, y + 14, '#ffe066', '9px Consolas');
    }

    function drawLink(x1, y1, x2, y2, port, isBlocked) {
        ctx.beginPath();
        ctx.strokeStyle = isBlocked ? '#ef4444' : '#4a6a9a';
        ctx.lineWidth = isBlocked ? 1.5 : 2;
        ctx.setLineDash(isBlocked ? [6, 4] : []);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        ctx.setLineDash([]);

        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        drawTextWithShadow(port, mx, my - 8, '#ffe066', 'bold 9px Consolas');
        if (isBlocked) {
            drawTextWithShadow('阻塞', mx, my + 8, '#ef4444', 'bold 9px Microsoft YaHei');
        }
    }

    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    function drawFramePackets() {
        for (var i = 0; i < framePackets.length; i++) {
            var p = framePackets[i];
            ctx.save();
            ctx.globalAlpha = p.alpha || 1;
            ctx.fillStyle = p.color || '#fbbf24';
            ctx.strokeStyle = p.borderColor || '#f59e0b';
            ctx.lineWidth = 2;
            var lbl = p.label || 'FRAME';
            ctx.font = 'bold 13px Consolas';
            var tw = ctx.measureText(lbl).width;
            var pw = tw + 20, ph = 28;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, p.x - pw/2, p.y - ph/2, pw, ph, 6);
            ctx.fill(); ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            drawTextWithShadow(lbl, p.x, p.y, '#ffffff', 'bold 13px Consolas');
            ctx.restore();
        }
    }

    function isStpBlocked(deviceName, port) {
        var dev = DEVICES[deviceName];
        if (!dev || dev.type !== 'switch') return false;
        return dev.stpState[port] === 'Discarding';
    }

    function initSTP() {
        var switches = ['S1', 'S2', 'S3'];
        var minPri = 99999;
        var root = 'S1';
        for (var i = 0; i < switches.length; i++) {
            var s = DEVICES[switches[i]];
            if (s.stpPriority < minPri) {
                minPri = s.stpPriority;
                root = switches[i];
            }
        }
        rootBridge = root;
        computeStpRoles();
    }

    function computeStpRoles() {
        var switches = ['S1', 'S2', 'S3'];
        for (var i = 0; i < switches.length; i++) {
            var s = DEVICES[switches[i]];
            s.stpRole = {};
            s.stpState = {};
        }

        var root = DEVICES[rootBridge];
        root.stpRole = {};
        root.stpState = {};
        var rootPorts = Object.keys(root.portMode);
        for (var j = 0; j < rootPorts.length; j++) {
            var rp = rootPorts[j];
            if (isPortUp(rootBridge, rp)) {
                root.stpRole[rp] = 'Designated';
                root.stpState[rp] = 'Forwarding';
            }
        }

        var nonRoot = [];
        for (var k = 0; k < switches.length; k++) {
            if (switches[k] !== rootBridge) nonRoot.push(switches[k]);
        }

        for (var m = 0; m < nonRoot.length; m++) {
            var sw = DEVICES[nonRoot[m]];
            sw.stpRole = {};
            sw.stpState = {};
            var ports = Object.keys(sw.portMode);
            var rootPort = findRootPort(nonRoot[m]);
            for (var n = 0; n < ports.length; n++) {
                var pt = ports[n];
                if (!isPortUp(nonRoot[m], pt)) {
                    sw.stpRole[pt] = 'Disabled';
                    sw.stpState[pt] = 'Disabled';
                } else if (pt === rootPort) {
                    sw.stpRole[pt] = 'Root';
                    sw.stpState[pt] = 'Forwarding';
                } else {
                    var neighbor = getNeighbor(nonRoot[m], pt);
                    if (neighbor === rootBridge) {
                        sw.stpRole[pt] = 'Designated';
                        sw.stpState[pt] = 'Forwarding';
                    } else {
                    var neighborDev = DEVICES[neighbor];
                    var neighborPort = getReversePort(nonRoot[m], pt);
                    var neighborRootPort = (neighborDev && neighborDev.type === 'switch') ? findRootPort(neighbor) : null;
                    if (neighborRootPort === neighborPort) {
                        sw.stpRole[pt] = 'Designated';
                        sw.stpState[pt] = 'Forwarding';
                    } else if (neighborDev.stpPriority < sw.stpPriority ||
                        (neighborDev.stpPriority === sw.stpPriority && neighbor < nonRoot[m])) {
                        sw.stpRole[pt] = 'Alternate';
                        sw.stpState[pt] = 'Discarding';
                    } else {
                        sw.stpRole[pt] = 'Designated';
                        sw.stpState[pt] = 'Forwarding';
                    }
                    }
                }
            }
        }
    }

    function findRootPort(swName) {
        var sw = DEVICES[swName];
        if (!sw || !sw.portMode) return null;
        var ports = Object.keys(sw.portMode);
        for (var i = 0; i < ports.length; i++) {
            var neighbor = getNeighbor(swName, ports[i]);
            if (neighbor === rootBridge && isPortUp(swName, ports[i])) {
                return ports[i];
            }
        }
        for (var j = 0; j < ports.length; j++) {
            var nb = getNeighbor(swName, ports[j]);
            if (nb && DEVICES[nb].type === 'switch' && isPortUp(swName, ports[j])) {
                return ports[j];
            }
        }
        return ports[0];
    }

    function getNeighbor(deviceName, port) {
        for (var i = 0; i < LINKS.length; i++) {
            var lk = LINKS[i];
            if (lk.from === deviceName && lk.fromPort === port) return lk.to;
            if (lk.to === deviceName && lk.toPort === port) return lk.from;
        }
        return null;
    }

    function getReversePort(deviceName, port) {
        for (var i = 0; i < LINKS.length; i++) {
            var lk = LINKS[i];
            if (lk.from === deviceName && lk.fromPort === port) return lk.toPort;
            if (lk.to === deviceName && lk.toPort === port) return lk.fromPort;
        }
        return '';
    }

    function isPortUp(deviceName, port) {
        if (portShutdown[deviceName] && portShutdown[deviceName][port]) return false;
        var neighbor = getNeighbor(deviceName, port);
        if (neighbor && DEVICES[neighbor] && DEVICES[neighbor].type === 'switch') {
            var neighborPort = getReversePort(deviceName, port);
            if (neighborPort && portShutdown[neighbor] && portShutdown[neighbor][neighborPort]) return false;
        }
        return true;
    }

    function handleCommand(event) {
        if (event.key !== 'Enter') return;
        var input = document.getElementById('consoleInput');
        var cmd = input.value.trim();
        input.value = '';
        if (!cmd) return;

        var dev = DEVICES[currentDevice];

        if (dev.type === 'pc') {
            handlePCCommand(cmd);
        } else {
            handleSwitchCommand(cmd);
        }
        autoEvaluate();
    }

    function handlePCCommand(cmd) {
        var pc = DEVICES[currentDevice];
        var parts = cmd.split(/\s+/);
        var base = parts[0].toLowerCase();

        if (base === 'ping') {
            if (parts.length < 2) { consolePrint('用法: ping <IP地址>'); return; }
            var targetIp = parts[1];
            handlePing(currentDevice, targetIp);
        } else if (base === 'arp' && parts[1] === '-a') {
            handleArpA(currentDevice);
        } else if (base === 'ipconfig') {
            consolePrint('以太网适配器信号');
            consolePrint('  IP 地址 . . . . . . . . . : ' + pc.ip);
            consolePrint('  子网掩码 . . . . . . . . : ' + pc.mask);
            consolePrint('  默认网关 . . . . . . . . : ' + pc.gateway);
            consolePrint('  MAC 地址 . . . . . . . . : ' + pc.mac);
        } else if (base === '?' || base === 'help') {
            consolePrint('可用命令:');
            consolePrint('  ping <IP>     - 发送ping请求');
            consolePrint('  arp -a        - 查看ARP');
            consolePrint('  ipconfig      - 查看IP配置');
        } else {
            consolePrint('错误: 无法识别的命"' + cmd + '"');
            LabScoringEnhance.recordError(currentStep, cmd);
            consolePrint('输入 ? 查看可用命令');
        }
    }

    function handlePing(pcName, targetIp) {
        var pc = DEVICES[pcName];
        var targetPc = null;
        var pcNames = ['PC1','PC2','PC3','PC4'];
        for (var i = 0; i < pcNames.length; i++) {
            if (DEVICES[pcNames[i]].ip === targetIp) {
                targetPc = DEVICES[pcNames[i]];
                break;
            }
        }
        if (!targetPc) {
            consolePrint('Ping ' + targetIp + ': 目标主机不可达');
            return;
        }

        var srcSw = DEVICES[pc.switch];
        var dstSw = DEVICES[targetPc.switch];
        var srcVlan = srcSw.portVlan[pc.port];
        var dstVlan = dstSw.portVlan[targetPc.port];

        if (pc.switch === targetPc.switch) {
            if (srcVlan !== dstVlan) {
                consolePrint('Ping ' + targetIp + ': 来自不同VLAN，通信失败（VLAN隔离）');
                updateFrameInfo(pc.mac, targetPc.mac, pc.ip, targetPc.ip, '（VLAN隔离）');
                if (pcName === 'PC1' && targetPc.name === 'PC2' && srcVlan !== dstVlan) {
                    step8Done = true;
                }
                return;
            }
        } else {
            if (srcVlan !== dstVlan) {
                consolePrint('Ping ' + targetIp + ': 来自不同VLAN，通信失败（VLAN隔离）');
                updateFrameInfo(pc.mac, targetPc.mac, pc.ip, targetPc.ip, '（VLAN隔离）');
                return;
            }
            var trunkOk = checkTrunkOk(pc.switch, targetPc.switch, srcVlan);
            if (!trunkOk) {
                consolePrint('Ping ' + targetIp + ': Trunk链路未配置或未允许VLAN ' + srcVlan + '，通信失败');
                updateFrameInfo(pc.mac, targetPc.mac, pc.ip, targetPc.ip, 'Trunk不支持');
                return;
            }
        }

        var path = findPath(pcName, targetPc.name);
        if (!path) {
            consolePrint('Ping ' + targetIp + ': 目标主机不可达');
            return;
        }

        for (var j = 0; j < path.length; j++) {
            if (path[j].type === 'switch') {
                var sw = DEVICES[path[j].name];
                if (!sw.macTable[pc.mac]) {
                    sw.macTable[pc.mac] = { port: path[j].inPort, type: 'dynamic', vlan: srcVlan };
                }
            }
        }
        for (var k = path.length - 1; k >= 0; k--) {
            if (path[k].type === 'switch') {
                var sw2 = DEVICES[path[k].name];
                if (!sw2.macTable[targetPc.mac]) {
                    sw2.macTable[targetPc.mac] = { port: path[k].outPort, type: 'dynamic', vlan: dstVlan };
                }
            }
        }

        pc.arpTable[targetIp] = targetPc.mac;
        targetPc.arpTable[pc.ip] = pc.mac;

        animatePing(path, pc, targetPc, function() {
            consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=128');
            consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=128');
            consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=128');
            consolePrint('--- ' + targetIp + ' Ping统计 ---');
            consolePrint('  数据率 已发送3, 已接收3, 丢失=0');

            if (pcName === 'PC1' && targetPc.name === 'PC2') step2Done = true;
            if (pcName === 'PC1' && targetPc.name === 'PC3') step4Done = true;
            if (pcName === 'PC1' && targetPc.name === 'PC3') step12Done = true;

            updateInfoPanels();
            autoEvaluate();
        });
    }

    function checkTrunkOk(sw1, sw2, vlan) {
        var link = null;
        for (var i = 0; i < LINKS.length; i++) {
            if ((LINKS[i].from === sw1 && LINKS[i].to === sw2) ||
                (LINKS[i].from === sw2 && LINKS[i].to === sw1)) {
                if (DEVICES[LINKS[i].from].type === 'switch' && DEVICES[LINKS[i].to].type === 'switch') {
                    link = LINKS[i];
                    break;
                }
            }
        }
        if (!link) return false;

        var d1 = DEVICES[link.from], d2 = DEVICES[link.to];
        var p1 = link.fromPort, p2 = link.toPort;

        if (d1.portMode[p1] !== 'trunk' || d2.portMode[p2] !== 'trunk') return false;

        var allowed1 = d1.portVlan[p1];
        var allowed2 = d2.portVlan[p2];
        if (allowed1 === 'trunk') allowed1 = [1];
        else if (typeof allowed1 === 'string') allowed1 = allowed1.split(/\s+/).map(Number);
        else if (Array.isArray(allowed1)) { }
        else allowed1 = [allowed1];

        if (allowed2 === 'trunk') allowed2 = [1];
        else if (typeof allowed2 === 'string') allowed2 = allowed2.split(/\s+/).map(Number);
        else if (Array.isArray(allowed2)) { }
        else allowed2 = [allowed2];

        return allowed1.indexOf(vlan) >= 0 && allowed2.indexOf(vlan) >= 0;
    }

    function findPath(srcPc, dstPc) {
        var src = DEVICES[srcPc];
        var dst = DEVICES[dstPc];
        var srcSw = src.switch;
        var dstSw = dst.switch;

        if (srcSw === dstSw) {
            return [
                { type:'pc', name:srcPc },
                { type:'switch', name:srcSw, inPort:src.port, outPort:dst.port },
                { type:'pc', name:dstPc }
            ];
        }

        var interLink = null;
        for (var i = 0; i < LINKS.length; i++) {
            var lk = LINKS[i];
            if (lk.from === srcSw && lk.to === dstSw) { interLink = { fromPort: lk.fromPort, toPort: lk.toPort }; break; }
            if (lk.to === srcSw && lk.from === dstSw) { interLink = { fromPort: lk.toPort, toPort: lk.fromPort }; break; }
        }

        if (interLink) {
            var isBlocked1 = isStpBlocked(srcSw, interLink.fromPort);
            var isBlocked2 = isStpBlocked(dstSw, interLink.toPort);
            if (!isBlocked1 && !isBlocked2 && isPortUp(srcSw, interLink.fromPort) && isPortUp(dstSw, interLink.toPort)) {
                return [
                    { type:'pc', name:srcPc },
                    { type:'switch', name:srcSw, inPort:src.port, outPort:interLink.fromPort },
                    { type:'switch', name:dstSw, inPort:interLink.toPort, outPort:dst.port },
                    { type:'pc', name:dstPc }
                ];
            }
        }

        var viaS3 = findViaSwitch(srcSw, dstSw, 'S3', src, dst);
        if (viaS3) return viaS3;

        return null;
    }

    function findViaSwitch(srcSw, dstSw, via, src, dst) {
        var link1 = null, link2 = null;
        for (var i = 0; i < LINKS.length; i++) {
            var lk = LINKS[i];
            if ((lk.from === srcSw && lk.to === via) || (lk.to === srcSw && lk.from === via)) {
                var fp1 = lk.from === srcSw ? lk.fromPort : lk.toPort;
                var tp1 = lk.from === srcSw ? lk.toPort : lk.fromPort;
                if (!isStpBlocked(srcSw, fp1) && !isStpBlocked(via, tp1) && isPortUp(srcSw, fp1) && isPortUp(via, tp1)) {
                    link1 = { fromPort: fp1, toPort: tp1 };
                }
            }
            if ((lk.from === via && lk.to === dstSw) || (lk.to === via && lk.from === dstSw)) {
                var fp2 = lk.from === via ? lk.fromPort : lk.toPort;
                var tp2 = lk.from === via ? lk.toPort : lk.fromPort;
                if (!isStpBlocked(via, fp2) && !isStpBlocked(dstSw, tp2) && isPortUp(via, fp2) && isPortUp(dstSw, tp2)) {
                    link2 = { fromPort: fp2, toPort: tp2 };
                }
            }
        }
        if (link1 && link2) {
            return [
                { type:'pc', name:src.name },
                { type:'switch', name:srcSw, inPort:src.port, outPort:link1.fromPort },
                { type:'switch', name:via, inPort:link1.toPort, outPort:link2.fromPort },
                { type:'switch', name:dstSw, inPort:link2.toPort, outPort:dst.port },
                { type:'pc', name:dst.name }
            ];
        }
        return null;
    }

    function animatePing(path, srcPc, dstPc, callback) {
        if (animating) return;
        animating = true;

        if (demoMode) {
            animating = false;
            if (callback) callback();
            return;
        }

        var waypoints = [];
        for (var i = 0; i < path.length; i++) {
            var node = path[i];
            var dev = DEVICES[node.name];
            if (dev) waypoints.push({ x: dev.x, y: dev.y });
        }

        updateFrameInfo(srcPc.mac, dstPc.mac, srcPc.ip, dstPc.ip, 'ICMP Echo Request');

        var packet = { x: waypoints[0].x, y: waypoints[0].y, color: '#fbbf24', borderColor: '#f59e0b', label: 'ICMP', alpha: 1 };
        framePackets = [packet];

        var totalSegments = waypoints.length - 1;
        var currentSegment = 0;
        var step = 0;
        var stepsPerSegment = 30;

        function animate() {
            step++;
            var t = easeInOut(step / stepsPerSegment);
            var from = waypoints[currentSegment];
            var to = waypoints[currentSegment + 1];
            packet.x = from.x + (to.x - from.x) * t;
            packet.y = from.y + (to.y - from.y) * t;
            drawTopology();

            if (step >= stepsPerSegment) {
                currentSegment++;
                step = 0;
                if (currentSegment >= totalSegments) {
                    setTimeout(function() {
                        packet.color = '#4ade80';
                        packet.borderColor = '#22c55e';
                        packet.label = 'REPLY';
                        updateFrameInfo(dstPc.mac, srcPc.mac, dstPc.ip, srcPc.ip, 'ICMP Echo Reply');

                        var replySegment = totalSegments - 1;
                        var replyStep = 0;
                        function animateReply() {
                            replyStep++;
                            var rt = easeInOut(replyStep / stepsPerSegment);
                            var rFrom = waypoints[replySegment + 1];
                            var rTo = waypoints[replySegment];
                            packet.x = rFrom.x + (rTo.x - rFrom.x) * rt;
                            packet.y = rFrom.y + (rTo.y - rFrom.y) * rt;
                            drawTopology();
                            if (replyStep >= stepsPerSegment) {
                                replySegment--;
                                replyStep = 0;
                                if (replySegment < 0) {
                                    setTimeout(function() {
                                        framePackets = [];
                                        drawTopology();
                                        animating = false;
                                        if (callback) callback();
                                    }, 300);
                                    return;
                                }
                                setTimeout(function() { animFrame = requestAnimationFrame(animateReply); }, 1000);
                            } else {
                                animFrame = requestAnimationFrame(animateReply);
                            }
                        }
                        animFrame = requestAnimationFrame(animateReply);
                    }, 300);
                    return;
                }
                setTimeout(function() { animFrame = requestAnimationFrame(animate); }, 1000);
            }
            animFrame = requestAnimationFrame(animate);
        }
        animFrame = requestAnimationFrame(animate);
    }

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

            html += '<span class="step-icon">' + icon + '</span>';

    function autoEvaluate() {
        var changed = false;
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id]) continue;
            var result = window[s.evalFn]();
            if (result === 'pass' || result === 'fail') {
                stepResults[s.id] = result;
                showEvalResult(s.id, result);
                changed = true;
            }
        }
        if (changed) {
            var nextStep = 0;
            for (var j = 0; j < STEPS.length; j++) {
                if (!stepResults[STEPS[j].id]) { nextStep = STEPS[j].id; break; }
            }
            if (nextStep) { currentStep = nextStep; document.getElementById('hintBox').textContent = STEPS[nextStep - 1].hint; }
        }
        updateProgress();
        renderStepList();
    }

        document.getElementById('scoreFill').style.width = Math.round(totalScore * 0.8) + '%';
        document.getElementById('scoreText').textContent = Math.round(totalScore * 0.8) + '/80';

        for (var i = 0; i < STEPS.length; i++) {
            if (!stepResults[STEPS[i].id]) { nextStep = STEPS[i].id; break; }

    async function submitExperiment() {
        if (labScheduleState === 'not_started') { alert('实验未开放，不能提交报告'); return; }
        if (labScheduleState === 'ended') { alert('实验已结束，不能再提交报告'); return; }
        if (demoMode || demoUsed) {
            consolePrint('[提示] 演示模式下无法提交实验报告，请手动完成实验后提交换');
            return;
        }
        autoEvaluate();
        var passed = 0;
        var stepScore = 0;
        var details = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id] === 'pass') {
                passed++;
                stepScore += s.score;
                details += '步骤' + s.id + '. ' + s.title + ' ' + s.score + '<br>';
            } else {
                details += '步骤' + s.id + '. ' + s.title + ' 0<br>';
            }
        }

        var scoreResult = LabScoringEnhance.getFinalScore(stepScore, 100);
        details += '<br>--- 综合评价 ---<br>';
        details += LabScoringEnhance.formatDetails(scoreResult);

        document.getElementById('resultSummary').textContent = '共完成' + passed + '/' + STEPS.length + ' 个实验步骤';
        document.getElementById('finalScore').textContent = scoreResult.totalScore;
        document.getElementById('finalScore').style.color = scoreResult.totalScore >= 60 ? '#22c55e' : '#ef4444';
        document.getElementById('resultDetails').innerHTML = details;

        var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (currentUser.username && currentUser.type === 'student') {
            try {
                var labTitle = document.querySelector('.top-bar h1').textContent.trim();
                var reportEntry = {
                    labTitle: labTitle,
                    score: scoreResult.totalScore,
                    maxScore: 100,
                    submitTime: new Date().toISOString(),
                    mode: 'manual',
                    details: details,
                    baseScore: scoreResult.baseScore,
                    accuracyScore: scoreResult.accuracyScore,
                    efficiencyScore: scoreResult.efficiencyScore,
                    errorCount: scoreResult.errorCount,
                    elapsedMinutes: scoreResult.elapsedMinutes
                };
                var token = localStorage.getItem('authToken') || '';
                var res = await fetch(API_BASE + '/api/lab-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ studentId: currentUser.username, report: reportEntry })
                });
                var result = await res.json();
                if (result.error) console.error('提交报告失败:', result.error);
            } catch (e) { console.error('提交报告失败:', e); }
        }
        document.getElementById('resultModal').classList.add('show');

        stepResults[20] = passed >= STEPS.length - 1 ? 'pass' : 'fail';
        showEvalResult(20, stepResults[20]);
        updateProgress();
        renderStepList();
    }

    function toggleHintPanel() {
        var panel = document.getElementById('floatHintPanel');

            panel.classList.remove('hidden');
        } else {
            panel.classList.add('hidden');
        }

    (function() {
        var header = document.getElementById('floatHintHeader');
        var panel = document.getElementById('floatHintPanel');
        if (!header || !panel) return;
        var dragging = false, offsetX = 0, offsetY = 0;
        header.addEventListener('mousedown', function(e) {
            dragging = true;
            var rect = panel.getBoundingClientRect();
            var parentRect = panel.parentElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            panel.style.left = (rect.left - parentRect.left) + 'px';
            panel.style.top = (rect.top - parentRect.top) + 'px';
            panel.style.right = 'auto';
            panel.style.bottom = 'auto';
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            var parentRect = panel.parentElement.getBoundingClientRect();
            panel.style.left = (e.clientX - parentRect.left - offsetX) + 'px';
            panel.style.top = (e.clientY - parentRect.top - offsetY) + 'px';
        });
        document.addEventListener('mouseup', function() { dragging = false; });
    })();
    })();
    </script>
