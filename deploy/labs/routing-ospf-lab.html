    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', Arial, sans-serif; background: #0a0e27; color: #e0e0e0; min-height: 100vh; }
        .main-layout { display: grid; grid-template-columns: 280px 1fr 300px; grid-template-rows: auto 1fr; height: calc(100vh - 50px); }
        .top-bar { grid-column: 1/-1; background: linear-gradient(135deg, #1a1f3a 0%, #2d1b4e 100%); padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #4a90e2; }

        .top-bar .exp-info { font-size: 13px; color: #94a3b8; }

        .step-panel h3 { color: #38bdf8; font-size: 14px; padding: 8px; margin-bottom: 5px; border-bottom: 1px solid #1e2a5a; }
        .float-hint-panel { position: absolute; top: 10px; right: 10px; width: 340px; max-height: 200px; background: rgba(17,22,51,0.6); border: 1px solid rgba(245,158,11,0.4); border-radius: 10px; z-index: 9998; box-shadow: 0 4px 16px rgba(0,0,0,0.3); display: flex; flex-direction: column; overflow: hidden; }
        .float-hint-panel.hidden { display: none; }
        .float-hint-header { padding: 8px 12px; background: rgba(245,158,11,0.1); display: flex; justify-content: space-between; align-items: center; cursor: move; user-select: none; border-bottom: 1px solid rgba(245,158,11,0.3); }

        .float-hint-close:hover { color: #ef4444; }
        .float-hint-body { padding: 10px 12px; font-size: 12px; color: #fbbf24; line-height: 1.7; overflow-y: auto; max-height: 150px; white-space: pre-line; }
        .step-item { padding: 10px 12px; margin: 4px 0; border-radius: 8px; cursor: pointer; transition: all 0.3s; font-size: 13px; border-left: 3px solid transparent; line-height: 1.5; }
        .step-item:hover { background: rgba(56,189,248,0.1); }
        .step-item.active { background: rgba(56,189,248,0.15); border-left-color: #38bdf8; color: #fff; }
        .step-item.completed { border-left-color: #22c55e; }

        .step-item.failed { border-left-color: #ef4444; }
        .step-icon { margin-right: 6px; font-size: 14px; }
        .sim-area { background: #0d1230; position: relative; overflow: hidden; display: flex; flex-direction: column; }
        .sim-canvas-wrap { height: 320px; min-height: 260px; position: relative; flex-shrink: 0; }
        #simCanvas { width: 100%; height: 100%; display: block; }
        .console-area { flex: 1; background: #0b1025; border-top: 1px solid #1e2a5a; display: flex; flex-direction: column; min-height: 220px; }
        .console-header { padding: 6px 12px; background: #0f1535; font-size: 12px; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .console-output { flex: 1; overflow-y: auto; padding: 8px 12px; background: #0a0f22; font-family: 'Consolas', 'Courier New', monospace; font-size: 13px; line-height: 1.6; color: #a3e635; }
        .console-input-wrap { display: flex; border-top: 1px solid #1e2a5a; background: #0c1128; }
        .console-prompt { padding: 8px; color: #38bdf8; font-family: 'Consolas', monospace; font-size: 13px; white-space: nowrap; }
        .console-input { flex: 1; background: transparent; border: none; color: #a3e635; font-family: 'Consolas', monospace; font-size: 13px; padding: 8px 4px; outline: none; }
        .info-panel { background: #111633; border-left: 1px solid #1e2a5a; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
        .panel-card { background: #0d1230; border: 1px solid #1e2a5a; border-radius: 8px; overflow: hidden; }
        .panel-card-header { padding: 8px 12px; background: #151b3d; font-size: 13px; font-weight: bold; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .panel-card-body { padding: 10px 12px; font-size: 12px; max-height: 200px; overflow-y: auto; }
        .route-table { width: 100%; border-collapse: collapse; font-size: 11px; }

        .route-table tr.new-entry td { animation: macHighlight 1.5s ease; }
        @keyframes macHighlight { 0% { background: rgba(56,189,248,0.3); } 100% { background: transparent; } }
        .proto-direct { color: #22c55e; font-weight: bold; }
        .proto-static { color: #38bdf8; font-weight: bold; }
        .proto-rip { color: #fbbf24; font-weight: bold; }
        .proto-ospf { color: #c084fc; font-weight: bold; }
        .ospf-table { width: 100%; border-collapse: collapse; font-size: 11px; }
        .ospf-table th { background: #1a2150; color: #94a3b8; padding: 5px 6px; text-align: left; font-weight: normal; border-bottom: 1px solid #1e2a5a; }
        .ospf-table td { padding: 5px 6px; border-bottom: 1px solid #0d1230; color: #a3e635; font-family: 'Consolas', monospace; }
        .frame-info { font-size: 12px; line-height: 1.8; }
        .frame-info .label { color: #94a3b8; }
        .frame-info .value { color: #fbbf24; font-family: 'Consolas', monospace; }
        .eval-result { padding: 8px 12px; border-radius: 6px; font-size: 13px; margin-top: 6px; }
        .eval-pass { background: rgba(34,197,94,0.15); color: #22c55e; border: 1px solid rgba(34,197,94,0.3); }
        .eval-fail { background: rgba(239,68,68,0.15); color: #ef4444; border: 1px solid rgba(239,68,68,0.3); }
        .btn { padding: 6px 14px; border: none; border-radius: 6px; cursor: pointer; font-size: 12px; font-family: inherit; transition: all 0.3s; }
        .btn-primary { background: #4a90e2; color: white; }
        .btn-primary:hover { background: #357abd; }
        .btn-success { background: #22c55e; color: white; }
        .btn-success:hover { background: #16a34a; }
        .btn-warning { background: #f59e0b; color: #1a1a1a; }
        .btn-warning:hover { background: #d97706; }
        .btn-sm { padding: 4px 10px; font-size: 11px; }
        .score-bar { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
        .score-bar-track { flex: 1; height: 8px; background: #1a2150; border-radius: 4px; overflow: hidden; }
        .score-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; background: linear-gradient(90deg, #4a90e2, #22c55e); }
        .score-text { font-size: 14px; font-weight: bold; color: #38bdf8; min-width: 40px; text-align: right; }
        .sw-tab { padding: 3px 10px; border-radius: 4px; cursor: pointer; font-size: 11px; border: 1px solid #1e2a5a; background: #0d1230; color: #94a3b8; transition: all 0.3s; }
        .sw-tab.active { background: #4a90e2; color: #fff; border-color: #4a90e2; }
        .sw-tab:hover { background: #1a2150; }
        .sw-tab.active:hover { background: #357abd; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); z-index: 10000; align-items: center; justify-content: center; }
        .modal-overlay.show { display: flex; }
        .modal-box { background: #151b3d; border: 2px solid #4a90e2; border-radius: 12px; padding: 30px; max-width: 600px; width: 90%; text-align: center; }
        .modal-box h2 { color: #38bdf8; margin-bottom: 15px; }
        .modal-box p { color: #94a3b8; margin-bottom: 20px; line-height: 1.8; }
        .modal-box .final-score { font-size: 48px; color: #22c55e; font-weight: bold; margin: 15px 0; }
    </style>
</head>
<body>
    <div class="top-bar">
        <h1>实验三：路由协议综合实验</h1>
        <div class="exp-info">计算机网络实验教| 虚拟仿真实验 | 配套教材：基于华为eNSP</div>
    </div>

    <div class="main-layout">
    <div class="step-panel">
        <h3>实验步骤</h3>
        <div id="stepList"></div>
        <div style="padding:10px; margin-top:10px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验进度</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="progressFill" style="width:0%"></div></div>
                <span class="score-text" id="progressText">0%</span>
            </div>
        </div>
        <div style="padding:10px;">
            <div style="font-size:12px; color:#94a3b8; margin-bottom:6px;">实验评分</div>
            <div class="score-bar">
                <div class="score-bar-track"><div class="score-bar-fill" id="scoreFill" style="width:0%"></div></div>
                <span class="score-text" id="scoreText">0</span>
            </div>
        </div>
        <div style="padding:10px; display:flex; gap:8px; flex-wrap:wrap;">
            <button class="btn btn-primary btn-sm" onclick="resetExperiment()">重置实验</button>
            <button class="btn btn-warning btn-sm" onclick="showDemo()">演示模式</button>
            <button class="btn btn-success btn-sm" onclick="submitExperiment()">提交报告</button>
        </div>
    </div>

    <div class="sim-area">
        <div class="sim-canvas-wrap">
            <canvas id="simCanvas"></canvas>
        </div>
        <div class="float-hint-panel" id="floatHintPanel">
            <div class="float-hint-header" id="floatHintHeader">
                <span>💡 实验提示</span>
                <button class="float-hint-close" onclick="toggleHintPanel()">×</button>
            </div>
            <div class="float-hint-body" id="hintBox">请按照左侧步骤依次完成实验。点击当前步骤可查看详细提示。</div>
        </div>
        <div class="console-area">
            <div class="console-header">
                <span id="consoleTitle">设备控制台</span>
                <div style="display:flex;gap:4px;align-items:center;">
                    <span style="font-size:11px;color:#94a3b8;">切换设备：</span>
                    <button class="sw-tab active" data-device="AR1" onclick="switchDevice('AR1')">AR1</button>
                    <button class="sw-tab" data-device="AR2" onclick="switchDevice('AR2')">AR2</button>
                    <button class="sw-tab" data-device="AR3" onclick="switchDevice('AR3')">AR3</button>
                    <button class="sw-tab" data-device="PC1" onclick="switchDevice('PC1')">PC1</button>
                    <button class="sw-tab" data-device="PC2" onclick="switchDevice('PC2')">PC2</button>
                    <button class="sw-tab" data-device="PC3" onclick="switchDevice('PC3')">PC3</button>
                    <button class="btn btn-sm" style="background:#1a2150;color:#94a3b8;margin-left:6px;" onclick="clearConsole()">清屏</button>
                </div>
            </div>
            <div class="console-output" id="consoleOutput"></div>
            <div class="console-input-wrap">
                <span class="console-prompt" id="consolePrompt">&lt;AR1&gt;</span>
                <input type="text" class="console-input" id="consoleInput" placeholder="输入命令后按回车..." onkeydown="handleCommand(event)">
            </div>
        </div>
    </div>

    <div class="info-panel">
        <div class="panel-card">
            <div class="panel-card-header">
                <span>路由表</span>
                <span id="routeTableDevice" style="font-size:11px;color:#94a3b8;">AR1</span>
            </div>
            <div class="panel-card-body" id="routeTableBody">
                <table class="route-table">
                    <thead><tr><th>目的网络</th><th>协议</th><th>优先级</th><th>下一跳</th><th>接口</th></tr></thead>
                    <tbody id="routeTableTbody"><tr><td colspan="5" style="color:#94a3b8;text-align:center;">(无路由)</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header">
                <span>OSPF邻居信息</span>
                <span id="ospfTableDevice" style="font-size:11px;color:#94a3b8;">AR1</span>
            </div>
            <div class="panel-card-body" id="ospfInfoBody">
                <table class="ospf-table">
                    <thead><tr><th>邻居ID</th><th>状。</th><th>接口</th></tr></thead>
                    <tbody id="ospfTableTbody"><tr><td colspan="3" style="color:#94a3b8;text-align:center;">OSPF未启用</td></tr></tbody>
                </table>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>当前帧信息</span></div>
            <div class="panel-card-body" id="frameInfoBody">
                <div class="frame-info" id="frameInfo">
                    <span class="label">等待帧传输..</span>
                </div>
            </div>
        </div>

        <div class="panel-card">
            <div class="panel-card-header"><span>步骤评判</span></div>
            <div class="panel-card-body" id="evalBody">
                <div style="color:#94a3b8;font-size:12px;">完成步骤后自动评估</div>
            </div>
        </div>
    </div>
    </div>

    <div class="modal-overlay" id="resultModal">
        <div class="modal-box">
            <h2>实验报告</h2>

            <div class="final-score" id="finalScore">0</div>
            <p style="font-size:14px;">总分（满00分）</p>
            <div id="resultDetails" style="text-align:left;margin:15px 0;font-size:13px;color:#94a3b8;line-height:2;"></div>
            <button class="btn btn-primary" onclick="document.getElementById('resultModal').classList.remove('show')">关闭</button>
            <button class="btn btn-success" onclick="LabReportGenerator.showConclusionDialog()" style="margin-left:10px;">生成实验报告</button>
        </div>
    </div>

    <script>
    var RAND_MAJOR = Math.floor(Math.random() * 9) + 1;
    var NET1 = '10.' + RAND_MAJOR + '.1.0', NET2 = '10.' + RAND_MAJOR + '.2.0', NET3 = '10.' + RAND_MAJOR + '.3.0';
    var NET4 = '10.' + RAND_MAJOR + '.4.0', NET5 = '10.' + RAND_MAJOR + '.5.0', NET6 = '10.' + RAND_MAJOR + '.6.0';
    var RIP_NETWORK = '10.' + RAND_MAJOR + '.0.0';
    var AR1_G0_IP = '10.' + RAND_MAJOR + '.1.254', AR1_G1_IP = '10.' + RAND_MAJOR + '.2.1', AR1_G2_IP = '10.' + RAND_MAJOR + '.3.1';
    var AR2_G0_IP = '10.' + RAND_MAJOR + '.4.254', AR2_G1_IP = '10.' + RAND_MAJOR + '.2.2', AR2_G2_IP = '10.' + RAND_MAJOR + '.5.2';
    var AR3_G0_IP = '10.' + RAND_MAJOR + '.6.254', AR3_G1_IP = '10.' + RAND_MAJOR + '.3.2', AR3_G2_IP = '10.' + RAND_MAJOR + '.5.1';
    var PC1_IP = '10.' + RAND_MAJOR + '.1.1', PC1_GW = AR1_G0_IP;
    var PC2_IP = '10.' + RAND_MAJOR + '.4.1', PC2_GW = AR2_G0_IP;
    var PC3_IP = '10.' + RAND_MAJOR + '.6.1', PC3_GW = AR3_G0_IP;

    var DEVICES = {
        AR1: {
            type: 'router', name: 'AR1',
            interfaces: {
                'G0/0/0': { ip: '', mask: '', network: NET1, cidr: 24, peerDevice: 'S1' },
                'G0/0/1': { ip: '', mask: '', network: NET2, cidr: 24, peerDevice: 'AR2' },
                'G0/0/2': { ip: '', mask: '', network: NET3, cidr: 24, peerDevice: 'AR3' }
            },
            staticRoutes: [],
            ripEnabled: false,
            ripNetworks: [],
            ospfEnabled: false,
            ospfNetworks: [],
            routingTable: [],
            ospfPeers: [],
            x: 0, y: 0
        },
        AR2: {
            type: 'router', name: 'AR2',
            interfaces: {
                'G0/0/0': { ip: '', mask: '', network: NET4, cidr: 24, peerDevice: 'S2' },
                'G0/0/1': { ip: '', mask: '', network: NET2, cidr: 24, peerDevice: 'AR1' },
                'G0/0/2': { ip: '', mask: '', network: NET5, cidr: 24, peerDevice: 'AR3' }
            },
            staticRoutes: [],
            ripEnabled: false,
            ripNetworks: [],
            ospfEnabled: false,
            ospfNetworks: [],
            routingTable: [],
            ospfPeers: [],
            x: 0, y: 0
        },
        AR3: {
            type: 'router', name: 'AR3',
            interfaces: {
                'G0/0/0': { ip: '', mask: '', network: NET6, cidr: 24, peerDevice: 'S3' },
                'G0/0/1': { ip: '', mask: '', network: NET3, cidr: 24, peerDevice: 'AR1' },
                'G0/0/2': { ip: '', mask: '', network: NET5, cidr: 24, peerDevice: 'AR2' }
            },
            staticRoutes: [],
            ripEnabled: false,
            ripNetworks: [],
            ospfEnabled: false,
            ospfNetworks: [],
            routingTable: [],
            ospfPeers: [],
            x: 0, y: 0
        },
        S1: { type: 'switch', name: 'S1', x: 0, y: 0 },
        S2: { type: 'switch', name: 'S2', x: 0, y: 0 },
        S3: { type: 'switch', name: 'S3', x: 0, y: 0 },
        PC1: { type: 'pc', name: 'PC1', ip: PC1_IP, mask: '255.255.255.0', gateway: PC1_GW, connectedSwitch: 'S1', arpTable: {}, x: 0, y: 0 },
        PC2: { type: 'pc', name: 'PC2', ip: PC2_IP, mask: '255.255.255.0', gateway: PC2_GW, connectedSwitch: 'S2', arpTable: {}, x: 0, y: 0 },
        PC3: { type: 'pc', name: 'PC3', ip: PC3_IP, mask: '255.255.255.0', gateway: PC3_GW, connectedSwitch: 'S3', arpTable: {}, x: 0, y: 0 }
    };

    var LINKS = [
        { from: 'PC1', to: 'S1' },
        { from: 'S1', to: 'AR1', fromPort: 'G0/0/0', toPort: 'G0/0/0' },
        { from: 'AR1', to: 'AR2', fromPort: 'G0/0/1', toPort: 'G0/0/1' },
        { from: 'AR1', to: 'AR3', fromPort: 'G0/0/2', toPort: 'G0/0/1' },
        { from: 'AR2', to: 'AR3', fromPort: 'G0/0/2', toPort: 'G0/0/2' },
        { from: 'AR2', to: 'S2', fromPort: 'G0/0/0', toPort: 'G0/0/0' },
        { from: 'AR3', to: 'S3', fromPort: 'G0/0/0', toPort: 'G0/0/0' },
        { from: 'S2', to: 'PC2' },
        { from: 'S3', to: 'PC3' }
    ];

    var EXPECTED_IPS = {
        AR1: { 'G0/0/0': AR1_G0_IP, 'G0/0/1': AR1_G1_IP, 'G0/0/2': AR1_G2_IP },
        AR2: { 'G0/0/0': AR2_G0_IP, 'G0/0/1': AR2_G1_IP, 'G0/0/2': AR2_G2_IP },
        AR3: { 'G0/0/0': AR3_G0_IP, 'G0/0/1': AR3_G1_IP, 'G0/0/2': AR3_G2_IP }
    };

    var PEER_IFACE = {
        'AR1-G0/0/1': 'AR2-G0/0/1',
        'AR1-G0/0/2': 'AR3-G0/0/1',
        'AR2-G0/0/1': 'AR1-G0/0/1',
        'AR2-G0/0/2': 'AR3-G0/0/2',
        'AR3-G0/0/1': 'AR1-G0/0/2',
        'AR3-G0/0/2': 'AR2-G0/0/2'
    };

    var STEPS = [
        { id:1, title:'配置AR1的G0/0/0接口IP', hint:'第1步：切换到AR1，依次输入以下命令：\n1. system-view\n2. interface G0/0/0\n3. ip address ' + AR1_G0_IP + ' 255.255.255.0\n4. quit', score:4, evalFn:'evalStep1' },
        { id:2, title:'配置AR1的G0/0/1和G0/0/2接口IP', hint:'第2步：在AR1上，依次输入以下命令：\n1. interface G0/0/1\n2. ip address ' + AR1_G1_IP + ' 255.255.255.0\n3. quit\n4. interface G0/0/2\n5. ip address ' + AR1_G2_IP + ' 255.255.255.0\n6. quit', score:4, evalFn:'evalStep2' },
        { id:3, title:'配置AR2的三个接口IP', hint:'第3步：切换到AR2，依次输入以下命令：\n1. system-view\n2. interface G0/0/0\n3. ip address ' + AR2_G0_IP + ' 255.255.255.0\n4. quit\n5. interface G0/0/1\n6. ip address ' + AR2_G1_IP + ' 255.255.255.0\n7. quit\n8. interface G0/0/2\n9. ip address ' + AR2_G2_IP + ' 255.255.255.0\n10. quit', score:4, evalFn:'evalStep3' },
        { id:4, title:'配置AR3的三个接口IP', hint:'第4步：切换到AR3，依次输入以下命令：\n1. system-view\n2. interface G0/0/0\n3. ip address ' + AR3_G0_IP + ' 255.255.255.0\n4. quit\n5. interface G0/0/1\n6. ip address ' + AR3_G1_IP + ' 255.255.255.0\n7. quit\n8. interface G0/0/2\n9. ip address ' + AR3_G2_IP + ' 255.255.255.0\n10. quit', score:4, evalFn:'evalStep4' },
        { id:5, title:'查看AR1直连路由', hint:'第5步：切换到AR1，输入display ip routing-table', score:4, evalFn:'evalStep5' },

    function drawTextWithShadow(text, x, y, color, font) {
        ctx.font = font;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.strokeStyle = '#000000';
        ctx.lineWidth = 3;
        ctx.lineJoin = 'round';
        ctx.strokeText(text, x, y);
        ctx.fillStyle = color;
        ctx.fillText(text, x, y);
    }

    function drawRouter(x, y, name) {
        var rw = 110, rh = 55;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#c084fc';
        ctx.lineWidth = 2;
        roundRect(ctx, x - rw/2, y - rh/2, rw, rh, 8);
        ctx.fill(); ctx.stroke();

        drawTextWithShadow(name, x, y - 10, '#ffffff', 'bold 14px Microsoft YaHei');
        var dev = DEVICES[name];
        var configured = 0, total = 0;
        for (var iface in dev.interfaces) {
            total++;
            if (dev.interfaces[iface].ip) configured++;
        }
        var subLabel = configured + '/' + total + '接口已配置';
        drawTextWithShadow(subLabel, x, y + 10, configured === total ? '#22c55e' : '#ffe066', '11px Microsoft YaHei');

        var ports = Object.keys(dev.interfaces);
        var portStartX = x - (ports.length - 1) * 14;
        for (var i = 0; i < ports.length; i++) {
            var px = portStartX + i * 28;
            var py = y + rh/2 + 4;
            var hasIp = dev.interfaces[ports[i]].ip ? true : false;
            ctx.fillStyle = hasIp ? '#22c55e' : '#666';
            ctx.beginPath();
            ctx.arc(px, py, 3, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    function drawSwitch(x, y, name) {
        var sw = 80, sh = 40;
        ctx.fillStyle = '#1a3a6a';
        ctx.strokeStyle = '#4a90e2';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - sw/2, y - sh/2, sw, sh, 6);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 6, '#ffffff', 'bold 12px Microsoft YaHei');
        drawTextWithShadow('交换机', x, y + 10, '#ffe066', '10px Microsoft YaHei');
    }

    function drawPC(x, y, name, pc) {
        var pw = 65, ph = 45;
        ctx.fillStyle = '#1e3355';
        ctx.strokeStyle = '#5b8dc9';
        ctx.lineWidth = 1.5;
        roundRect(ctx, x - pw/2, y - ph/2, pw, ph, 6);
        ctx.fill(); ctx.stroke();
        drawTextWithShadow(name, x, y - 12, '#ffffff', 'bold 12px Microsoft YaHei');
        drawTextWithShadow(pc.ip, x, y + 2, '#ffe066', '9px Consolas');
        drawTextWithShadow('GW:' + pc.gateway, x, y + 14, '#ffe066', '8px Consolas');
    }

    function drawLink(x1, y1, x2, y2, port) {
        ctx.beginPath();
        ctx.strokeStyle = '#4a6a9a';
        ctx.lineWidth = 2;
        ctx.setLineDash([]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
        var mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
        drawTextWithShadow(port, mx, my - 8, '#ffe066', 'bold 9px Consolas');
    }

    function drawLinkSimple(x1, y1, x2, y2) {
        ctx.beginPath();
        ctx.strokeStyle = '#4a6a9a';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([]);
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }

    function roundRect(c, x, y, w, h, r) {
        c.beginPath();
        c.moveTo(x + r, y);
        c.lineTo(x + w - r, y);
        c.quadraticCurveTo(x + w, y, x + w, y + r);
        c.lineTo(x + w, y + h - r);
        c.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
        c.lineTo(x + r, y + h);
        c.quadraticCurveTo(x, y + h, x, y + h - r);
        c.lineTo(x, y + r);
        c.quadraticCurveTo(x, y, x + r, y);
        c.closePath();
    }

    function drawFramePackets() {
        for (var i = 0; i < framePackets.length; i++) {
            var p = framePackets[i];
            ctx.save();
            ctx.globalAlpha = p.alpha || 1;
            ctx.fillStyle = p.color || '#fbbf24';
            ctx.strokeStyle = p.borderColor || '#f59e0b';
            ctx.lineWidth = 2;
            var lbl = p.label || 'PKT';
            ctx.font = 'bold 13px Consolas';
            var tw = ctx.measureText(lbl).width;
            var pw = tw + 20, ph = 28;
            ctx.shadowColor = 'rgba(0,0,0,0.5)';
            ctx.shadowBlur = 8;
            ctx.shadowOffsetX = 2;
            ctx.shadowOffsetY = 2;
            roundRect(ctx, p.x - pw/2, p.y - ph/2, pw, ph, 6);
            ctx.fill(); ctx.stroke();
            ctx.shadowColor = 'transparent';
            ctx.shadowBlur = 0;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 0;
            drawTextWithShadow(lbl, p.x, p.y, '#ffffff', 'bold 13px Consolas');
            ctx.restore();
        }
    }

    var deviceViewState = {};

    function switchDevice(devName) {
        if (currentDevice && currentDevice !== devName) {
            deviceViewState[currentDevice] = { viewMode: viewMode, currentInterface: currentInterface, currentOspfArea: currentOspfArea };
        }
        currentDevice = devName;
        if (deviceViewState[devName]) {
            viewMode = deviceViewState[devName].viewMode;
            currentInterface = deviceViewState[devName].currentInterface;
            currentOspfArea = deviceViewState[devName].currentOspfArea;

            viewMode = 'user';

        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('active', tabs[i].getAttribute('data-device') === devName);

        updateInfoPanels();

        if (!consoleHistory[devName]) {
            consoleHistory[devName] = [];

        var output = document.getElementById('consoleOutput');
        output.innerHTML = '';

            if (viewMode === 'user') {
                prompt.textContent = '<' + currentDevice + '>';
            } else if (viewMode === 'system') {
                prompt.textContent = '[' + currentDevice + ']';
            } else if (viewMode === 'interface') {
                prompt.textContent = '[' + currentDevice + '-' + currentInterface + ']';
            } else if (viewMode === 'rip') {
                prompt.textContent = '[' + currentDevice + '-rip-1]';
            } else if (viewMode === 'ospf') {
                prompt.textContent = '[' + currentDevice + '-ospf-1]';
            } else if (viewMode === 'ospf-area') {
                prompt.textContent = '[' + currentDevice + '-ospf-1-area-0.0.0.0]';
            }
        }

    function handleCommand(event) {
        if (event.key !== 'Enter') return;

        var dev = DEVICES[currentDevice];

        if (dev.type === 'pc') {
            handlePCCommand(cmd);
        } else {
            handleRouterCommand(cmd);
        }
        autoEvaluate();

    function handlePCCommand(cmd) {
        var pc = DEVICES[currentDevice];
        var parts = cmd.split(/\s+/);
        var base = parts[0].toLowerCase();

        if (base === 'ping') {
            if (parts.length < 2) { consolePrint('用法: ping <IP地址>'); return; }
            handlePing(currentDevice, parts[1]);
        } else if (base === 'arp' && parts[1] === '-a') {
            handleArpA(currentDevice);
        } else if (base === 'ipconfig') {
            consolePrint('以太网适配器信号');
            consolePrint('  IP 地址 . . . . . . . . . : ' + pc.ip);
            consolePrint('  子网掩码 . . . . . . . . : ' + pc.mask);
            consolePrint('  默认网关 . . . . . . . . : ' + pc.gateway);
        } else if (base === 'think-routing') {
            handleThinkRouting();
        } else if (base === 'think-routing-answer') {
            if (parts.length < 3) { consolePrint('用法: think-routing-answer <题号> <答案>'); return; }
            handleThinkRoutingAnswer(parts[1], parts[2]);
        } else if (base === '?' || base === 'help') {
            consolePrint('可用命令:');
            consolePrint('  ping <IP>     - 发送ping请求');
            consolePrint('  arp -a        - 查看ARP表');
            consolePrint('  ipconfig      - 查看IP配置');
            consolePrint('  think-routing - 路由协议思考题');

            consolePrint('错误: 无法识别的命"' + cmd + '"');
            LabScoringEnhance.recordError(currentStep, cmd);
            consolePrint('输入 ? 查看可用命令');
        }
    }

    function handlePing(pcName, targetIp) {
        var pc = DEVICES[pcName];
        var gatewayRouter = findGatewayRouter(pc);
        if (!gatewayRouter) {
            consolePrint('Ping ' + targetIp + ': 默认网关不可');
            return;
        }

        var gwIface = findGatewayInterface(gatewayRouter, pc);
        if (!gwIface || !gwIface.ip) {
            consolePrint('Ping ' + targetIp + ': 网关接口未配置IP');
            updateFrameInfo(pc.ip, targetIp, '网关不可达');
            return;
        }

        if (targetIp === pc.gateway) {
            if (gwIface.ip) {
                if (pcName === 'PC1') step6Done = true;
                consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=255');
                consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=255');
                consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=255');

                consolePrint('--- ' + targetIp + ' Ping统计 ---');
                consolePrint('  数据率 已发送3, 已接收3, 丢失=0');
                updateFrameInfo(pc.ip, targetIp, 'ICMP Echo Request/Reply');
            }
            return;
        }

        if (isSameSubnet(pc.ip, pc.mask, targetIp)) {
            var targetPc = findPCByIp(targetIp);
            if (targetPc) {
                animatePingSuccess(pcName, targetIp, pc, targetPc);
            } else {
                consolePrint('Ping ' + targetIp + ': 目标主机不可达');
            }
            return;
        }

        var targetPc = findPCByIp(targetIp);
        if (!targetPc) {
            consolePrint('Ping ' + targetIp + ': 目标主机不可达');
            return;
        }

        var targetGatewayRouter = findGatewayRouter(targetPc);
        if (!targetGatewayRouter) {
            consolePrint('Ping ' + targetIp + ': 目标网关不可');
            return;
        }

        var routeResult = checkRoute(gatewayRouter, targetIp);
        if (!routeResult) {
            consolePrint('Ping ' + targetIp + ': 目标网络不可达（无路由）');
            updateFrameInfo(pc.ip, targetIp, '无路由');
            if (pcName === 'PC1' && targetIp === PC2_IP) {
                step7Done = true;
            }
            return;
        }

        var returnRouteResult = checkRoute(targetGatewayRouter, pc.ip);
        if (!returnRouteResult) {
            consolePrint('Ping ' + targetIp + ': 返回路由不可');
            updateFrameInfo(pc.ip, targetIp, '返回路由不可达');
            return;
        }

        animatePingSuccess(pcName, targetIp, pc, targetPc);
    }

    function animatePingSuccess(pcName, targetIp, pc, targetPc) {
        var path = buildPingPath(pcName, targetPc.name);

            consolePrint('Ping ' + targetIp + ': 路径不可');
            return;
        }

        pc.arpTable[targetIp] = targetPc.ip;
        targetPc.arpTable[pc.ip] = pc.ip;

        animatePing(path, pc, targetPc, function() {
            consolePrint('Ping ' + targetIp + ': 应答时间=1ms TTL=126');

            consolePrint('--- ' + targetIp + ' Ping统计 ---');
            consolePrint('  数据率 已发送3, 已接收3, 丢失=0');

            autoEvaluate();
        });

    function buildPingPath(srcPcName, dstPcName) {
        var src = DEVICES[srcPcName];
        var dst = DEVICES[dstPcName];
        var srcSw = src.connectedSwitch;
        var dstSw = dst.connectedSwitch;

        var srcRouter = findRouterForSwitch(srcSw);
        var dstRouter = findRouterForSwitch(dstSw);

        if (!srcRouter || !dstRouter) return null;

        if (srcRouter === dstRouter) {
            return [
                { name: srcPcName },
                { name: srcSw },
                { name: srcRouter },
                { name: dstSw },
                { name: dstPcName }
            ];
        }

        var midRouters = findMidRouters(srcRouter, dstRouter);
        if (midRouters.length === 0) {
            return [
                { name: srcPcName },
                { name: srcSw },
                { name: srcRouter },
                { name: dstRouter },
                { name: dstSw },
                { name: dstPcName }
            ];
        }

        var path = [{ name: srcPcName }, { name: srcSw }, { name: srcRouter }];
        for (var i = 0; i < midRouters.length; i++) {
            path.push({ name: midRouters[i] });
        }
        path.push({ name: dstRouter });
        path.push({ name: dstSw });
        path.push({ name: dstPcName });
        return path;
    }

    function findMidRouters(srcRouter, dstRouter) {
        if (srcRouter === 'AR1' && dstRouter === 'AR2') return [];
        if (srcRouter === 'AR1' && dstRouter === 'AR3') return [];
        if (srcRouter === 'AR2' && dstRouter === 'AR1') return [];
        if (srcRouter === 'AR2' && dstRouter === 'AR3') return [];
        if (srcRouter === 'AR3' && dstRouter === 'AR1') return [];
        if (srcRouter === 'AR3' && dstRouter === 'AR2') return [];
        return [];
    }

    function findGatewayRouter(pc) {
        var sw = pc.connectedSwitch;
        return findRouterForSwitch(sw);
    }

    function findRouterForSwitch(swName) {
        var routerNames = ['AR1', 'AR2', 'AR3'];
        for (var i = 0; i < routerNames.length; i++) {
            var r = DEVICES[routerNames[i]];
            for (var iface in r.interfaces) {
                if (r.interfaces[iface].peerDevice === swName) {
                    return routerNames[i];
                }
            }
        }
        return null;
    }

    function findGatewayInterface(routerName, pc) {
        var r = DEVICES[routerName];
        for (var iface in r.interfaces) {
            if (r.interfaces[iface].peerDevice === pc.connectedSwitch) {
                return r.interfaces[iface];
            }
        }
        return null;
    }

    function findPCByIp(ip) {
        var pcNames = ['PC1', 'PC2', 'PC3'];
        for (var i = 0; i < pcNames.length; i++) {
            if (DEVICES[pcNames[i]].ip === ip) return DEVICES[pcNames[i]];
        }
        return null;
    }

    function isSameSubnet(ip1, mask, ip2) {
        var p1 = ip1.split('.').map(Number);
        var p2 = ip2.split('.').map(Number);
        var m = mask.split('.').map(Number);
        for (var i = 0; i < 4; i++) {
            if ((p1[i] & m[i]) !== (p2[i] & m[i])) return false;
        }
        return true;
    }

    function checkRoute(routerName, targetIp) {
        computeRoutingTable(routerName);
        var table = DEVICES[routerName].routingTable;
        for (var i = 0; i < table.length; i++) {
            var route = table[i];
            if (route.proto === 'Direct') continue;
            if (isIpInNetwork(targetIp, route.network, route.mask)) {
                return route;
            }
        }
        for (var j = 0; j < table.length; j++) {
            var dr = table[j];
            if (dr.proto === 'Direct' && isIpInNetwork(targetIp, dr.network, dr.mask)) {
                return dr;
            }
        }
        return null;
    }

    function isIpInNetwork(ip, network, mask) {
        var p = ip.split('.').map(Number);
        var n = network.split('.').map(Number);
        var m = mask.split('.').map(Number);
        for (var i = 0; i < 4; i++) {
            if ((p[i] & m[i]) !== (n[i] & m[i])) return false;
        }
        return true;
    }

    function computeRoutingTable(routerName) {
        var router = DEVICES[routerName];
        var table = [];

        for (var iface in router.interfaces) {
            var ifConfig = router.interfaces[iface];
            if (ifConfig.ip) {
                table.push({
                    network: ifConfig.network,
                    mask: '255.255.255.0',
                    cidr: ifConfig.cidr,
                    proto: 'Direct',
                    pref: 0,
                    cost: 0,
                    nextHop: '',
                    iface: iface
                });
            }
        }

        for (var i = 0; i < router.staticRoutes.length; i++) {
            var sr = router.staticRoutes[i];
            table.push({
                network: sr.network,
                mask: sr.mask,
                cidr: maskToCidr(sr.mask),
                proto: 'Static',
                pref: 60,
                cost: 0,
                nextHop: sr.nextHop,
                iface: sr.iface || ''
            });
        }

        if (router.ospfEnabled) {
            var routers2 = ['AR1', 'AR2', 'AR3'];
            for (var m = 0; m < routers2.length; m++) {
                if (routers2[m] === routerName) continue;
                var other2 = DEVICES[routers2[m]];
                if (!other2.ospfEnabled) continue;
                var ospfRoutes = getLearnedRoutes(routerName, routers2[m], 'OSPF', 10);
                for (var n = 0; n < ospfRoutes.length; n++) {
                    if (!routeExists(table, ospfRoutes[n].network)) {
                        table.push(ospfRoutes[n]);
                    }
                }
            }
        }

        if (router.ripEnabled) {
            var routers = ['AR1', 'AR2', 'AR3'];
            for (var j = 0; j < routers.length; j++) {
                if (routers[j] === routerName) continue;
                var other = DEVICES[routers[j]];
                if (!other.ripEnabled) continue;
                var ripRoutes = getLearnedRoutes(routerName, routers[j], 'RIP', 100);
                for (var k = 0; k < ripRoutes.length; k++) {
                    if (!routeExists(table, ripRoutes[k].network)) {
                        table.push(ripRoutes[k]);
                    }
                }
            }
        }

        router.routingTable = table;
        return table;
    }

    function routeExists(table, network) {
        for (var i = 0; i < table.length; i++) {
            if (table[i].network === network) return true;
        }
        return false;
    }

    function getLearnedRoutes(srcRouter, dstRouter, proto, pref) {
        var routes = [];
        var other = DEVICES[dstRouter];
        var nextHopInfo = getNextHop(srcRouter, dstRouter);
        if (!nextHopInfo) return routes;

        for (var iface in other.interfaces) {
            var ifConfig = other.interfaces[iface];
            if (ifConfig.ip) {
                routes.push({
                    network: ifConfig.network,
                    mask: '255.255.255.0',
                    cidr: ifConfig.cidr,
                    proto: proto,
                    pref: pref,
                    cost: proto === 'RIP' ? 1 : 1,
                    nextHop: nextHopInfo.nextHop,
                    iface: nextHopInfo.iface
                });
            }
        }
        return routes;
    }

    function getNextHop(srcRouter, dstRouter) {
        var src = DEVICES[srcRouter];
        for (var iface in src.interfaces) {
            if (src.interfaces[iface].peerDevice === dstRouter) {
                var peerKey = dstRouter + '-' + getPeerIface(srcRouter, iface);
                var peerIface = getPeerIface(srcRouter, iface);
                var dst = DEVICES[dstRouter];
                if (dst.interfaces[peerIface] && dst.interfaces[peerIface].ip) {
                    return { nextHop: dst.interfaces[peerIface].ip, iface: iface };
                }
            }
        }
        return null;
    }

    function getPeerIface(srcRouter, srcIface) {
        var key = srcRouter + '-' + srcIface;
        var peer = PEER_IFACE[key];
        if (peer) {
            return peer.split('-')[1];
        }
        return '';
    }

    function maskToCidr(mask) {
        var parts = mask.split('.').map(Number);
        var cidr = 0;
        for (var i = 0; i < parts.length; i++) {
            var p = parts[i];
            while (p) { cidr += p & 1; p >>= 1; }
        }
        return cidr;
    }

    function computeOspfPeers(routerName) {
        var router = DEVICES[routerName];
        if (!router.ospfEnabled) { router.ospfPeers = []; return []; }
        var peers = [];
        var routers = ['AR1', 'AR2', 'AR3'];
        for (var i = 0; i < routers.length; i++) {
            if (routers[i] === routerName) continue;
            var other = DEVICES[routers[i]];
            if (!other.ospfEnabled) continue;
            for (var iface in router.interfaces) {
                if (router.interfaces[iface].peerDevice === routers[i]) {
                    if (router.interfaces[iface].ip) {
                        peers.push({
                            routerId: routers[i],
                            state: 'Full',
                            iface: iface,
                            deadTime: '36'
                        });
                    }
                }
            }
        }
        router.ospfPeers = peers;
        return peers;
    }

    function findOutgoingInterface(routerName, nextHop) {
        var router = DEVICES[routerName];
        var routers = ['AR1', 'AR2', 'AR3'];
        for (var i = 0; i < routers.length; i++) {
            if (routers[i] === routerName) continue;
            var other = DEVICES[routers[i]];
            for (var iface in other.interfaces) {
                if (other.interfaces[iface].ip === nextHop) {
                    for (var myIface in router.interfaces) {
                        if (router.interfaces[myIface].peerDevice === routers[i]) {
                            return myIface;
                        }
                    }
                }
            }
        }
        return '';

        return str;

    function animatePing(path, srcPc, dstPc, callback) {
        if (animating) return;
        animating = true;

        if (demoMode) {
            animating = false;
            if (callback) callback();
            return;
        }

        var waypoints = [];
        for (var i = 0; i < path.length; i++) {
            var dev = DEVICES[path[i].name];
            if (dev) waypoints.push({ x: dev.x, y: dev.y });
        }

        updateFrameInfo(srcPc.ip, dstPc.ip, 'ICMP Echo Request');

        var packet = { x: waypoints[0].x, y: waypoints[0].y, color: '#fbbf24', borderColor: '#f59e0b', label: 'ICMP', alpha: 1 };
        framePackets = [packet];

        var totalSegments = waypoints.length - 1;
        var currentSegment = 0;
        var step = 0;
        var stepsPerSegment = 30;

        function animate() {
            step++;
            var t = easeInOut(step / stepsPerSegment);
            var from = waypoints[currentSegment];
            var to = waypoints[currentSegment + 1];
            packet.x = from.x + (to.x - from.x) * t;
            packet.y = from.y + (to.y - from.y) * t;
            drawTopology();

            if (step >= stepsPerSegment) {
                currentSegment++;
                step = 0;
                if (currentSegment >= totalSegments) {
                    setTimeout(function() {
                        packet.color = '#4ade80';
                        packet.borderColor = '#22c55e';
                        packet.label = 'REPLY';
                        updateFrameInfo(dstPc.ip, srcPc.ip, 'ICMP Echo Reply');

                        var replySegment = totalSegments - 1;
                        var replyStep = 0;
                        function animateReply() {
                            replyStep++;
                            var rt = easeInOut(replyStep / stepsPerSegment);
                            var rFrom = waypoints[replySegment + 1];
                            var rTo = waypoints[replySegment];
                            packet.x = rFrom.x + (rTo.x - rFrom.x) * rt;
                            packet.y = rFrom.y + (rTo.y - rFrom.y) * rt;
                            drawTopology();
                            if (replyStep >= stepsPerSegment) {
                                replySegment--;
                                replyStep = 0;
                                if (replySegment < 0) {
                                    setTimeout(function() {
                                        framePackets = [];
                                        drawTopology();
                                        animating = false;
                                        if (callback) callback();
                                    }, 300);
                                    return;
                                }
                                setTimeout(function() { animFrame = requestAnimationFrame(animateReply); }, 1000);
                            } else {
                                animFrame = requestAnimationFrame(animateReply);
                            }
                        }
                        animFrame = requestAnimationFrame(animateReply);
                    }, 300);
                    return;
                }
                setTimeout(function() { animFrame = requestAnimationFrame(animate); }, 1000);
            }
            animFrame = requestAnimationFrame(animate);
        }
        animFrame = requestAnimationFrame(animate);
    }

    function easeInOut(t) { return t < 0.5 ? 2*t*t : -1+(4-2*t)*t; }

    function renderStepList() {
        var html = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            var cls = '';
            if (s.id === currentStep) cls = 'active';
            if (stepResults[s.id] === 'pass') cls += ' completed';
            if (stepResults[s.id] === 'fail') cls += ' failed';
            var icon = stepResults[s.id] === 'pass' ? '✅' : stepResults[s.id] === 'fail' ? '❌' : (s.id === currentStep ? '▶️' : '⏳');
            html += '<div class="step-item ' + cls + '" onclick="selectStep(' + s.id + ')">';
            html += '<span class="step-icon">' + icon + '</span>';
            html += '步骤' + s.id + '. ' + s.title;
            html += '</div>';
        }
        document.getElementById('stepList').innerHTML = html;
    }

    function selectStep(id) {
        currentStep = id;
        var step = STEPS[id - 1];
        document.getElementById('hintBox').textContent = step.hint;
        renderStepList();
    }

    function autoEvaluate() {
        var changed = false;
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id]) continue;
            var result = window[s.evalFn]();
            if (result === 'pass' || result === 'fail') {
                stepResults[s.id] = result;
                showEvalResult(s.id, result);
                changed = true;
            }
        }
        if (changed) {
            var nextStep = 0;
            for (var j = 0; j < STEPS.length; j++) {
                if (!stepResults[STEPS[j].id]) { nextStep = STEPS[j].id; break; }
            }
            if (nextStep) { currentStep = nextStep; document.getElementById('hintBox').textContent = STEPS[nextStep - 1].hint; }
        }
        updateProgress();
        renderStepList();
    }

        document.getElementById('scoreText').textContent = Math.round(totalScore * 0.8) + '/80';

        for (var i = 0; i < STEPS.length; i++) {

    async function submitExperiment() {
        if (labScheduleState === 'not_started') { alert('实验未开放，不能提交报告'); return; }
        if (labScheduleState === 'ended') { alert('实验已结束，不能再提交报告'); return; }
        if (demoMode || demoUsed) {
            consolePrint('[提示] 演示模式下无法提交实验报告，请手动完成实验后提交换');
            return;
        }
        autoEvaluate();
        var passed = 0;
        var stepScore = 0;
        var details = '';
        for (var i = 0; i < STEPS.length; i++) {
            var s = STEPS[i];
            if (stepResults[s.id] === 'pass') {
                passed++;
                stepScore += s.score;
                details += '步骤' + s.id + '. ' + s.title + ' ' + s.score + '<br>';
            } else {
                details += '步骤' + s.id + '. ' + s.title + ' 0<br>';
            }
        }

        var scoreResult = LabScoringEnhance.getFinalScore(stepScore, 100);
        details += '<br>--- 综合评价 ---<br>';
        details += LabScoringEnhance.formatDetails(scoreResult);

        document.getElementById('resultSummary').textContent = '共完成' + passed + '/' + STEPS.length + ' 个实验步骤';
        document.getElementById('finalScore').textContent = scoreResult.totalScore;
        document.getElementById('finalScore').style.color = scoreResult.totalScore >= 60 ? '#22c55e' : '#ef4444';
        document.getElementById('resultDetails').innerHTML = details;

        var currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        if (currentUser.username && currentUser.type === 'student') {
            try {
                var labTitle = document.querySelector('.top-bar h1').textContent.trim();
                var reportEntry = {
                    labTitle: labTitle,
                    score: scoreResult.totalScore,
                    maxScore: 100,
                    submitTime: new Date().toISOString(),
                    mode: 'manual',
                    details: details,
                    baseScore: scoreResult.baseScore,
                    accuracyScore: scoreResult.accuracyScore,
                    efficiencyScore: scoreResult.efficiencyScore,
                    errorCount: scoreResult.errorCount,
                    elapsedMinutes: scoreResult.elapsedMinutes
                };
                var token = localStorage.getItem('authToken') || '';
                var res = await fetch(API_BASE + '/api/lab-reports', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
                    body: JSON.stringify({ studentId: currentUser.username, report: reportEntry })
                });
                var result = await res.json();
                if (result.error) console.error('提交报告失败:', result.error);
            } catch (e) { console.error('提交报告失败:', e); }
        }
        document.getElementById('resultModal').classList.add('show');

        stepResults[26] = passed >= STEPS.length - 1 ? 'pass' : 'fail';
        showEvalResult(26, stepResults[26]);
        updateProgress();
        renderStepList();
    }

    </script>

    function toggleHintPanel() {
        var panel = document.getElementById('floatHintPanel');
        if (panel.classList.contains('hidden')) {
            panel.classList.remove('hidden');
        } else {
            panel.classList.add('hidden');
        }
    }

    (function() {
        var header = document.getElementById('floatHintHeader');
        var panel = document.getElementById('floatHintPanel');
        if (!header || !panel) return;
        var dragging = false, offsetX = 0, offsetY = 0;
        header.addEventListener('mousedown', function(e) {
            dragging = true;
            var rect = panel.getBoundingClientRect();
            var parentRect = panel.parentElement.getBoundingClientRect();
            offsetX = e.clientX - rect.left;
            offsetY = e.clientY - rect.top;
            panel.style.left = (rect.left - parentRect.left) + 'px';
            panel.style.top = (rect.top - parentRect.top) + 'px';
            panel.style.right = 'auto';
            panel.style.bottom = 'auto';
            e.preventDefault();
        });
        document.addEventListener('mousemove', function(e) {
            if (!dragging) return;
            var parentRect = panel.parentElement.getBoundingClientRect();
            panel.style.left = (e.clientX - parentRect.left - offsetX) + 'px';
            panel.style.top = (e.clientY - parentRect.top - offsetY) + 'px';
        });
        document.addEventListener('mouseup', function() { dragging = false; });
    })();
    })();
    </script>
