# TLS 切换编排覆盖（P5-A1）：与 docker-compose.yml 叠加使用
#
#   docker compose -f docker-compose.yml -f docker-compose.tls.yml up -d frontend
#
# 生效后：
#   - 宿主 80   -> 容器 80（全部 301 跳 HTTPS）
#   - 宿主 443  -> 容器 443（HTTPS 正式入口）
#   - 8088 仍保留（主线 HTTP），回滚只需去掉 -f docker-compose.tls.yml 重建
# 证书放 ./tls/certs/{fullchain.pem,privkey.pem}（不入库，.gitignore 已覆盖）。
services:
  frontend:
    ports:
      # 覆盖主线的 8088:80 —— 改为 80 明文跳转 + 443 正式入口；
      # 切换期间如需保留 8088 兜底，把下面这行改回 "8088:80" 并同步 nginx.https.conf 的跳转目标
      - "80:80"
      - "443:443"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      - ../app/dist/build/h5:/usr/share/nginx/m:ro
      # HTTPS 版 nginx 配置（80 跳转 + 443 证书）
      - ./nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ../media:/app/media:ro
      - ../staticfiles:/app/staticfiles:ro
      # 证书目录（fullchain.pem / privkey.pem）
      - ./tls/certs:/etc/nginx/certs:ro
