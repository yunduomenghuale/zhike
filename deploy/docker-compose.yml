# 智课系统 V2 生产编排（独立网络/卷/容器名，不影响服务器现有服务）
services:
  mysql:
    # 仅"自建库"场景使用，默认**不启动**——生产走服务器现有外部 MySQL
    # （192.10.0.3:3306/zk，见 .env.production 的 DATABASE_URL）。
    # 需要内置库时显式启用：docker compose --profile embedded-mysql up -d
    profiles: ["embedded-mysql"]
    # 生产数据库（MySQL 8.0）。不发布宿主端口，仅经 zhike_v2_net 供 backend 访问。
    # 时区表：mysql 官方镜像不含 /usr/share/zoneinfo，与 entrypoint 无关——
    # 首次初始化后需执行 backend/scripts/load_mysql_timezone.py 灌时区数据，
    # 否则 CONVERT_TZ 返回 NULL，看板按天统计会静默变空（见 docs/MySQL切换-实施设计与冲突评审.md C-13）。
    image: mysql:8.0.40
    container_name: zhike_v2_mysql
    restart: unless-stopped
    env_file: .env.mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
      - --max-allowed-packet=64M
      - --innodb-buffer-pool-size=1G
      - --slow-query-log=1
      - --long-query-time=1
      # 磁盘只有 ~24G 余量，binlog 保留 7 天、单个 256M 封顶
      - --binlog-expire-logs-seconds=604800
      - --max-binlog-size=256M
    volumes:
      - ../data/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    networks:
      - zhike_v2_net

  qdrant:
    # 向量库（RAG_VECTOR_BACKEND=qdrant 时的外置索引，见 docs/Qdrant向量库接入方案.md）。
    # 关键约定：
    # - 数据落在 ../data/qdrant（与 backend 的 ../data 挂载互不覆盖）；
    # - backend/worker **不 depends_on 本服务**：Qdrant 起不来时检索会自动回落
    #   MySQL（json 后端），把启动顺序做成硬依赖反而在故障时卡死整站；
    # - 宿主端口只绑 127.0.0.1：容器间走 zhike_v2_net 的 qdrant:6333，宿主端口
    #   仅供运维排查；不占用前端 8088，也不与现有服务冲突；
    # - 不接 bnet-test：向量库只给本系统用，不需要碰外部数据库网络。
    image: qdrant/qdrant:v1.12.4
    container_name: zhike_v2_qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - ../data/qdrant:/qdrant/storage
    environment:
      - QDRANT__TELEMETRY_DISABLED=true
      - QDRANT__LOG_LEVEL=WARN
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5
    # 1024 维向量常驻内存；片段数十万量级时再调大
    mem_limit: 1g
    networks:
      - zhike_v2_net

  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    image: zhike-v2-backend
    container_name: zhike_v2_backend
    restart: unless-stopped
    env_file: .env.production
    # 不写 depends_on mysql：生产用外部库（192.10.0.3），entrypoint 自带 60 次就绪重试；
    # 自建库场景用 --profile embedded-mysql 显式启用即可，无需硬依赖。
    # 后端不发布宿主端口，仅经 zhike_v2_net 供前端 nginx 反向代理
    # 数据全部 bind mount 到项目目录（数据盘 /data），不再使用根盘的 named volume
    volumes:
      - ../data:/app/data
      - ../media:/app/media
      - ../staticfiles:/app/staticfiles
      # 课程扩展资源预置静态页（思维导图/交互演示）：签名门控后由 Django 读出
      - ./resources:/app/resources:ro
      # 虚拟实验静态页：同资源门控（签名含发布状态），nginx /labs/ 已 404，仅 Django 可读
      - ./labs:/app/labs:ro
      # PPT 常用 Windows 中文字体 → 开源字体的替换映射（提升 LibreOffice 渲染保真度）
      - ./fonts.conf:/etc/fonts/local.conf:ro
    # LibreOffice 渲染 PPT 时内存较高，与 gunicorn 共享该额度。
    # 启用「系统内置本地模型」（管理端向量/重排序选 local）时，每 worker 懒加载
    # BGE-M3（约 2.3GB）+ Qwen3-Reranker（约 1.2GB）；2 workers 全启用建议 8g。
    # 未启用本地模型时不会加载，2g 足够。
    mem_limit: 8g
    # bnet-test：外部 MySQL（test-mysql80 容器，192.10.0.3:3306）所在网络，
    # 不加这个网络容器根本到不了数据库（跨 bridge 无路由）。
    # 该网络只存在于生产服务器（docker network create 由其他项目创建）；本地开发不用 compose。
    networks:
      - zhike_v2_net
      - bnet-test

  worker:
    # AI 长任务队列消费者（讲稿/配音/课件解析，见 docs/AI长任务队列化改造方案.md）。
    # 关键：必须显式覆盖 entrypoint——Dockerfile.backend 的 ENTRYPOINT 是
    # deploy-entrypoint.sh（migrate + exec gunicorn，不读 command 参数），
    # 只写 command 会让本服务静默变成第二个 gunicorn（评审 C3）。
    image: zhike-v2-backend
    container_name: zhike_v2_worker
    restart: unless-stopped
    entrypoint: ["python", "manage.py", "ai_worker"]
    command: []
    env_file: .env.production
    depends_on:
      # 迁移由 backend 独占（worker 不跑 migrate，启动自带 SELECT 1 FROM ai_task
      # 就绪自检，60 次重试）；service_started 即可——自检兜住迁移未完成的窗口。
      backend: { condition: service_started }
    stop_grace_period: 15s
    # 与 backend 对齐 8g：课件解析在 worker 内渲染（2×soffice ~0.8GB），
    # 若 embed 配 local 还会懒加载 BGE-M3 ~2.3GB（评审 C11）。
    mem_limit: 8g
    volumes:
      # 渲染锁库 /app/data/render-guard 与 LibreOffice profile 池 /app/data/lo-profiles
      # 必须跨容器共享，故不能放 /tmp（坑清单 4.1-4）；本地模型缓存在 /app/data/models。
      - ../data:/app/data
      - ../media:/app/media
      # PPT 渲染（soffice）在 worker 内发生，字体替换映射必须与 backend 一致
      - ./fonts.conf:/etc/fonts/local.conf:ro
    networks:
      - zhike_v2_net
      - bnet-test

  frontend:
    image: nginx:1.25-alpine
    container_name: zhike_v2_frontend
    restart: unless-stopped
    ports:
      # 对外 8088：华为云安全组已放行；主线曾改 5273 但安全组未放行该端口，保持 8088
      - "8088:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 移动端 H5（uni-app 产物，nginx /m/ 子路径；挂 html 之外，避免在 ro 的 dist 挂载内建目录）
      - ../app/dist/build/h5:/usr/share/nginx/m:ro
      # 实验静态页不再由 nginx 直出（/labs/ 已 404），改由 backend 签名门控读出
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../media:/app/media:ro
      - ../staticfiles:/app/staticfiles:ro
    mem_limit: 128m
    networks:
      - zhike_v2_net
    depends_on:
      - backend

networks:
  zhike_v2_net:
    name: zhike_v2_net
  # 外部 MySQL 所在网络（仅生产服务器存在，由其他项目创建）
  bnet-test:
    external: true
    name: bnet-test
