# 智课系统 V2 生产编排（独立网络/卷/容器名，不影响服务器现有服务）
services:
  backend:
    build:
      context: ../backend
      dockerfile: ../deploy/Dockerfile.backend
    image: zhike-v2-backend
    container_name: zhike_v2_backend
    restart: unless-stopped
    env_file: .env.production
    # 后端不发布宿主端口，仅经 zhike_v2_net 供前端 nginx 反向代理
    # 数据全部 bind mount 到项目目录（数据盘 /data），不再使用根盘的 named volume
    volumes:
      - ../data:/app/data
      - ../media:/app/media
      - ../staticfiles:/app/staticfiles
      # 课程扩展资源预置静态页（思维导图/交互演示）：签名门控后由 Django 读出
      - ./resources:/app/resources:ro
      # 虚拟实验静态页：同资源门控（签名含发布状态），nginx /labs/ 已 404，仅 Django 可读
      - ./labs:/app/labs:ro
      # PPT 常用 Windows 中文字体 → 开源字体的替换映射（提升 LibreOffice 渲染保真度）
      - ./fonts.conf:/etc/fonts/local.conf:ro
    # LibreOffice 渲染 PPT 时内存较高，与 gunicorn 共享该额度。
    # 启用「系统内置本地模型」（管理端向量/重排序选 local）时，每 worker 懒加载
    # BGE-M3（约 2.3GB）+ Qwen3-Reranker（约 1.2GB）；2 workers 全启用建议 8g。
    # 未启用本地模型时不会加载，2g 足够。
    mem_limit: 8g
    networks:
      - zhike_v2_net

  frontend:
    image: nginx:1.25-alpine
    container_name: zhike_v2_frontend
    restart: unless-stopped
    ports:
      # 对外 8088：华为云安全组已放行；主线曾改 5273 但安全组未放行该端口，保持 8088
      - "8088:80"
    volumes:
      - ../frontend/dist:/usr/share/nginx/html:ro
      # 移动端 H5（uni-app 产物，nginx /m/ 子路径；挂 html 之外，避免在 ro 的 dist 挂载内建目录）
      - ../app/dist/build/h5:/usr/share/nginx/m:ro
      # 实验静态页不再由 nginx 直出（/labs/ 已 404），改由 backend 签名门控读出
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../media:/app/media:ro
      - ../staticfiles:/app/staticfiles:ro
    mem_limit: 128m
    networks:
      - zhike_v2_net
    depends_on:
      - backend

networks:
  zhike_v2_net:
    name: zhike_v2_net
