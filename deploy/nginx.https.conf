# 智课系统 V2 前端 nginx —— HTTPS 版（P5-A1 模板，生产切换走单独授权）
#
# 与 nginx.conf（纯 HTTP）的差异：
#   1. 80 端口 server 全部 301 跳转 HTTPS（明文入口只做跳转，不再服务内容）；
#   2. 443 端口 server 挂载证书（/etc/nginx/certs/{fullchain.pem,privkey.pem}）；
#   3. 增加 HSTS / X-Content-Type-Options 安全头；
#      ⚠ nginx 规则：location 内一旦出现自己的 add_header，就不再继承 server 级的
#      add_header——所以安全头在每个带 add_header 的 location 里都要重复一行。
#   4. 证书续期后 `docker exec zhike_v2_frontend nginx -s reload` 平滑生效。
# 证书申请与端口放行步骤见 docs/test-reports/P5-生产切换清单.md。

# gzip 压缩：JS/CSS 体积约为原始的 1/3，显著加快首屏
gzip on;
gzip_types text/css application/javascript application/json image/svg+xml font/woff font/woff2;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;

# ---- 80：明文入口只做跳转（P5-A1）----
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# ---- 443：正式入口 ----
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # 证书挂载（compose override：./tls/certs -> /etc/nginx/certs）
    # 泛域名或单域名证书均可；fullchain 必须含中间证书链，否则部分客户端报证书不可信
    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Docker 容器重建后 IP 可能变化，使用内置 DNS 动态解析 backend，
    # 避免 Nginx 长期缓存旧地址而导致 /api 全部返回 502。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8000;

    # 作业 PDF / PPT、数字人视频（≤500MB）等大文件上传
    client_max_body_size 600m;

    location /api/ {
        proxy_pass $backend_upstream;
        # $http_host 保留访问端口：DRF FileField 序列化会用 Host 生成文件绝对 URL。
        # HTTPS 后经 443 访问，Host 是 https 端口，文件 URL 自然是 https，无需额外处理
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI 生成、TTS 配音等同步接口耗时较长
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    }

    # 危险扩展（HTML/SVG/JS）强制按二进制下载，防 media 同域存储型 XSS（与后端上传白名单双保险）
    location ~* ^/media/(?<media_path>.+\.(?:html?|svg|js))$ {
        alias /app/media/$media_path;
        types { }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff;
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    }

    # 用户上传的媒体文件（课件、作业附件等）
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    }

    # Django admin / DRF 页面静态资源
    location /static/ {
        alias /app/staticfiles/;
        expires 7d;
    }

    # 移动端 H5（uni-app 产物，子路径 /m/，history 路由回退）
    location /m/ {
        alias /usr/share/nginx/m/;
        index index.html;
        try_files $uri $uri/ /m/index.html;
    }

    # 虚拟实验静态页与课程资源同策略：一律经 /api/lab-gate/ 签名门控由 Django 读出
    # （签名含实验发布状态，下线/重签后旧直链即失效），nginx 显式 404 堵公开旁路
    location /labs/ {
        return 404;
    }

    # 课程扩展资源静态页（思维导图/交互演示）不再公开直出：
    # 入口页与资产一律经 /api/course-resources/ 签名门控由 Django 读出，
    # 这里显式 404，避免绕过发布状态直接访问预置页（旧链接/bookmark 也不会落到 SPA）
    location /resources/ {
        return 404;
    }

    # Vite 产物带内容 hash，可长期强缓存；刷新页面不再重复下载
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    }

    # 前端 SPA（history 路由回退到 index.html；入口文件不缓存，保证发版即生效）
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains" always;
    }
}
